<style>
:root{--ink:#4a2e1c;--ink2:#7a5536;--cream:#fff8ec;--bg:#f7e7cf;--card:#fffdf8;--line:#e8cfa9;--olive:#7d8f3a;--olive2:#5f6f26;--olivebg:#eef3d8;--gold:#f0b52e;--gold2:#c98a12;--red:#c0392b;
  --disp:"Baloo 2","Nunito",system-ui,sans-serif;--body:"Nunito",system-ui,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:700 16px/1.45 var(--body);min-height:100vh}
a{color:var(--olive2)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 40px}
header.top{position:sticky;top:0;z-index:5;background:rgba(247,231,207,.96);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-bottom:2px solid var(--line)}
.topin{max-width:720px;margin:0 auto;padding:10px 16px 10px;display:flex;align-items:center;gap:12px}
.topin img{width:52px;height:auto;flex:none}
.prog{flex:1;min-width:0}
.prog b{display:block;font:800 13px/1.2 var(--body);color:var(--ink2);margin-bottom:5px}
.bar{height:12px;border-radius:999px;background:#ead6b6;border:2px solid var(--ink);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(#a9c25a,var(--olive));transition:width .25s}
.lang{flex:none;display:flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--card)}
.lang button{all:unset;cursor:pointer;padding:6px 11px;font:900 13px/1 var(--body)}
.lang button[aria-pressed="true"]{background:var(--olive);color:#fff}
.lang button:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.card{background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 #dcc19a;padding:20px 18px;margin-top:18px}
.hero h1{font:800 clamp(24px,6vw,32px)/1.15 var(--disp);margin:0 0 6px}
.hero .sub{font:800 18px/1.3 var(--disp);color:var(--olive2);margin:0 0 12px}
.hero p{margin:0 0 10px;font-weight:700;color:var(--ink2)}
.hero p strong{color:var(--ink)}
.tip{display:flex;gap:10px;align-items:flex-start;background:var(--olivebg);border:2px solid #cbd79c;border-radius:14px;padding:10px 12px;margin-top:6px;font-size:14.5px}
.q{scroll-margin-top:90px}
.q h2{font:800 19px/1.25 var(--disp);margin:0 0 4px;display:flex;gap:10px;align-items:flex-start}
.q h2 .n{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--gold);border:2px solid var(--ink);font:900 14px/1 var(--body);margin-top:-1px}
.q .req{font-size:12.5px;font-weight:800;color:var(--ink2);margin:0 0 12px 40px}
.opts{display:grid;gap:9px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:12px;align-items:flex-start;width:100%;padding:12px 14px;border:2.5px solid var(--line);border-radius:16px;background:#fffaf0;transition:border-color .12s,background .12s}
.opt .dot{flex:none;width:22px;height:22px;border-radius:50%;border:2.5px solid var(--ink2);margin-top:1px;display:grid;place-items:center;background:#fff}
.opt .tx{min-width:0}
.opt .tx b{display:block;font:900 16px/1.25 var(--body)}
.opt .tx small{display:block;font:700 14px/1.35 var(--body);color:var(--ink2);margin-top:2px}
.opt:hover{border-color:#d6b98d}
.opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.opt[aria-checked="true"]{border-color:var(--olive2);background:var(--olivebg);box-shadow:0 3px 0 #b9c77f}
.opt[aria-checked="true"] .dot{border-color:var(--olive2);background:var(--olive)}
.opt[aria-checked="true"] .dot::after{content:'';width:8px;height:8px;border-radius:50%;background:#fff}
.q.eksik{border-color:var(--red);box-shadow:0 5px 0 #e3a79f}
.q .uyari{display:none;margin:10px 0 0;color:var(--red);font-weight:900;font-size:14px}
.q.eksik .uyari{display:block}
.ipuclari{margin:6px 0 12px;padding-left:20px;color:var(--ink2);font-size:14.5px}
.ipuclari li{margin:2px 0}
textarea{width:100%;min-height:180px;resize:vertical;border:2.5px solid var(--line);border-radius:16px;padding:12px 14px;font:700 16px/1.45 var(--body);color:var(--ink);background:#fffaf0}
textarea:focus{outline:none;border-color:var(--olive)}
.say{text-align:right;font-size:12.5px;color:var(--ink2);margin-top:4px}
.gonder{margin-top:20px;display:flex;flex-direction:column;align-items:center;gap:10px}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:12px 30px;border-radius:999px;border:3px solid var(--ink);background:linear-gradient(#a9c25a,var(--olive));color:#fff;font:800 19px/1 var(--disp);text-shadow:0 1px 0 rgba(0,0,0,.25);box-shadow:0 4px 0 var(--ink)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.btn[disabled]{opacity:.75;cursor:wait}
.btn.ikincil{background:var(--card);color:var(--ink);text-shadow:none;font-size:16px;min-height:46px}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid rgba(255,255,255,.45);border-top-color:#fff;animation:d .8s linear infinite}
@keyframes d{to{transform:rotate(360deg)}}
.hata{display:none;width:100%;background:#fdeceb;border:2px solid #e3a79f;color:var(--red);border-radius:14px;padding:10px 12px;font-weight:800;font-size:14.5px;text-align:center}
.hata.on{display:block}
.not{font-size:13px;color:var(--ink2);text-align:center;margin-top:22px;line-height:1.5}
.durum{text-align:center}
.durum img{width:120px;height:auto}
.durum h1{font:800 26px/1.2 var(--disp);margin:8px 0 8px}
.durum p{color:var(--ink2);margin:0 0 10px}
.imza{font:800 16px/1.4 var(--disp);color:var(--ink);margin-top:14px}
#konfeti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
#konfeti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:k 1.6s ease-in forwards}
@keyframes k{to{transform:translateY(105vh) rotate(540deg);opacity:.9}}
@media (prefers-reduced-motion:reduce){#konfeti{display:none}.bar i{transition:none}}
[hidden]{display:none!important}
</style>

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function t(k){return T[L||'tr'][k]}
function rpc(n,b){return fetch(SBU+n,{method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},body:JSON.stringify(b||{})}).then(function(r){if(!r.ok){var e=new Error('http '+r.status);e.http=r.status;throw e}return r.json()})}
function kaydet(){ls(DK,JSON.stringify({a:A,y:YORUM,l:L}))}
function yukleTaslak(){try{var d=JSON.parse(ls(DK)||'null');if(d&&d.a){A=d.a;YORUM=d.y||'';if(!L&&d.l)L=d.l;return Object.keys(A).length>0||!!YORUM}}catch(e){}return false}
function setDil(l){L=l;document.documentElement.lang=l;document.title=t('title');document.querySelectorAll('.lang [data-l]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.l===l))});kaydet();ciz()}
document.querySelectorAll('.lang [data-l]').forEach(function(b){b.onclick=function(){setDil(b.dataset.l)}});
function ilerleme(){var n=Q.filter(function(q){return A[q.id]}).length;$('progT').textContent=T[L].prog(n);$('progI').style.width=(n*10)+'%';$('progB').setAttribute('aria-valuenow',n)}
function $(i){return document.getElementById(i)}
function durumKart(img,h,p,ek){$('ana').innerHTML='<div class="card durum"><img src="../site/logo.svg" alt="TabbyChef"><h1>'+h+'</h1>'+p+(ek||'')+'</div>'}
function ciz(){var m=$('ana');document.title=t('title');
  if(durum==='yukle'){$('ust').hidden=true;m.innerHTML='<div class="card durum"><img src="../site/logo.svg" alt="TabbyChef"><p>'+t('loading')+'</p></div>';return}
  if(durum==='yukhata'){$('ust').hidden=false;durumKart(0,t('loaderr'),'<p>'+t('neterr')+'</p>','<button class="btn ikincil" type="button" id="tekrar">'+t('retry')+'</button>');$('tekrar').onclick=basla;ilerlemeGizle();return}
  if(durum==='yok'){$('ust').hidden=false;ilerlemeGizle();durumKart(0,t('nolink'),'<p>'+t('nolink2')+'</p>');return}
  if(durum==='gecersiz'){$('ust').hidden=false;ilerlemeGizle();durumKart(0,t('bad'),'<p>'+t('bad2')+'<a href="mailto:destek@tabbychef.app">destek@tabbychef.app</a></p>');return}
  if(durum==='bitti'){$('ust').hidden=false;ilerlemeGizle();durumKart(0,t('done'),'<p>'+t('done2')+'</p>');return}
  if(durum==='tesekkur'){$('ust').hidden=false;ilerlemeGizle();durumKart(0,esc(t('thx')),'<p><b>'+t('thx1')+'</b></p><p>'+t('thx2')+'</p><p>'+t('thx3')+'</p><div class="imza">'+t('team')+'</div>');return}
  $('ust').hidden=false;$('ust').querySelector('.prog').hidden=false;var h='';
  h+='<section class="card hero"><h1>'+t('title')+'</h1><p class="sub">'+t('sub')+'</p><p><strong>'+t('hello')+'</strong></p><p>'+t('p1')+'</p><p>'+t('p2')+'</p><div class="tip"><span aria-hidden="true">⏱️</span><span>'+t('tip')+'</span></div>'+(durum==='taslak'?'<div class="tip" style="margin-top:8px"><span aria-hidden="true">💾</span><span>'+t('draft')+'</span></div>':'')+'</section>';
  Q.forEach(function(q,i){h+='<section class="card q" id="'+q.id+'" role="radiogroup" aria-labelledby="'+q.id+'h"><h2 id="'+q.id+'h"><span class="n">'+(i+1)+'</span><span>'+esc(q[L])+'</span></h2><p class="req">'+t('req')+'</p><div class="opts">';
    q.o.forEach(function(o){var s=A[q.id]===o[0];h+='<button type="button" class="opt" role="radio" aria-checked="'+s+'" data-q="'+q.id+'" data-o="'+o[0]+'"><span class="dot" aria-hidden="true"></span><span class="tx"><b>'+esc(L==='en'?o[3]:o[1])+'</b><small>'+esc(L==='en'?o[4]:o[2])+'</small></span></button>'});
    h+='</div><p class="uyari" role="alert">'+t('eksik')+'</p></section>'});
  h+='<section class="card q" id="q11"><h2><span class="n">11</span><span>'+t('q11')+'</span></h2><p class="req" style="margin-left:40px">'+t('q11s')+'</p><ul class="ipuclari">'+t('ip').map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul><label for="yorum" class="sr" hidden>'+t('q11')+'</label><textarea id="yorum" maxlength="5000" placeholder="'+esc(t('ph'))+'"></textarea><div class="say"><span id="say">0</span> / 5000</div></section>';
  h+='<div class="gonder"><div class="hata" id="hata" role="alert"></div><button class="btn" type="button" id="gonderB">'+t('send')+'</button></div><p class="not">'+t('note')+'<a href="'+t('privUrl')+'" target="_blank" rel="noopener">'+t('privacy')+'</a>.</p>';
  m.innerHTML=h;var ta=$('yorum');ta.value=YORUM;$('say').textContent=ta.value.length;
  ta.oninput=function(){YORUM=ta.value;$('say').textContent=ta.value.length;kaydet()};
  m.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){sec(b.dataset.q,b.dataset.o)};b.onkeydown=function(e){var k=e.key;if(k!=='ArrowDown'&&k!=='ArrowUp'&&k!=='ArrowRight'&&k!=='ArrowLeft')return;e.preventDefault();var l=[].slice.call(b.parentNode.children),i=l.indexOf(b),n=l[(i+(k==='ArrowDown'||k==='ArrowRight'?1:l.length-1))%l.length];n.focus();sec(n.dataset.q,n.dataset.o)}});
  $('gonderB').onclick=gonder;ilerleme()}
function ilerlemeGizle(){$('ust').querySelector('.prog').hidden=true}
function sec(q,o){A[q]=o;kaydet();var s=$(q);s.classList.remove('eksik');s.querySelectorAll('.opt').forEach(function(b){b.setAttribute('aria-checked',String(b.dataset.o===o))});ilerleme()}
function hata(m){var e=$('hata');e.textContent=m;e.classList.toggle('on',!!m)}
function btnDurum(on){var b=$('gonderB');if(!b)return;b.disabled=on;b.innerHTML=on?'<span class="spin" aria-hidden="true"></span>'+t('sending'):t('send')}
function gonder(){if(gonderiyor)return;hata('');var eks=Q.filter(function(q){return !A[q.id]});
  Q.forEach(function(q){$(q.id).classList.toggle('eksik',!A[q.id])});
  if(eks.length){hata(T[L].missing(eks.length));var f=$(eks[0].id);window.scrollTo({top:f.getBoundingClientRect().top+window.scrollY-($('ust').offsetHeight+12),behavior:'smooth'});var o=f.querySelector('.opt');if(o)setTimeout(function(){o.focus({preventScroll:true})},400);return}
  gonderiyor=true;btnDurum(true);var c={};Q.forEach(function(q){c[q.id]=A[q.id]});
  rpc('bf_gonder',{p_token:TOKEN,p_cevap:c,p_yorum:YORUM,p_dil:L,p_oyun_surumu:VER||null,p_form_surumu:FORM_SURUM}).then(function(r){gonderiyor=false;
    if(r&&r.ok){ls(DK,null);durum='tesekkur';ciz();window.scrollTo(0,0);konfeti();return}
    btnDurum(false);var e=r&&r.err;if(e==='already'){ls(DK,null);durum='bitti';ciz();return}if(e==='token'){durum='gecersiz';ciz();return}hata(e==='answers'?t('ansErr'):t('srverr'))
  }).catch(function(x){gonderiyor=false;btnDurum(false);hata(navigator.onLine===false||!x.http?t('neterr'):t('srverr'))})}
function konfeti(){var k=$('konfeti'),c=['#f0b52e','#7d8f3a','#e9a25a','#f2a6a0','#4a2e1c'];for(var i=0;i<46;i++){var e=document.createElement('i');e.style.left=Math.random()*100+'%';e.style.background=c[i%c.length];e.style.animationDelay=(Math.random()*0.5)+'s';e.style.transform='rotate('+(Math.random()*90)+'deg)';k.appendChild(e)}setTimeout(function(){k.innerHTML=''},2600)}
function basla(){if(!TOKEN){durum='yok';if(!L)L=(navigator.language||'').slice(0,2)==='en'?'en':'tr';setDil(L);return}
  durum='yukle';if(!L)L='tr';ciz();
  rpc('bf_kontrol',{p_token:TOKEN}).then(function(r){if(!r||!r.ok){durum='gecersiz';if(!P.get('lang'))L=L||'tr';setDil(L);return}
    if(!P.get('lang')&&!yukleTaslakL())L=r.lang==='en'?'en':'tr';
    if(r.done){ls(DK,null);durum='bitti';setDil(L);return}
    durum=yukleTaslak()?'taslak':'form';setDil(L)}).catch(function(){durum='yukhata';setDil(L||'tr')})}
function yukleTaslakL(){try{var d=JSON.parse(ls(DK)||'null');if(d&&d.l){L=d.l;return true}}catch(e){}return false}
addEventListener('online',function(){if(durum==='yukhata')basla()});
basla();
})();
</script>
</body>
</html>
