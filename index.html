function applyState(){applyWall(S.wall);applyFloor(S.floor);for(const k in S.equip)if(S.equip[k]>1)setEquip(k,S.equip[k]);
  let moved=0,stored=0;
  for(const rec of S.furniture)if(!rec.stored){const k=CAT[rec.id].kind;if(k==='walldecor'&&(rec.slot==null||rec.slot<0))continue;
    if(k!=='walldecor'&&validatePlacement(rec,rec.uid)){const o={x:rec.x,z:rec.z,rot:rec.rot};let ok=false;
      outer:for(let r=0.35;r<6;r+=0.35)for(let a=0;a<16;a++){const t=a/16*Math.PI*2;for(const rot of [rec.rot||0,(rec.rot||0)+1]){rec.x=Math.round((o.x+Math.cos(t)*r)*20)/20;rec.z=Math.round((o.z+Math.sin(t)*r)*20)/20;rec.rot=rot%4;if(!validatePlacement(rec,rec.uid)){ok=true;break outer}}}
      if(ok)moved++;else{Object.assign(rec,o);rec.stored=true;stored++;continue}}
    spawnFurn(rec)}
  refreshWorld();if(moved||stored){markDirty();setTimeout(()=>toast(`Kasa için yer açıldı: ${moved?moved+' eşya taşındı':''}${moved&&stored?', ':''}${stored?stored+' eşya depoya kaldırıldı':''}`,ic('box'),4200),1500)}
  if(S._moved7){delete S._moved7;markDirty();setTimeout(()=>toast('<b>Kafen yenilendi!</b><br>Artık 2 dört kişilik ve 2 iki kişilik masan var (12 kişi). Eski masaların Market → Depom’da.',ic('table'),5200),2500)}
  hudXP();hudCoins();hudGoal();hudGems()}
async function init(){
  try{
    const hadSave=loadState();applyState();
    const g=await loadGLB('models/yosun.txt',p=>introProgress(p));GLTF=g;TEMPLATE=SkeletonUtils.clone(g.scene); // el değmemiş kopya: müşteriler Yosun'un o anki pozunu/tepsisini devralmasın
    for(const c of g.animations){if(c.name==='walking_2')continue;c.tracks=c.tracks.filter(t=>!/Toe|Hand(Thumb|Middle)/.test(t.name));c.resetDuration();CLIPS[c.name]=c}buildPoseClips();
    await new Promise(r=>setTimeout(r,30));
    const baseMat=(()=>{let m;g.scene.traverse(o=>{if(o.isMesh&&!m)m=o.material});return m})();const src=baseMat.map.image;
    for(const L of LOOKS)L.tex=recolor(src,L.W,L.B,L.A,null);POSA_LOOK.tex=recolor(src,POSA_LOOK.W,POSA_LOOK.B,POSA_LOOK.A,POSA_LOOK.DK);
    // ekip: kayıtlı görünümlerle (yoksa varsayılan Yosun / Poşa / Fındık)
    custPrepare();LOOKS.forEach((L,i)=>L.tex=customerTex(L,i));VIP_LOOK.tex=customerTex(VIP_LOOK,1);if(!S.chars)S.chars=charsDefault();
    for(const key of allStaffKeys()){const role=roleOfKey(key);if(!S.chars[key])S.chars[key]=newHireCfg(key);const c=S.chars[key];c.look={...LOOK_DEF,...(c.look||{})};if(c.look.whisk==='none')c.look.whisk='short';c.wear.top='top_none';c.wear.bottom='bt_none';c.look.tailLen='normal';c.look.tailFluff=false;c.look.tail='same';c.wear={...ROLE_DEF[role].wear,...(c.wear||{})};if(!c.name)c.name=HIRE_NAMES[key]||ROLE_DEF[role].name;if(!CLO[c.wear.apron])c.wear.apron=ROLE_DEF[role].wear.apron;   // çalışanlar her zaman önlüklü
    if(c.freeEdits==null)c.freeEdits=0}
    layoutRegisters(S.staff.cashier);
    for(const key of allStaffKeys())spawnStaff(key,false);
    if(/^cafe/.test(S.tut)||(S.tut==='create'&&S.created)){S.tut='cafe1';tutCafeStart()}drawAuto();syncNavMin();
    introReady(()=>authGate(()=>{started=true;startStaffLoops();if(!S.created)offerSetup(!hadSave);setTimeout(offlineCheck,700)}));
  }catch(e){$('load').hidden=false;const it=$('intro');if(it)it.remove();$('loadmsg').textContent='Yükleme hatası: '+(e.message||e);console.error(e)}
}
const walkersNear=()=>{const a=WSTAFF.map(w=>w.ch);for(const c of customers)a.push(c.char);if(COURIER&&COURIER.ch.o.visible)a.push(COURIER.ch);return a};
// ---------- ekip: anahtarlar, oluşturma, döngüler ----------
const allStaffKeys=()=>{const out=[];for(const role of ['waiter','barista','cashier'])for(let n=1;n<=S.staff[role];n++)out.push(staffKey(role,n));return out};
function newHireCfg(key){const role=roleOfKey(key);return {name:HIRE_NAMES[key]||ROLE_DEF[role].name,look:randomLook(),wear:JSON.parse(JSON.stringify(ROLE_DEF[role].wear)),freeEdits:1}}
function spawnStaff(key,hired){const role=roleOfKey(key),cfg=S.chars[key],xs=BODY_XS[cfg.look.body]||1;let ch;
  if(key==='waiter'){ch=new Char(GLTF.scene,{run:true,xs});applyLook(GLTF.scene,cfg)}
  else{const r=SkeletonUtils.clone(TEMPLATE);ch=new Char(r,{run:role==='waiter',xs});applyLook(r,cfg,1024)}
  ch.o.traverse(o=>{if(o.isMesh){o.castShadow=true;o.frustumCulled=false}});
  if(role==='waiter'){const i=WSTAFF.length,P=W_WAIT[i];ch.tray=makeTray();ch.avoidOf=walkersNear;const w={key,ch,i};WSTAFF.push(w);
    if(hired){ch.pos.set(DOOR_IN.x,0,DOOR_IN.z);ch.o.rotation.y=Math.PI/2}else{ch.pos.set(P.x,0,P.z);ch.o.rotation.y=Math.atan2(1.2-P.x,0.4-P.z)}
    if(i===0)yosun=ch;if(started)waiterLoop(w);return w}
  if(role==='barista'){const i=BSTAFF.length;ch.tray=makeTray();const b={key,ch,i,job:null,busy:false,idleAt:null};
    let h=B_HOME[i]||B_HOME[0];if(hired){const o=BSTAFF[0];if(o&&Math.hypot(o.ch.pos.x-h.x,o.ch.pos.z-h.z)<0.5)h=B_HOME.find(x=>x!==h)}
    BSTAFF.push(b);ch.pos.set(h.x,0,h.z);ch.o.rotation.y=0;if(i===0)posa=ch;if(started)baristaLoop(b);return b}
  const i=CSTAFF.length;const k={key,ch,i,ready:false};CSTAFF.push(k);const R=REGS[i]||REGS[0];const st=R?R.stand:CASH.stand;
  ch.pos.set(hired?CASH.x+0.29:st.x,0,st.z);ch.o.rotation.y=0;k.ready=!hired||REGS.length>i;if(i===0)cashier=ch;return k}
function startStaffLoops(){for(const w of WSTAFF)waiterLoop(w);for(const b of BSTAFF)baristaLoop(b)}
// ikinci kasiyer alınınca: kasada kimse yokken iki kasalı düzene geç, kasiyerler yerlerine yürür
let cashMoving=false;
function cashLayoutTick(){const n=Math.min(2,CSTAFF.length);if(cashMoving||REGS.length===n||REGS.some(r=>r.cust)||CSTAFF.some(k=>k.chasing))return;cashMoving=true;
  for(const k of CSTAFF)k.ready=false;layoutRegisters(n);
  Promise.all(CSTAFF.map(async k=>{const st=REGS[k.i].stand;await k.ch.walkTo(st.x,st.z,{direct:true});await k.ch.face(0);k.ready=true})).then(()=>{cashMoving=false})}
// müşteriler de şort giyer: kuyruksuz (pürüzsüz normalli) ortak geometri
function cloneLook(tex,lk){custPrepare();const r=SkeletonUtils.clone(TEMPLATE);let sm;r.traverse(o=>{if(o.isMesh){o.material=o.material.clone();o.material.map=tex;o.material.needsUpdate=true;if(o.isSkinnedMesh){o.geometry=NO_BOTTOMS?CM.geo:CM.geoNT;sm=o}}});
  if(sm&&lk&&lk._top){const B=CLO[lk._bt];dressGarments(r,sm,{cust:true,top:lk._top,bottom:B&&B.bt?{bt:B.bt,bt2:B.bt2,len:B.len||'short',denim:B.denim}:null})}
  if(sm&&!NO_BOTTOMS){const L=lk||{};const bt=(CLO[L._bt||L.bt||'bt_navy']||CLO.bt_navy).bt;buildTail(sm,{fur:L.W||[245,240,232],f2:L.B||[150,110,80],tail:'same',pattern:'original',len:'normal',fluff:false,bt})}return r}
function resize(){const w=game.clientWidth,h=game.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
resize();addEventListener('resize',resize);visualViewport&&visualViewport.addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow();else if(started)setTimeout(offlineCheck,300);clock.getDelta()});
addEventListener('pagehide',saveNow);
const clock=new THREE.Clock();let lastDt=0;
function simStep(dt){lastDt=dt;gameT+=dt;
    arrivalTick(dt);
    tickWaiters();
    autoTick(dt);
    fxTick(dt);
    dlvTick(dt);
    serviceTick(dt);
    extrasTick(dt);
    for(const L of [WSTAFF,BSTAFF,CSTAFF])for(const k of L)k.ch.update(dt);for(const c of customers)c.char.update(dt);if(COURIER)COURIER.ch.update(dt);if(SCOOT.rider)scootRider();
    cashLayoutTick();
    steamUpdate(dt)}
function loop(){requestAnimationFrame(loop);const raw=Math.min(clock.getDelta(),0.1);
  if(started&&!paused()){simStep(raw);updateUI()}
  else lastDt=0;
  envTick(raw);
  if(started){tutTick();tut2Tick()}
  controls.update();renderer.render(scene,camera)}
init();loop();

</script>
