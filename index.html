<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2b1a10"><style>[hidden]{display:none!important}html,body{margin:0;height:100%}</style></head><body>
<title>TabbyChef</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Nunito:wght@700;800&display=swap">
<style>
/* Layout: full-screen WebGL café (primary screen). Top: level/XP card + goal chip (left), coins (right). Bottom: hint line + 4-tab nav.
   Market = bottom sheet over the café (café stays visible for previews); Recipes and Merge = full panels above the nav. Single warm theme by design. */
:root{--cream:#fbf3e4;--paper:#fff8ec;--ink:#4a2e1c;--gold:#f2b134;--olive:#8a9a3b;--pink:#f2a6a0;--wood:#c98a4e;--wood2:#b87a42;--mint:#bfe39a;--red:#d9534f;--sky:#bfe3f5;
  --sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px);   /* Claude uygulaması :root'u zaten bu kadar boşlukla açarsa JS bunları 0 yapar */
  --navh:66px;--font-display:"Baloo 2","Nunito",system-ui,sans-serif;--font-body:"Nunito",system-ui,sans-serif;color-scheme:light}
html{height:100%;box-sizing:border-box}body{height:100%}
body{margin:0;background:#2b1a10;color:var(--ink);font-family:var(--font-body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#game{position:relative;width:100%;height:100%;overflow:hidden;background:#2b1a10}   /* 100dvh değil: sayfa çerçevenin güvenli alan boşluğunun içine sığmalı */
canvas{display:block;width:100%;height:100%;touch-action:none}
button{font:inherit;color:inherit}
svg.i{display:block;width:100%;height:100%}
.hud{position:absolute;left:0;right:0;top:0;z-index:4;display:flex;align-items:flex-start;gap:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-top:max(10px,var(--sat));pointer-events:none}
.hud-l{display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0}
.pill{background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:4px 12px;font-family:var(--font-display);font-weight:800;font-size:16px;box-shadow:0 3px 0 var(--ink)}
.pill.coins{margin-left:auto;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;font-size:18px;line-height:1.2;transition:transform .15s}
.pill.coins.bump{transform:scale(1.12)}
.pill.coins .ic{width:22px;height:22px}
.lvl{display:flex;align-items:center;gap:8px;background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:4px 10px 4px 4px;box-shadow:0 3px 0 var(--ink)}
.lvl-badge{position:relative;width:38px;height:38px;flex:none}
.lvl-badge span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:17px;line-height:1;padding-top:3px}
.lvl-info{display:flex;flex-direction:column;gap:3px;width:104px}
.lvl-info b{font-family:var(--font-display);font-weight:800;font-size:14px;line-height:1}
.xpbar{height:9px;border:2px solid var(--ink);border-radius:999px;background:#f3e2c6;overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:var(--olive);transition:width .45s ease}
.lvl-info small{font-size:11px;line-height:1;font-weight:800;opacity:.75;font-variant-numeric:tabular-nums}
.goal{display:flex;align-items:center;gap:6px;max-width:min(62vw,260px);background:rgba(255,248,236,.94);border:2.5px solid var(--ink);border-radius:12px;padding:3px 9px 3px 5px;font-size:12px;font-weight:800;line-height:1.2;box-shadow:0 2px 0 var(--ink)}
.goal .ic{width:18px;height:18px;flex:none}
.goal em{font-style:normal;opacity:.7;font-variant-numeric:tabular-nums;white-space:nowrap}
.bottom{position:absolute;left:0;right:0;bottom:calc(var(--navh) + var(--sab) + 6px);z-index:4;padding-inline:16px;pointer-events:none}
.hint{text-align:center;font-family:var(--font-display);font-weight:800;font-size:14px;color:var(--cream);text-shadow:0 2px 0 var(--ink),0 0 10px var(--ink)}
/* alt gezinme */
.nav{position:absolute;left:0;right:0;bottom:0;z-index:8;display:flex;justify-content:center;gap:6px;height:var(--navh);padding:6px max(10px,env(safe-area-inset-left,0px)) var(--sab);box-sizing:content-box;
  background:repeating-linear-gradient(90deg,var(--wood) 0 46px,var(--wood2) 46px 48px);border-top:3px solid var(--ink)}
.nav button{flex:1;max-width:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:0 3px 0 var(--ink);font-family:var(--font-display);font-weight:800;font-size:12px;line-height:1;padding:4px 2px;cursor:pointer;height:54px}
.nav button .ic{width:28px;height:28px}
.nav button[aria-pressed="true"]{background:var(--gold);transform:translateY(-2px)}
.nav button:active{box-shadow:0 1px 0 var(--ink);transform:translateY(2px)}
.nav button:focus-visible,.btn:focus-visible,.card:focus-visible,.tab:focus-visible{outline:3px solid #fff;outline-offset:2px}
/* dünya üzerindeki bağlamsal düğmeler */
#ui{position:absolute;inset:0;z-index:5;pointer-events:none;overflow:hidden}
#ui>*{position:absolute;left:0;top:0;will-change:transform}
#ui.off>*{visibility:hidden}
.act{pointer-events:auto;appearance:none;display:flex;align-items:center;gap:5px;border:3px solid var(--ink);border-radius:999px;background:var(--gold);color:var(--ink);font-family:var(--font-display);font-weight:800;font-size:14px;line-height:1;padding:5px 12px 5px 6px;box-shadow:0 3px 0 var(--ink);cursor:pointer;white-space:nowrap;animation:bob 1.1s ease-in-out infinite}
.act .ic{width:24px;height:24px}
.act.prep{background:#fff8ec}.act.pick{background:var(--mint)}
.act:active{box-shadow:0 1px 0 var(--ink);margin-top:2px}
@keyframes bob{50%{margin-top:-4px}}
.bubble{display:flex;align-items:center;gap:4px;background:#fff;border:3px solid var(--ink);border-radius:16px 16px 16px 4px;padding:3px 7px;font-size:13px;font-weight:800;line-height:1.1;box-shadow:0 2px 0 var(--ink)}
.bubble img,.bubble .ic{width:30px;height:30px;display:block}
.progress{display:flex;align-items:center;gap:6px;background:#fff8ec;border:3px solid var(--ink);border-radius:999px;padding:3px 8px 3px 4px;box-shadow:0 2px 0 var(--ink);width:104px}
.progress img{width:26px;height:26px;display:block}
.progress i{display:block;height:8px;border-radius:4px;background:var(--olive);max-width:62px}
.coin-pop{display:flex;align-items:center;gap:3px;font-family:var(--font-display);font-weight:800;font-size:20px;color:var(--gold);text-shadow:0 2px 0 var(--ink),0 0 6px var(--ink)}
.coin-pop .ic{width:22px;height:22px}
.coin-pop.tip{font-size:15px;color:#fff}
@media (prefers-reduced-motion:reduce){.act{animation:none}}
/* ortak panel dili */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:3px solid var(--ink);border-radius:999px;background:var(--gold);font-family:var(--font-display);font-weight:800;font-size:15px;line-height:1;padding:9px 16px;box-shadow:0 3px 0 var(--ink);cursor:pointer;white-space:nowrap}
.btn .ic{width:20px;height:20px}
.btn.light{background:var(--paper)}.btn.green{background:var(--mint)}.btn.red{background:#f6b8b3}
.btn:disabled{opacity:.5;cursor:default;filter:grayscale(.4)}
.btn:not(:disabled):active{box-shadow:0 1px 0 var(--ink);transform:translateY(2px)}
.iconbtn{appearance:none;width:40px;height:40px;flex:none;display:grid;place-items:center;border:3px solid var(--ink);border-radius:50%;background:var(--paper);box-shadow:0 3px 0 var(--ink);cursor:pointer;padding:6px}
.iconbtn:active{box-shadow:0 1px 0 var(--ink);transform:translateY(2px)}
.panel-head{display:flex;align-items:center;gap:10px;padding:10px 14px;background:repeating-linear-gradient(90deg,var(--wood) 0 46px,var(--wood2) 46px 48px);border-bottom:3px solid var(--ink)}
.panel-head h2{margin:0;flex:1;font-family:var(--font-display);font-weight:800;font-size:20px;line-height:1.1;color:var(--paper);text-shadow:0 2px 0 var(--ink)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 14px 6px;scrollbar-width:none;flex:none}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;flex:none;display:flex;align-items:center;gap:5px;border:2.5px solid var(--ink);border-radius:999px;background:var(--paper);font-family:var(--font-display);font-weight:800;font-size:13px;line-height:1;padding:6px 11px 6px 7px;cursor:pointer}
.tab .ic{width:20px;height:20px}
.tab[aria-selected="true"]{background:var(--gold);box-shadow:0 2px 0 var(--ink)}
.empty{padding:20px;text-align:center;font-weight:800;opacity:.7}
/* market (alt sayfa) */
.sheet{position:absolute;left:0;right:0;bottom:calc(var(--navh) + var(--sab) + 9px);z-index:7;height:min(60%,520px);display:flex;flex-direction:column;background:var(--cream);border-top:3px solid var(--ink);border-radius:22px 22px 0 0;overflow:hidden;transform:translateY(115%);transition:transform .28s ease;visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;padding:6px 14px 16px;align-content:start;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.card{appearance:none;position:relative;display:flex;flex-direction:column;align-items:stretch;gap:3px;text-align:left;background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:6px;box-shadow:0 3px 0 var(--ink);cursor:pointer;min-width:0}
.card[aria-current="true"]{background:#fde9b8}
.card .th{aspect-ratio:1;border-radius:10px;background:#f6e6cc;display:grid;place-items:center;overflow:hidden}
.card .th img{width:100%;height:100%;object-fit:contain;display:block}
.card b{font-size:12px;line-height:1.15;font-weight:800;min-height:2.3em}
.card .price{display:flex;align-items:center;gap:3px;font-family:var(--font-display);font-weight:800;font-size:14px;line-height:1}
.card .price .ic{width:16px;height:16px}
.card .tag{position:absolute;top:10px;left:10px;display:flex;align-items:center;gap:3px;background:var(--ink);color:var(--paper);border-radius:999px;padding:3px 7px 3px 4px;font-size:11px;font-weight:800;line-height:1}
.card .tag .ic{width:13px;height:13px}
.card.locked .th{filter:grayscale(.7) brightness(.85)}
.card .own{position:absolute;top:10px;right:10px;background:var(--mint);border:2px solid var(--ink);border-radius:999px;padding:2px 6px;font-size:10px;font-weight:800;line-height:1}
.detail{flex:none;display:flex;gap:12px;align-items:center;margin:4px 14px 6px;padding:8px;background:var(--paper);border:3px solid var(--ink);border-radius:16px}
.detail[hidden]{display:none}
.detail .th{width:84px;height:84px;flex:none;border-radius:12px;background:#f6e6cc;overflow:hidden}
.detail .th img{width:100%;height:100%;object-fit:contain}
.detail .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.detail .tx b{font-family:var(--font-display);font-weight:800;font-size:16px;line-height:1.1}
.detail .tx p{margin:0;font-size:12px;line-height:1.3;font-weight:700;opacity:.85}
.detail .row{display:flex;gap:6px;flex-wrap:wrap}
.detail .btn{font-size:14px;padding:7px 12px}
/* yerleştirme / düzenleme çubuğu */
.placebar{position:absolute;left:0;right:0;bottom:calc(var(--navh) + var(--sab) + 16px);z-index:7;display:flex;flex-direction:column;align-items:center;gap:8px;padding-inline:16px;pointer-events:none}
.placebar[hidden]{display:none}
.placebar .msg{pointer-events:none;max-width:340px;text-align:center;background:rgba(255,248,236,.96);border:3px solid var(--ink);border-radius:14px;padding:6px 12px;font-size:13px;font-weight:800;line-height:1.25;box-shadow:0 3px 0 var(--ink)}
.placebar .msg.bad{background:#fde0dc}
.placebar .row{pointer-events:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
/* tam ekran paneller */
.screen{position:absolute;left:0;right:0;top:0;bottom:calc(var(--navh) + var(--sab) + 9px);z-index:7;display:flex;flex-direction:column;background:var(--cream);
  background-image:radial-gradient(circle at 12px 12px,rgba(201,138,78,.10) 2px,transparent 2.5px);background-size:24px 24px}
.screen[hidden]{display:none}
.screen .panel-head{padding-top:max(10px,var(--sat))}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
/* tarif defteri */
.rlist{display:flex;flex-direction:column;gap:10px;padding:6px 14px 18px;max-width:560px;margin:0 auto}
.rc{display:flex;gap:10px;align-items:center;background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:8px;box-shadow:0 3px 0 var(--ink)}
.rc .th{width:72px;height:72px;flex:none;border-radius:12px;background:#f6e6cc;overflow:hidden;position:relative}
.rc .th img{width:100%;height:100%;object-fit:contain}
.rc.unk .th img{filter:brightness(0) opacity(.28)}
.rc .th .q{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:30px;color:var(--ink)}
.rc .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.rc .tx b{font-family:var(--font-display);font-weight:800;font-size:15px;line-height:1.1}
.rc .meta{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;font-weight:800;line-height:1}
.rc .meta span{display:inline-flex;align-items:center;gap:3px}
.rc .meta .ic{width:15px;height:15px}
.combo{display:flex;align-items:center;gap:3px;flex-wrap:wrap;font-size:11px;font-weight:800;opacity:.9}
.combo .mi{width:28px;height:28px;flex:none;background:#f6e6cc;border:2px solid var(--ink);border-radius:8px;padding:1px;box-sizing:border-box}
.status{align-self:flex-start;border:2px solid var(--ink);border-radius:999px;padding:2px 8px;font-size:11px;font-weight:800;line-height:1.2;background:var(--mint)}
.status.lv{background:#fde9b8}.status.un{background:#efe3d0}
/* birleştirme */
.mtop{display:flex;align-items:center;gap:10px;padding:10px 14px 4px;max-width:520px;width:100%;margin:0 auto;box-sizing:border-box}
.energy{flex:1;display:flex;align-items:center;gap:8px;background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:5px 10px 5px 6px;box-shadow:0 3px 0 var(--ink)}
.energy .ic{width:28px;height:28px;flex:none}
.energy .ebar{flex:1;display:flex;flex-direction:column;gap:3px}
.energy .ebar b{font-family:var(--font-display);font-weight:800;font-size:15px;line-height:1;font-variant-numeric:tabular-nums}
.energy .ebar small{font-size:11px;font-weight:800;opacity:.75;line-height:1;font-variant-numeric:tabular-nums}
.ebar .xpbar i{background:var(--gold)}
.board-wrap{padding:6px 14px;display:flex;justify-content:center}
.board{--cell:min(calc((100vw - 92px)/6),68px);display:grid;grid-template-columns:repeat(6,var(--cell));grid-template-rows:repeat(6,var(--cell));gap:3px;padding:3px;
  border-style:solid;border-width:30px 26px 28px 26px;border-image:url(img/board_frame.webp) 126 110 114 110 fill / 30px 26px 28px 26px stretch;filter:drop-shadow(0 4px 0 rgba(74,46,28,.35));touch-action:none}
.cell{position:relative;background:url(img/cell_empty.png) center/100% 100% no-repeat;border-radius:12px;display:grid;place-items:center}
.cell.hl{background-image:url(img/cell_match.png)}
.cell.sel{background-image:url(img/cell_selected.png)}
#merge{background:var(--cream) url(img/board_bg.jpg) 0 0/220px 220px repeat}
.it img,.drag img,.mi img,.ic img{width:100%;height:100%;object-fit:contain;pointer-events:none;display:block;-webkit-user-drag:none;user-select:none}
.it.cool img{filter:grayscale(.8) opacity(.6)}
.it{position:absolute;inset:3px;display:grid;place-items:center;touch-action:none;cursor:grab}
.it svg{width:100%;height:100%;pointer-events:none}
.it .lv{position:absolute;right:-2px;bottom:-2px;min-width:16px;height:16px;border-radius:999px;background:var(--ink);color:var(--paper);font-size:10px;font-weight:800;line-height:16px;text-align:center;padding:0 3px;pointer-events:none}
.it .cnt{position:absolute;left:-2px;top:-3px;background:var(--paper);border:2px solid var(--ink);border-radius:999px;font-size:9px;font-weight:800;line-height:1;padding:2px 4px;pointer-events:none;font-variant-numeric:tabular-nums}
.it.cool svg{filter:grayscale(.8) opacity(.6)}
.it .cd{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--ink);color:var(--paper);border-radius:999px;font-size:11px;font-weight:800;line-height:1;padding:3px 6px;pointer-events:none;font-variant-numeric:tabular-nums}
.it.pop{animation:pop .32s ease}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.it.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.drag{position:absolute;z-index:20;width:64px;height:64px;pointer-events:none;transform:translate(-50%,-60%) scale(1.15);filter:drop-shadow(0 4px 0 rgba(74,46,28,.35))}
.drag svg{width:100%;height:100%}
.info{max-width:520px;width:100%;margin:4px auto 16px;box-sizing:border-box;padding:0 14px}
.info .box{display:flex;gap:10px;align-items:center;background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:8px;box-shadow:0 3px 0 var(--ink);min-height:62px}
.info .box .mi{width:52px;height:52px;flex:none}
.info .box .tx{flex:1;min-width:0;font-size:12px;font-weight:800;line-height:1.3}
.info .box .tx b{display:block;font-family:var(--font-display);font-size:15px;line-height:1.1;margin-bottom:2px}
.info .box .btn{font-size:13px;padding:6px 10px}
/* bildirimler ve seviye */
.toasts{position:absolute;left:50%;top:calc(max(10px,var(--sat)) + 104px);transform:translateX(-50%);z-index:12;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,360px)}
.toast{display:flex;align-items:center;gap:8px;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:6px 12px 6px 6px;font-size:13px;font-weight:800;line-height:1.25;box-shadow:0 3px 0 var(--ink);animation:tin .3s ease}
.toast .ic,.toast img{width:30px;height:30px;flex:none}
.toast.out{opacity:0;transform:translateY(-6px);transition:all .3s}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
.modal{position:absolute;inset:0;z-index:15;display:grid;place-items:center;background:rgba(43,26,16,.45);padding:20px}
.modal[hidden]{display:none}
.lvcard{position:relative;width:min(100%,340px);background:var(--cream);border:3px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink);padding:44px 16px 16px;text-align:center;animation:lvin .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes lvin{from{transform:scale(.6);opacity:0}}
.lvcard .star{position:absolute;left:50%;top:-44px;width:96px;height:96px;transform:translateX(-50%);animation:spin 6s linear infinite}
.lvcard .star span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:30px;padding-top:6px}
@keyframes spin{to{transform:translateX(-50%) rotate(360deg)}}
.lvcard h3{margin:4px 0 2px;font-family:var(--font-display);font-weight:800;font-size:24px;line-height:1.1}
.lvcard p{margin:0 0 10px;font-size:13px;font-weight:800;opacity:.8}
.lvgift{display:flex;justify-content:center;gap:10px;margin:2px 0 10px}.lvgift>span{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border:2.5px solid var(--ink);border-radius:999px;background:#fff3d6;font-family:var(--font-display);font-size:17px}.lvgift .ic,.lvgift svg{width:22px!important;height:22px!important;flex:none}
.lvup{width:min(100%,318px);padding:36px 12px 12px}.lvup .star{width:74px;height:74px;top:-34px}.lvup .star span{font-size:24px}.lvup h3{font-size:21px}.lvup p{margin-bottom:6px}
.lvup .unl{display:grid;grid-template-columns:1fr 1fr;gap:5px;max-height:26vh;margin-bottom:10px}.lvup .unl div{font-size:10.5px;gap:5px;padding:3px 6px 3px 3px;border-width:2px;border-radius:10px}.lvup .unl img,.lvup .unl .ic{width:26px;height:26px;border-radius:6px}.lvup .unl div:only-child{grid-column:1/-1}.lvup .btn{padding-top:8px;padding-bottom:8px}
.unl{display:flex;flex-direction:column;gap:6px;max-height:42vh;overflow-y:auto;margin-bottom:12px;text-align:left}
.unl div{display:flex;align-items:center;gap:8px;background:var(--paper);border:2.5px solid var(--ink);border-radius:12px;padding:4px 8px 4px 4px;font-size:12px;font-weight:800;line-height:1.2}
.unl img,.unl .ic{width:36px;height:36px;flex:none;border-radius:8px;background:#f6e6cc}

const CELL=0.2;const GX=Math.round(ROOM_W/CELL),GZ=Math.round(ROOM_D/CELL);const PAD=0.28;
let grid=new Uint8Array(GX*GZ);
function cellOf(x,z){return [Math.min(GX-1,Math.max(0,Math.floor((x+ROOM_W/2)/CELL))),Math.min(GZ-1,Math.max(0,Math.floor((z+ROOM_D/2)/CELL)))]}
function posOf(i,k){return [(i+0.5)*CELL-ROOM_W/2,(k+0.5)*CELL-ROOM_D/2]}
function makeGrid(boxes){const g=new Uint8Array(GX*GZ);for(let k=0;k<GZ;k++)for(let i=0;i<GX;i++){const [x,z]=posOf(i,k);if(x<ROOM.minX||x>ROOM.maxX||z<ROOM.minZ||z>ROOM.maxZ){g[k*GX+i]=1;continue}
    for(const o of boxes){if(x>o.minX-PAD&&x<o.maxX+PAD&&z>o.minZ-PAD&&z<o.maxZ+PAD){g[k*GX+i]=1;break}}}return g}
let furnBoxes=()=>[];                 // mobilya sistemi tanımlar
function buildGrid(){grid=makeGrid(OBST.concat(furnBoxes()))}
const blockedIn=(g,i,k)=>i<0||k<0||i>=GX||k>=GZ||g[k*GX+i]===1;
const blocked=(i,k)=>blockedIn(grid,i,k);
function nearestFreeIn(g,i,k,R=12){if(!blockedIn(g,i,k))return [i,k];for(let r=1;r<R;r++)for(let dk=-r;dk<=r;dk++)for(let di=-r;di<=r;di++){if(Math.max(Math.abs(di),Math.abs(dk))!==r)continue;if(!blockedIn(g,i+di,k+dk))return [i+di,k+dk]}return null}
function nearestFree(i,k){return nearestFreeIn(grid,i,k)||[i,k]}
function astar(sx,sz,tx,tz){let [si,sk]=nearestFree(...cellOf(sx,sz));let [ti,tk]=nearestFree(...cellOf(tx,tz));
  const key=(i,k)=>k*GX+i;const open=[[0,si,sk]];const g=new Map([[key(si,sk),0]]);const came=new Map();const h=(i,k)=>Math.hypot(i-ti,k-tk);
  const closed=new Uint8Array(GX*GZ);let found=false;
  while(open.length){open.sort((a,b)=>a[0]-b[0]);const [,i,k]=open.shift();if(closed[key(i,k)])continue;closed[key(i,k)]=1;if(i===ti&&k===tk){found=true;break}
    for(let dk=-1;dk<=1;dk++)for(let di=-1;di<=1;di++){if(!di&&!dk)continue;const ni=i+di,nk=k+dk;if(blocked(ni,nk))continue;if(di&&dk&&(blocked(i+di,k)||blocked(i,k+dk)))continue;
      const ng=g.get(key(i,k))+Math.hypot(di,dk);if(ng<(g.get(key(ni,nk))??Infinity)){g.set(key(ni,nk),ng);came.set(key(ni,nk),key(i,k));open.push([ng+h(ni,nk),ni,nk])}}}
  if(!found)return [];const path=[];let c=key(ti,tk);while(c!==undefined){path.push(c);c=came.get(c)}path.reverse();
  const pts=path.map(c=>{const [x,z]=posOf(c%GX,Math.floor(c/GX));return new THREE.Vector3(x,0,z)});
  const los=(a,b)=>{const n=Math.ceil(a.distanceTo(b)/(CELL*0.5));for(let t=0;t<=n;t++){const x=a.x+(b.x-a.x)*t/n,z=a.z+(b.z-a.z)*t/n;if(blocked(...cellOf(x,z)))return false}return true};
  const out=[];let cur=0;out.push(pts[0]);while(cur<pts.length-1){let nxt=cur+1;for(let j=pts.length-1;j>cur;j--){if(los(pts[cur],pts[j])){nxt=j;break}}out.push(pts[nxt]);cur=nxt}
  return out}
// erişilebilirlik: kapıdan taşkın doldurma (8 komşu, köşe kesmeden)
function floodFrom(g,x,z){const seen=new Uint8Array(GX*GZ);const st=nearestFreeIn(g,...cellOf(x,z));if(!st)return seen;const q=[st];seen[st[1]*GX+st[0]]=1;
  while(q.length){const [i,k]=q.pop();for(let dk=-1;dk<=1;dk++)for(let di=-1;di<=1;di++){if(!di&&!dk)continue;const ni=i+di,nk=k+dk;if(blockedIn(g,ni,nk)||seen[nk*GX+ni])continue;if(di&&dk&&(blockedIn(g,i+di,k)||blockedIn(g,i,k+dk)))continue;seen[nk*GX+ni]=1;q.push([ni,nk])}}return seen}
function pointReachable(g,seen,p){const c=nearestFreeIn(g,...cellOf(p.x,p.z),3);if(!c)return false;const [x,z]=posOf(c[0],c[1]);return seen[c[1]*GX+c[0]]===1&&Math.hypot(x-p.x,z-p.z)<0.5}

function setBuilt(m,u){if(m.userData.fill){const f=m.userData.fill,k=Math.max(0.02,u);f.scale.y=k;f.position.y=f.userData.base+f.userData.h*k/2}

const loader=new GLTFLoader();
function progress(p){$('barfill').style.width=Math.round(p*100)+'%'}
async function loadGLB(url,onProg){const r=await fetch(url);if(!r.ok)throw new Error('yüklenemedi: '+url);const total=+r.headers.get('content-length')||0;const reader=r.body.getReader();const chunks=[];let got=0;
  while(true){const {done,value}=await reader.read();if(done)break;chunks.push(value);got+=value.length;if(total)onProg(got/total)}
  const txt=await new Blob(chunks).text();const raw=atob(txt.trim());const bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
  return new Promise((res,rej)=>loader.parse(bytes.buffer,'',res,rej))}

const FURN=new Map();              // uid → {rec,group,boxes,table?}
let TABLES=[];                     // müşteri masaları (yalnızca yerleştirilmiş)
const yawOf=r=>(r||0)*Math.PI/2;
function decorBoxes(rec){const c=CAT[rec.id];if(!c.half||c.flat)return [];let [hx,hz]=c.half;if((rec.rot||0)%2)[hx,hz]=[hz,hx];return [{minX:rec.x-hx,maxX:rec.x+hx,minZ:rec.z-hz,maxZ:rec.z+hz}]}
function buildFurnGroup(rec){const c=CAT[rec.id];
  if(c.kind==='table')return (c.seats===4?buildSet4Group:buildSetGroup)(rec.id,rec.chair||'c_cushion',rec.col||0);
  if(c.kind==='decor')return DECOR_BUILD[rec.id]();
  if(c.kind==='walldecor')return WALL_BUILD[rec.id]()}
function placeGroup(G,rec){const c=CAT[rec.id];if(c.kind==='walldecor'){const s=WALL_SLOTS[rec.slot];G.position.set(s.x,s.y,s.z);G.rotation.y=s.ry}else{G.position.set(rec.x,0,rec.z);G.rotation.y=yawOf(rec.rot)}}
function spawnFurn(rec){const c=CAT[rec.id];const G=buildFurnGroup(rec);placeGroup(G,rec);scene.add(G);G.traverse(m=>{if(m.isMesh){m.castShadow=m.castShadow!==false;m.receiveShadow=true}});G.userData.uid=rec.uid;
  const R={rec,group:G,boxes:[]};
  if(c.kind==='table'){const W=(c.seats===4?set4World:setWorld)(rec.x,rec.z,yawOf(rec.rot));R.boxes=W.boxes;R.table={id:rec.uid,uid:rec.uid,center:W.center,topY:W.topY,seats:W.seats,occupant:null,cap:W.seats.length};
    W.seats.forEach(s=>s.table=R.table)}
  else if(c.kind==='decor')R.boxes=decorBoxes(rec);
  FURN.set(rec.uid,R);return R}
function despawnFurn(uid){const R=FURN.get(uid);if(!R)return;scene.remove(R.group);FURN.delete(uid)}
function refreshWorld(){TABLES=[...FURN.values()].filter(R=>R.table).map(R=>R.table);
  // lamba ışıkları masaların üstüne
  const ts=[...FURN.values()].filter(R=>R.table);LAMP_POOL.forEach((pl,i)=>{const R=ts[i];if(R){pl.position.set(R.rec.x,WALL_H-0.7,R.rec.z);pl.intensity=4}else{pl.intensity=0;pl.position.set(0,-5,0)}});
  buildGrid();for(const ch of allChars())ch.repath&&ch.repath()}
furnBoxes=(ex=null)=>{const out=[];for(const [uid,R] of FURN)if(uid!==ex)out.push(...R.boxes);return out};
function allChars(){const a=[];if(yosun)a.push(yosun);if(posa)a.push(posa);if(cashier)a.push(cashier);for(const c of customers)a.push(c.char);return a}

// --- yerleştirme doğrulaması ---
const ovl=(a,b,m=0)=>a.minX<b.maxX+m&&a.maxX>b.minX-m&&a.minZ<b.maxZ+m&&a.maxZ>b.minZ-m;
const inside=(p,b,m=0)=>p.x>b.minX-m&&p.x<b.maxX+m&&p.z>b.minZ-m&&p.z<b.maxZ+m;
function candidateInfo(rec){const c=CAT[rec.id];if(c.kind==='table'){const W=(c.seats===4?set4World:setWorld)(rec.x,rec.z,yawOf(rec.rot));return {boxes:W.boxes,points:W.seats.flatMap(s=>[s.A,s.serve])}}
  return {boxes:decorBoxes(rec),points:[]}}
function validatePlacement(rec,exUid=null){const c=CAT[rec.id];
  if(c.kind==='walldecor'){if(rec.slot==null||rec.slot<0||rec.slot>=WALL_SLOTS.length)return 'Duvarda boş yer yok';for(const [u,R] of FURN)if(u!==exUid&&CAT[R.rec.id].kind==='walldecor'&&R.rec.slot===rec.slot)return 'Bu duvar yeri dolu';return null}
  const {boxes,points}=candidateInfo(rec);
  const lim={minX:-ROOM_W/2+0.12,maxX:ROOM_W/2-0.12,minZ:-ROOM_D/2+0.12,maxZ:ROOM_D/2-0.12};
  const area=boxes.length?boxes:[{minX:rec.x-c.half[0],maxX:rec.x+c.half[0],minZ:rec.z-c.half[1],maxZ:rec.z+c.half[1]}];
  if(c.flat){let [hx,hz]=c.half;if((rec.rot||0)%2)[hx,hz]=[hz,hx];const b={minX:rec.x-hx,maxX:rec.x+hx,minZ:rec.z-hz,maxZ:rec.z+hz};
    if(b.minX<-ROOM_W/2+0.05||b.maxX>ROOM_W/2-0.05||b.minZ<-ROOM_D/2+0.05||b.maxZ>ROOM_D/2-0.05)return 'Kafenin içine yerleştir';
    for(const o of OBST)if(ovl(b,o,-0.02))return 'Tezgaha ya da sabit eşyaya denk geliyor';if(ovl(b,NO_BUILD[0]))return 'Kapı girişini kapatmasın';return null}
  for(const b of area)if(b.minX<lim.minX||b.maxX>lim.maxX||b.minZ<lim.minZ||b.maxZ>lim.maxZ)return 'Kafenin içine yerleştir';
  for(const b of boxes){for(const o of OBST)if(ovl(b,o,0.04))return 'Başka bir eşyaya çarpıyor';
    for(const o of furnBoxes(exUid))if(ovl(b,o,0.06))return 'Başka bir eşyaya çarpıyor';
    for(const z of NO_BUILD)if(ovl(b,z))return 'Bu alan yürüme yolu (kapı / tezgah önü)';
    for(const ch of allChars())if(inside(ch.pos,b,0.25))return 'Bir kedinin üstüne konamaz'}
  for(const p of points){if(p.x<ROOM.minX||p.x>ROOM.maxX||p.z<ROOM.minZ||p.z>ROOM.maxZ)return 'Sandalyenin yanında yürüme payı kalmalı';
    for(const o of OBST.concat(furnBoxes(exUid)))if(inside(p,o,0.12))return 'Sandalyenin yanında yürüme payı kalmalı'}
  // erişim: kapıdan tüm masalara, garson köşesine ve tezgaha yol kalmalı
  const g=makeGrid(OBST.concat(furnBoxes(exUid),boxes));const seen=floodFrom(g,DOOR_IN.x,DOOR_IN.z);
  const need=[staffSeat.A,PREP_SPOT,PICKUP_SPOT,...points];for(const [u,R] of FURN)if(u!==exUid&&R.table)for(const s of R.table.seats)need.push(s.A,s.serve);
  for(const p of need)if(!pointReachable(g,seen,p))return 'Bu konum bir yolu kapatıyor';
  return null}

// ================= SES: fon müziği + efektler (Web Audio ile üretilir, dosya yok) =================
// Müzik: 80 BPM, sallantılı (swing) sıcak kafe/lo-fi. Elektrik piyano akorları, yumuşak bas, kalimba ezgisi, fırça davul.
// Form A A B A (32 ölçü ≈ 96 sn); her turda ezgi yeniden üretilir, motifler tekrar eder → tanıdık ama tekdüze değil.
const AU={ctx:null,master:null,music:null,sfx:null,rev:null,dly:null,noise:null,playing:false,bar:0,next:0,timer:0,cycle:0,mel:null};
const SET=(()=>{let s={music:true,sfx:true};try{const r=JSON.parse(localStorage.getItem('posa-yosun-ses')||'null');if(r)s={...s,...r}}catch(e){}return s})();

const mtof=m=>440*Math.pow(2,(m-69)/12);
function auInit(){if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return}
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ctx=new C();AU.ctx=ctx;
  const comp=ctx.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=3;comp.connect(ctx.destination);
  AU.master=ctx.createGain();AU.master.gain.value=0.9;AU.master.connect(comp);
  const warm=ctx.createBiquadFilter();warm.type='lowpass';warm.frequency.value=4200;warm.Q.value=0.4;warm.connect(AU.master);
  AU.music=ctx.createGain();AU.music.gain.value=0;AU.music.connect(warm);
  AU.sfx=ctx.createGain();AU.sfx.gain.value=SET.sfx?0.7:0;AU.sfx.connect(AU.master);
  // yankı (kısa oda) + eko
  const ir=ctx.createBuffer(2,ctx.sampleRate*2.2,ctx.sampleRate);for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3.2)}
  AU.rev=ctx.createConvolver();AU.rev.buffer=ir;const rg=ctx.createGain();rg.gain.value=0.5;AU.rev.connect(rg);rg.connect(warm);
  AU.dly=ctx.createDelay(1.5);AU.dly.delayTime.value=0.75*0.75;const fb=ctx.createGain();fb.gain.value=0.32;const dl=ctx.createBiquadFilter();dl.type='lowpass';dl.frequency.value=2200;
  AU.dly.connect(dl);dl.connect(fb);fb.connect(AU.dly);dl.connect(AU.music);
  const nb=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);const nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;AU.noise=nb;
  if(SET.music)musicStart()}
// ---- yapı taşları ----
function env(g,t,a,peak,dec,sus,rel,end){g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.setTargetAtTime(peak*sus,t+a,dec);g.gain.setTargetAtTime(0.0001,end,rel)}
function osc(type,f,t,stop,dest){const o=AU.ctx.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);o.connect(dest);o.start(t);o.stop(stop);return o}
function gainTo(dest,v=1){const g=AU.ctx.createGain();g.gain.value=v;g.connect(dest);return g}
function noiseSrc(t,dur,dest){const s=AU.ctx.createBufferSource();s.buffer=AU.noise;s.loop=true;s.connect(dest);s.start(t,Math.random()*1.5);s.stop(t+dur);return s}
function filt(type,f,q,dest){const b=AU.ctx.createBiquadFilter();b.type=type;b.frequency.value=f;b.Q.value=q;b.connect(dest);return b}
// ---- müzik enstrümanları ----
function ep(m,t,d,v){const f=mtof(m),g=gainTo(AU.music,0);const s=gainTo(AU.rev,0.22);g.connect(s);
  env(g,t,0.012,v,0.35,0.45,0.35,t+d);const end=t+d+1.6;osc('sine',f,t,end,g);const g2=gainTo(g,0.22);osc('sine',f*2.003,t,end,g2);
  const g3=gainTo(g,0);g3.gain.setValueAtTime(0.12,t);g3.gain.setTargetAtTime(0.0001,t,0.06);osc('sine',f*4.01,t,t+0.4,g3);
  const lfo=AU.ctx.createOscillator();lfo.frequency.value=4.2;const lg=AU.ctx.createGain();lg.gain.value=v*0.12;lfo.connect(lg);lg.connect(g.gain);lfo.start(t);lfo.stop(end)}
function bass(m,t,d,v){const f=mtof(m),lp=filt('lowpass',520,0.7,AU.music),g=gainTo(lp,0);env(g,t,0.01,v,0.25,0.55,0.12,t+d);osc('triangle',f,t,t+d+0.6,g);osc('sine',f,t,t+d+0.6,gainTo(g,0.6))}
function kal(m,t,v){const f=mtof(m),g=gainTo(AU.music,0);const ds=gainTo(AU.dly,0.32),rs=gainTo(AU.rev,0.3);g.connect(ds);g.connect(rs);
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.006);g.gain.setTargetAtTime(0.0001,t+0.006,0.38);osc('sine',f,t,t+2,g);
  const h=gainTo(g,0);h.gain.setValueAtTime(0.25,t);h.gain.setTargetAtTime(0.0001,t,0.05);osc('sine',f*3.01,t,t+0.3,h)}
function kick(t,v){const g=gainTo(AU.music,0);g.gain.setValueAtTime(v,t);g.gain.setTargetAtTime(0.0001,t,0.09);const o=osc('sine',110,t,t+0.4,g);o.frequency.setTargetAtTime(46,t,0.035)}
function hat(t,v,len=0.035){const g=gainTo(AU.music,0);g.gain.setValueAtTime(v,t);g.gain.setTargetAtTime(0.0001,t,len);noiseSrc(t,0.25,filt('highpass',7200,0.6,g))}
function brush(t,v){const g=gainTo(AU.music,0);g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.02);g.gain.setTargetAtTime(0.0001,t+0.02,0.09);noiseSrc(t,0.5,filt('bandpass',2400,0.7,g))}
// ---- armoni ve form ----
const CH={Fmaj9:[41,[57,60,64,67]],Em7:[40,[55,59,62,64]],Dm9:[38,[53,57,60,64]],G13:[43,[53,59,64,69]],Cmaj9:[36,[52,55,59,62]],Am9:[45,[55,59,60,64]],G6:[43,[52,55,59,62]]};
const SEC={A:['Fmaj9','Em7','Dm9','G13','Cmaj9','Am9','Dm9','G13'],B:['Am9','Fmaj9','Cmaj9','G6','Am9','Fmaj9','Dm9','G13']};
const FORM=['A','A','B','A'];const BEAT=0.75,SWING=0.58;
const PENTA=[60,62,64,67,69,72,74,76,79,81,84];
const RHY=[[[0,2],[3,1],[4,2],[6,2]],[[0,3],[3,1],[5,3]],[[1,1],[2,2],[4,1],[6,2]],[[0,4],[5,2]],[[2,2],[4,4]],[[0,1],[1,1],[2,2],[5,3]],[]];
function rnd(seed){let s=seed>>>0;return ()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function makeMelody(cycle){const R=rnd(9137+cycle*7919);const out={};
  for(const sec of ['A','B']){const bars=[];let cur=PENTA[3+Math.floor(R()*3)];
    for(let b=0;b<8;b++){if((b===3||b===7)&&R()<0.5){bars.push([]);continue}
      const src=(sec==='A'&&b>=4&&b<6)?bars[b-4]:null;   // motif tekrarı (5-6. ölçüler 1-2'yi yansıtır)
      const rh=src?src.map(n=>[n[0],n[1]]):RHY[Math.floor(R()*RHY.length)];const tones=CH[SEC[sec][b]][1].map(x=>x+12);
      const notes=rh.map(([p,d],k)=>{let m;if(src){m=src[k][2]}else{const step=Math.round((R()-0.5)*4);const idx=Math.max(0,Math.min(PENTA.length-1,PENTA.indexOf(cur)+step));m=PENTA[idx]}
        if(p%2===0){let best=m,bd=99;for(const t of tones.concat(tones.map(x=>x+12)))if(Math.abs(t-m)<bd&&t>=62&&t<=86){bd=Math.abs(t-m);best=t}m=best}cur=PENTA.reduce((a,x)=>Math.abs(x-m)<Math.abs(a-m)?x:a,PENTA[0]);return [p,d,m]});
      bars.push(notes)}out[sec]=bars}return out}
const at8=(t0,p)=>t0+Math.floor(p/2)*BEAT+(p%2?SWING*BEAT:0);
function scheduleBar(i,t0){const fi=Math.floor(i/8)%4,sec=FORM[fi],b=i%8;if(i%32===0){AU.mel=makeMelody(AU.cycle++)}
  const [root,voice]=CH[SEC[sec][b]];const intro=AU.cycle===1&&i<4;const light=sec==='B'&&b<4;
  // akorlar
  voice.forEach((m,k)=>ep(m,t0+k*0.012,BEAT*1.9,0.05));if(Math.random()<0.6)voice.forEach((m,k)=>ep(m,at8(t0,5)+k*0.01,BEAT*1.1,0.035));
  // bas
  if(!intro){bass(root,t0,BEAT*1.4,0.26);bass(Math.random()<0.5?root+7:root+12,at8(t0,Math.random()<0.5?4:5),BEAT*0.9,0.2)}
  // davul (fırça + yumuşak tekme + salınımlı zil)
  if(!intro){kick(t0,0.32);if(!light&&Math.random()<0.4)kick(at8(t0,5),0.18);brush(t0+BEAT,light?0.05:0.09);brush(t0+3*BEAT,light?0.05:0.09);
    for(let p=0;p<8;p++)hat(at8(t0,p),(p%2?0.022:0.035)*(light?0.6:1))}

  if(!intro&&AU.mel){for(const [p,d,m] of AU.mel[sec][b])kal(m,at8(t0,p),0.09)}

.gpage .lead{text-align:center;opacity:.85}

{const g=document.createElement('section');g.className='screen';g.id='guide';g.hidden=true;g.setAttribute('aria-label','Rehber');
 g.innerHTML=`<div class="panel-head"><span class="iconbtn" style="pointer-events:none">${UI_IC.book}</span><h2>TabbyChef Rehberi</h2><button class="iconbtn" id="gdClose" type="button" aria-label="Kapat">${UI_IC.close}</button></div><div class="scroll"><div class="gwrap" id="gdBody"></div><div class="gwrap" style="padding-top:0"><div class="acct" id="gdAcct"></div><button class="btn red" type="button" id="gdReset" style="align-self:center">${ic('trash')}Kaydı sil, baştan başla</button></div></div>`;
 $('game').insertBefore(g,$('nav'));$('gdClose').onclick=()=>closeGuide()}

function guidePages(){const N=S.chars||{waiter:{name:'Yosun'},barista:{name:'Poşa'},cashier:{name:'Fındık'}};const w=N.waiter.name,b=N.barista.name,c=N.cashier.name;

   {t:'Hoş geldin!',art:`<div style="width:min(78%,320px)">${logoSVG('still')}</div>`,body:`<p class="lead">TabbyChef, kedi şeflerin dünyası! Bu sıcacık dünyada kedilerin yaşar, çalışır ve misafir ağırlar. Sen de onların kafesini işletiyorsun: müşterilere servis yap, para kazan, kafeni büyüt ve yeni tarifler keşfet. Acele yok; kedilerin dünyasında her şey kendi hızında akar.</p>`},
   {t:'Ekibin',art:`${th('waiter')}${th('barista')}${th('cashier')}`,body:`<ul class="gsteps"><li>${ic('tray')}<span><b>${w}</b> garsondur: siparişleri alır, tepsiyle servis yapar. Boşken köşesinde ayakta bekler.</span></li>
     <li>${ic('chef')}<span><b>${b}</b> baristadır: tezgah arkasında kahve, çay, tatlı ve yemekleri hazırlar.</span></li><li>${ic('coin')}<span><b>${c}</b> kasiyerdir: yemeğini bitiren müşteriler kasaya gelip ona öder.</span></li></ul>`},
   {t:'Servis nasıl yapılır?',art:`${ic('menu')}<span class="ar">→</span>${ic('chef')}<span class="ar">→</span>${ic('tray')}<span class="ar">→</span>${ic('coin')}`,body:`<ul class="gsteps">
     <li><span class="n">1</span><span>Müşteri kapıdan girer ve boş bir masaya oturur.</span></li>

   {t:'Para, XP ve seviye',art:`${ic('coin')}${ic('xp')}${ic('star')}${ic('gem')}`,body:`<p>Her ödeme ${tagb('coin','altın')} ve XP kazandırır. XP dolunca <b>seviye atlarsın</b>: yeni masa yerleri, tarifler, renkler ve eşyalar açılır, seviye başına ${tagb('gem','3 elmas','l')} da kazanırsın.</p>

   {t:'Kafeni büyüt',art:`${ic('market')}${ic('table')}${ic('chair')}${ic('paint')}${ic('plant')}`,body:`<p>${tagb('market','Market','l')} sekmesinde masa, sandalye, duvar boyası, zemin, dekor ve ekipman var. Kilitli olanlar hangi seviyede açılacağını gösterir.</p>

   {t:'Tarif Defteri',art:`${ic('book')}<img src="${productThumb('latte')}" alt=""><img src="${productThumb('pasta')}" alt="">`,body:`<ul class="gsteps"><li><span class="n">1</span><span><b>Keşfet:</b> tarifin malzemesini birleştirme tahtasında yap.</span></li>

     <p>Keşfedilen tarif kalıcıdır; ${b} onu kendisi hazırlar, malzeme harcanmaz.</p>`},
   {t:'Birleştirme tahtası',art:`<span class="ic">${itemArt('bag_food')}</span><span class="ic">${itemArt('un1')}</span><span class="ar">+</span><span class="ic">${itemArt('un1')}</span><span class="ar">=</span><span class="ic">${itemArt('un2')}</span>`,body:`<ul class="gsteps">
     <li>${ic('bolt')}<span>Torbaya dokun, malzeme çıksın. Her dokunuş ${CONFIG.energy.cost} enerji harcar; enerji en fazla ${CONFIG.energy.max} olur ve her dakika 1 dolar, oyun kapalıyken de.</span></li>
     <li>${ic('clock')}<span>Her torba ${CONFIG.bag.limit} malzeme verdikten sonra ${CONFIG.bag.cooldownSec/60} dakika dinlenir; süre torbanın üstünde görünür. Beklemek istemezsen ${tagb('gem','elmas','l')} ile torbayı ya da enerjini hemen yenileyebilirsin.</span></li>
     <li><span class="ic" style="width:30px;height:30px">${itemArt('kahve1')}</span><span>Aynı iki malzemeyi sürükleyip üst üste bırak: bir üst seviye olur. Uyanlar yeşil yanar.</span></li>
     <li><span class="ic" style="width:30px;height:30px">${itemArt('c_latte')}</span><span>Bazı farklı malzemeler de birleşir ve yeni tarif keşfettirir (ör. espresso shot + süt köpüğü = latte).</span></li>
     <li>${ic('target')}<span>Tarifler’de bir tarife ${tagb('target','Hedefle','l')} dersen torbalar o tarifin malzemelerini çok daha sık verir.</span></li></ul><p>Uymayan iki malzeme sadece yer değiştirir; hiçbir şey kaybolmaz.</p>`},
   {t:'Puan, fiyat ve sabır',art:`${UI_IC.starF}${ic('coin')}${UI_IC.wait}`,body:`<ul class="gsteps"><li>${UI_IC.starF}<span><b>Kafe puanı</b> (sağ üstteki yıldız): son ziyaretlerin ortalaması. Puan yükseldikçe daha sık müşteri ve paket sipariş gelir; düşerse kafe sessizleşir. Yıldıza dokununca yorumları görürsün.</span></li>
     <li>${ic('coin')}<span><b>Fiyatlar:</b> Menü → Fiyatlar’da her ürünün fiyatını ±1 altınla ayarla. Ucuz fiyat müşteriyi mutlu eder ama kârı azaltır; pahalı fiyat kârı artırır, kalite yetmezse puanı düşürür.</span></li>
     <li>${ic('clock')}<span><b>Sabır:</b> masadaki halka müşterinin sabrını gösterir: önce siparişin alınmasını, sonra yemeğini bekler. Halka kırmızıya dönmeden yetiş; yetişemezsen müşteri kızıp gider ve puanın düşer. Hızlı servis puanı yükseltir.</span></li>
     <li>${UI_IC.chart}<span><b>İşletme raporu:</b> sağ üstteki altına dokun. Son 60 dakikanın (ya da 24 saatin) gelirini, giderini, net kârını, ağırlanan ve kaybedilen müşteriyi görürsün. Yıldıza dokununca yorumlar ve puanı neyin düşürdüğü çıkar.</span></li></ul>`},
   {t:'Stok ve toptancılar',art:`${itemArt('kahve1')}${ic('box')}${itemArt('sut1')}`,body:`<ul class="gsteps"><li>${ic('box')}<span><b>Stok:</b> her ürün tarifindeki malzemelerden 1’er birim harcar (ör. kurabiye = 1 un + 1 şeker). Bir malzeme biterse onu kullanan ürün satılamaz; hiçbir ürün satılamıyorsa müşteri gelmez.</span></li>
     <li>${ic('market')}<span><b>Toptancılar:</b> Menü → Stok → <b>Toptancıdan sipariş ver</b>. 5 toptancı var: ucuz olanın kalitesi düşük, pahalı olanın kalitesi yüksek. Kalite müşteri puanını, alış fiyatı kârını belirler. 25’li pakette %5, 50’li pakette %10 indirim.</span></li>

   {t:'Kafe stratejisi',art:`${UI_IC.chart}${ic('coin')}${UI_IC.starF}`,body:`<ul class="gsteps"><li>${ic('coin')}<span><b>Ekonomik kafe:</b> ucuz toptancı + düşük fiyat. Çok müşteri gelir, müşteriler beklemeye daha hoşgörülüdür; ürün başı kâr düşüktür. Büyük ekip ve çok masa ile parlar.</span></li>
     <li>${UI_IC.starF}<span><b>Lüks kafe:</b> kaliteli toptancı + yüksek fiyat. Daha az ama daha kârlı müşteri; hızlı servis ve yüksek kalite beklerler. Küçük kafede en verimli yol olabilir. Çok pahalı fiyat ise müşteriyi kaçırır.</span></li>
     <li>${UI_IC.chart}<span><b>Dengeli kafe:</b> orta toptancı + uygun fiyat. İstikrarlı puan ve kâr. Hangisinin daha iyi olduğu ekibine, masalarına ve puanına göre değişir; İşletme raporundan takip et.</span></li></ul>`},
   {t:'Gün, dükkan ve sen yokken',art:`${ic('sun')}${ic('lock')}${ic('coin')}`,body:`<ul class="gsteps"><li>${ic('sun')}<span><b>Gün döngüsü:</b> sabah, öğle, ikindi ve akşam sırayla gelir (bir gün ~20 dakika). Akşamın sonunda son siparişler alınır; gece dükkan kendiliğinden kapanır ve günün hasılat tablosu çıkar. <b>Tamam</b> deyince gece hızla geçer, sabah dükkan yeniden açılır.</span></li>
     <li>${ic('lock')}<span><b>Dükkanı kapat:</b> üstte seviye kartının yanındaki AÇIK/KAPALI tabelasına dokun. Yeni müşteri ve telefon gelmez, içerideki müşteriler hesabını ödeyip çıkar. Mekânı rahatça düzenlemek için idealdir.</span></li>
     <li>${ic('coin')}<span><b>Sen yokken:</b> oyunu dükkan açıkken kapatırsan ekibin kafeyi işletmeye devam eder (en fazla 8 saat, normal hızın %70’i, stok yettiği kadar). Geri dönünce <b>Hasılatı topla</b>. Dükkan kapalıysa satış olmaz.</span></li></ul>`},
   {t:'İstekler, VIP ve müdavimler',art:`${ic('star')}${ic('heart')}${ic('clock')}`,body:`<ul class="gsteps"><li>${ic('clock')}<span><b>Özel istek:</b> bazen bir kedi menünde olmayan bir ürünü ister. Süre bitmeden ürünü keşfet, aç ve menüye ekle; satınca büyük ödül kazanırsın. İsteğe dokununca nereye gideceğini gösterir.</span></li>
     <li>${ic('star')}<span><b>VIP gurme:</b> taçlı misafir. Pahalı ürünleri sever ve her zaman cömert bahşiş bırakır.</span></li>
     <li>${ic('heart')}<span><b>Müdavimler:</b> aynı kedi 6 kez gelirse müdavimin olur, 20 kez gelirse sadık müdavim. Müdavimler daha sık bahşiş bırakır, nadiren kaçar; sadık müdavim hiç kaçmaz.</span></li>
     <li>${ic('paw')}<span><b>Kaçak müşteri:</b> bazıları ödemeden kapıya koşar! Kasiyerin fark ederse koşup yakalar; fark etmezse kaçağın üstündeki ${tagb('paw','Yakala!')} düğmesine dokun.</span></li></ul>`},
   {t:'Geliştirmeler',art:`${ic('up')}${ic('coin')}${ic('chef')}${ic('bolt')}`,body:`<p>${tagb('market','Market','l')} → ${tagb('up','Geliştir','l')} sekmesinde kalıcı yükseltmeler var: ürünleri daha pahalıya sat, baristaları hızlandır, bahşişleri artır, enerji deposunu büyüt.</p><p>Oyun kapalıyken de ekibin çalışır: geri döndüğünde biriken altını toplarsın (en fazla 2 saatlik).</p>`},
   {t:'Ekip ve kıyafetler',art:`${ic('paw')}${ic('shirt')}<span class="ic">${clothIcon('bow_red')}</span><span class="ic">${clothIcon('hat_beret')}</span>`,body:`<p>${tagb('paw','Ekip','l')} menüsünde kedilerini düzenle: kürk, desen, göz, kulak, yüz, vücut ve isim. Her kedinin <b>bir ücretsiz görünüm değişikliği</b> var; sonrası ${CONFIG.edit.coins} altın ya da ${CONFIG.edit.gems} elmas. Önizleme ve vazgeçmek her zaman ücretsiz, isim değiştirmek de.</p>
     <p>${tagb('plus','Yeni eleman ekle','g')} ile ekibini büyüt: en fazla 3 garson, 2 barista, 2 kasiyer. Her yeni eleman bir seviye ve altın ister; işler aralarında paylaşılır.</p>
     <p>Market’teki ${tagb('shirt','Kıyafet','l')} sekmesinde önlük, üst, şort, papyon, atkı, şapka ve takımlar var. Önce kedinin üstünde dene, sonra satın al; aldığın kıyafet kalıcı olarak senin.</p>`},
   {t:'Küçük ipuçları',art:`${ic('heart')}${ic('music')}${ic('speaker')}`,body:`<ul class="gsteps"><li>${ic('clock')}<span>Menü, Market, Tarifler, Birleştir ya da Ekip açıkken kafede zaman durur; telaşlanma.</span></li>
     <li>${ic('table')}<span>Kafen 2 dört kişilik ve 2 iki kişilik masayla (12 kişi) açılır; müşteriler tek, 2, 3 ya da 4 kişilik gruplar halinde gelir; seviye atladıkça daha fazla masa koyabilirsin.</span></li><li>${ic('music')}<span>Sağ üstteki düğmelerle müziği ve sesleri açıp kapatabilirsin.</span></li>
     <li>${ic('auto')}<span>Sağ alttaki <b>Otomatik garson</b> düğmesiyle garsonun işleri kendisi yapar; tekrar dokununca kontrol yine sende.</span></li>
     <li>${ic('help')}<span>Bu rehberi istediğin zaman sağ üstteki <b>?</b> düğmesinden tekrar açabilirsin.</span></li><li>${ic('box')}<span>Oyunun bu cihazda otomatik kaydedilir.</span></li></ul>`}]}
const GD={i:0,prev:'cafe'};
function openGuide(i=0){if(typeof authBadge==='function')authBadge();GD.prev=UI.mode==='guide'?GD.prev:UI.mode;GD.i=i;setMode('guide');renderGuide()}
function closeGuide(){if(!S.guideSeen){S.guideSeen=true;markDirty()}setMode(GD.prev&&GD.prev!=='guide'&&GD.prev!=='ce'?GD.prev:'cafe')}
function renderGuide(){const P=guidePages(),p=P[GD.i];const last=GD.i===P.length-1;
  $('gdBody').innerHTML=`<div class="gpage"><h3>${p.t}</h3><div class="gart">${p.art}</div>${p.body}</div>
    <div class="gdots">${P.map((_,k)=>`<i class="${k===GD.i?'on':''}"></i>`).join('')}</div>
    <div class="gnav"><button class="btn light" type="button" id="gdPrev" ${GD.i?'':'disabled'}>${ic('left')}Geri</button><span style="font-weight:800;font-size:12px;opacity:.7">${GD.i+1} / ${P.length}</span>
    <button class="btn ${last?'green':''}" type="button" id="gdNext">${last?ic('check')+'Hadi başlayalım!':'İleri'+ic('right')}</button></div>`;
  $('gdPrev').onclick=()=>{if(GD.i>0){GD.i--;renderGuide();$('guide').querySelector('.scroll').scrollTop=0}};
  $('gdNext').onclick=()=>{if(last)closeGuide();else{GD.i++;renderGuide();$('guide').querySelector('.scroll').scrollTop=0}}}
// kaydırma ile sayfa çevirme
{let sx=null;const el=$('guide');el.addEventListener('pointerdown',e=>{sx=e.clientX});el.addEventListener('pointerup',e=>{if(sx==null)return;const dx=e.clientX-sx;sx=null;if(Math.abs(dx)>60){const n=guidePages().length;if(dx<0&&GD.i<n-1){GD.i++;renderGuide()}else if(dx>0&&GD.i>0){GD.i--;renderGuide()}}})}
// HUD: ? düğmesi (ses düğmelerinin yanında)
{const row=document.querySelector('button[aria-label="Müzik"]').parentElement;const b=document.createElement('button');b.type='button';b.className='iconbtn';b.style.cssText='width:36px;height:36px;padding:4px';b.setAttribute('aria-label','Rehber');b.innerHTML=UI_IC.help;
 b.onclick=()=>openGuide(0);row.prepend(b)}

// ---- kaydı sil (onaylı) ----
$('gdReset').onclick=()=>{UI.modal=true;const m=$('lvModal');
  m.innerHTML=`<div class="lvcard" role="dialog" aria-label="Kaydı sil" style="padding-top:18px"><h3>Baştan başlamak istiyor musun?</h3><p>Seviyen, paran, elmasların, eşyaların, tariflerin, birleştirme tahtan ve kedilerinin tasarımı silinecek. Bu işlem geri alınamaz.</p>
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn light" type="button" id="rsNo">Vazgeç</button><button class="btn red" type="button" id="rsYes">${ic('trash')}Evet, sil</button></div></div>`;m.hidden=false;
  $('rsNo').onclick=()=>{m.hidden=true;UI.modal=false};
  $('rsYes').onclick=()=>{RESETTING=true;clearTimeout(saveTimer);try{localStorage.removeItem(SAVE_KEY)}catch(e){}location.reload()}};

 {id:'price',name:'Usta Dokunuş',icon:'star',desc:'Ürünlerin kalitesi artar: müşteriler aynı fiyattan daha memnun kalır ve daha yüksek fiyatı kabul eder.',max:3,cost:[60,150,320],lv:[2,4,7],fx:l=>`ürün kalitesi +${(l*0.3).toFixed(1)} yıldız`},

 {id:'tip',name:'Güler Yüz',icon:'heart',desc:'Ekibin daha sıcak karşılar: her seviye bahşiş şansını 8 puan artırır.',max:3,cost:[40,110,240],lv:[1,3,6],fx:l=>`bahşiş şansı +${l*8} puan`},
 {id:'energy',name:'Büyük Enerji Deposu',icon:'bolt',desc:'Birleştirme enerjisinin üst sınırı her seviyede 10 artar.',max:2,cost:[90,220],lv:[3,6],fx:l=>`enerji sınırı ${CONFIG.energy.max+l*10}`}];
const upgLv=id=>(S.upg&&S.upg[id])|0;
const priceOf=r=>{const p=S.prices&&S.prices[r.id];return p!=null?p:r.price};   // oyuncunun belirlediği fiyat (Menü → Fiyatlar)
const prepMul=()=>1-0.12*upgLv('speed');
const tipBonus=()=>0.08*upgLv('tip');
const energyMax=()=>CONFIG.energy.max+10*upgLv('energy');
function upgState(u){const l=upgLv(u.id);if(l>=u.max)return {done:true,l};const c=u.cost[l],need=u.lv[l];
  if(S.lvl<need)return {ok:false,l,c,why:`Seviye ${need} gerekli`};if(S.coins<c)return {ok:false,l,c,why:`${c} altın gerekli`};return {ok:true,l,c}}
function buyUpg(id){const u=UPG.find(x=>x.id===id);if(!u)return false;const s=upgState(u);if(!s.ok)return false;
  addCoins(-s.c,'upg');S.upg[id]=s.l+1;sfx('goal');toast(`<b>${u.name} ${s.l+1}. seviye!</b><br>${u.fx(s.l+1)[0].toUpperCase()+u.fx(s.l+1).slice(1)}`,ic(u.icon),2800);bump('upg');markDirty();return true}
function renderUpg(g){g.innerHTML=UPG.map(u=>{const s=upgState(u),l=upgLv(u.id);const lock=!s.done&&S.lvl<u.lv[l];
    return `<button class="card upg${lock?' locked':''}" type="button" data-up="${u.id}" aria-current="${UI.sel===u.id}"><div class="th upth">${ic(u.icon)}</div>${lock?`<span class="tag">${ic('lock')}Sv ${u.lv[l]}</span>`:''}
      <span class="pips" aria-label="${l}/${u.max}">${'<i class="on"></i>'.repeat(l)}${'<i></i>'.repeat(u.max-l)}</span><b>${u.name}</b><span class="price">${s.done?'En üst seviye':ic('coin')+s.c}</span></button>`}).join('');
  g.onclick=e=>{const b=e.target.closest('[data-up]');if(!b)return;UI.sel=b.dataset.up;renderMarket()};renderDetail()}
function upgDetail(d,id){const u=UPG.find(x=>x.id===id);if(!u){d.hidden=true;return}const s=upgState(u),l=upgLv(id);
  d.innerHTML=`<div class="th upth">${ic(u.icon)}</div><div class="tx"><b>${u.name} · ${l}/${u.max}</b><p>${u.desc} Şu an: ${l?u.fx(l):'yok'}.${s.done?'':` Sonraki: ${u.fx(l+1)}.`}${!s.done&&!s.ok?` <b>${s.why}.</b>`:''}</p>
    <div class="row">${s.done?`<button class="btn green" type="button" disabled>${ic('check')}Tamamlandı</button>`:`<button class="btn" type="button" id="upBuy" ${s.ok?'':'disabled'}>${ic('coin')}${s.c} · Geliştir</button>`}</div></div>`;
  const b=$('upBuy');if(b)b.onclick=()=>{if(buyUpg(id))renderMarket()}}

// ---------- hedef tarif: torbalar o tarifin temel malzemelerini daha sık verir ----------
function baseNeeds(id,acc=new Set()){const it=ITEMS[id];if(!it)return acc;if(it.chain){acc.add(it.chain+'1');return acc}if(it.combo){baseNeeds(it.combo.a,acc);baseNeeds(it.combo.b,acc)}return acc}
function targetBases(){if(!S.target)return null;const r=RECIPE[S.target];if(!r||S.recipes[r.id]){S.target=null;return null}return baseNeeds(r.disc)}
const needNames=id=>[...baseNeeds(RECIPE[id].disc)].map(x=>ITEMS[x].name).join(', ');
function setTarget(id){const r=RECIPE[id];if(!r||S.recipes[id])return;S.target=S.target===id?null:id;markDirty();sfx('tap');
  if(S.target)toast(`<b>Hedef: ${r.name}</b><br>Torbalar ${needNames(id)} malzemelerini daha sık verecek`,`<img src="${productThumb(id)}" alt="">`,2800)}
{const t=document.createElement('div');t.id='mgTarget';t.className='mgtarget';document.querySelector('#merge .mtop').after(t);
 t.addEventListener('click',e=>{if(e.target.closest('[data-tx]')){S.target=null;markDirty();renderTarget();renderInfo()}else if(e.target.closest('[data-tgo]')){const r=RECIPES.find(x=>!S.recipes[x.id]&&S.lvl>=x.lvl)||RECIPES.find(x=>!S.recipes[x.id]);if(r)UI.rbTab=r.cat;setMode('book')}})}
function renderTarget(){const t=$('mgTarget');if(!t)return;const tut=S.tr&&S.tr!=='done';t.hidden=tut;if(tut)return;targetBases();
  const key=(S.target||'')+'|'+(S.req?S.req.rid:'');if(t._k===key)return;t._k=key;
  if(S.target){const r=RECIPE[S.target];t.innerHTML=`<img src="${productThumb(r.id)}" alt=""><div class="tx"><b>${ic('target')}Hedef: ${r.name}</b><small>${needNames(r.id)} daha sık çıkıyor</small></div><button class="iconbtn" type="button" data-tx aria-label="Hedefi kaldır">${UI_IC.close}</button>`}
  else t.innerHTML=`<span class="ic">${UI_IC.target}</span><div class="tx"><b>Hedef tarif seç</b><small>Tarifler’de “Hedefle”ye dokun; torbalar o malzemeleri daha sık verir</small></div><button class="btn light" type="button" data-tgo>Seç</button>`}

// ---------- özel istekler: süreli, menüde olmayan bir ürün; satınca büyük ödül ----------
{const r=document.createElement('div');r.className='goal req';r.id='req';r.hidden=true;r.setAttribute('role','button');r.tabIndex=0;$('goal').after(r);r.onclick=()=>openReq()}
function reqCands(){const out=[];for(const r of RECIPES){if(r.def||S.lvl<r.lvl)continue;
    const kind=S.menu[r.id]&&S.unlocked[r.id]?'menu':S.unlocked[r.id]?'open':S.recipes[r.id]?'disc':'new';out.push({r,kind,time:{menu:110,open:150,disc:200,new:300}[kind]})}return out}
function newReq(){let C=reqCands();if(!C.length)return;
  // ilk seviyelerde yalnız açık (menüde/menüye eklenebilir) ürünler istenir ve süre daha uzundur; kaçırmanın cezası yok
  const early=S.lvl<4;if(early){const o=C.filter(x=>x.kind==='menu'||x.kind==='open');if(o.length)C=o;C=C.map(x=>({...x,time:Math.round(x.time*1.6)}))}const nm=C.filter(x=>x.kind!=='menu');const pool=nm.length&&Math.random()<0.8?nm:C;const x=pool[Math.floor(Math.random()*pool.length)];
  const who=LOOKS[Math.floor(Math.random()*LOOKS.length)].name;const coins=Math.round(20+priceOf(x.r)*4+(x.kind==='new'?25:x.kind==='disc'?12:0));
  S.req={rid:x.r.id,who,left:x.time,total:x.time,coins,kind:x.kind};if(x.kind==='new'&&!S.target)S.target=x.r.id;markDirty();sfx('chime');
  const how={menu:'Menünde var; sipariş edilmesini bekle',open:'Menü’den menüne ekle',disc:'Tarifler’den ürünü aç ve menüye ekle',new:'Birleştirme tahtasında keşfet (hedefe alındı)'}[x.kind];
  toast(`<b>Özel istek: ${who} ${x.r.name} istiyor!</b><br>${how} · ödül ${coins} altın`,`<img src="${productThumb(x.r.id)}" alt="">`,4200);hudReq()}
function reqServed(item){if(!S.req||item.id!==S.req.rid)return;const q=S.req;S.req=null;S.reqCd=140+Math.random()*100;
  setTimeout(()=>{addCoins(q.coins,'bonus');S.gems+=1;hudGems();addXP(30);sfx('levelup');toast(`<b>${q.who} çok mutlu!</b><br>Özel istek tamam · +${q.coins} altın, +1 elmas`,`<img src="${productThumb(q.rid)}" alt="">`,3400);bump('req')},700);hudReq();markDirty()}
function reqTick(dt){if(!S.created||S.tut!=='done'||S.lvl<2||S.closed)return;
  if(S.req){S.req.left-=dt;if(S.req.left<=0){const q=S.req;S.req=null;S.reqCd=100+Math.random()*60;toast(`${q.who} beklemekten vazgeçti. Sonraki isteğe yetiş!`,`<img src="${productThumb(q.rid)}" alt="">`,2800);markDirty();hudReq()}return}
  if(S.reqCd==null)S.reqCd=90;S.reqCd-=dt;if(S.reqCd<=0){S.reqCd=60;newReq()}}
function hudReq(){const e=$('req');if(!e)return;const q=S.req;if(!q){e.hidden=true;return}e.hidden=false;const r=RECIPE[q.rid];
  const html=`<img src="${productThumb(r.id)}" alt=""><span><b>${q.who}</b> ${r.name} istiyor</span><em>${fmtT(q.left)}</em><i>+${q.coins}${ic('coin')}</i>`;if(e._h!==html){e.innerHTML=html;e._h=html}
  e.classList.toggle('hurry',q.left<30)}
function openReq(){const q=S.req;if(!q)return;const r=RECIPE[q.rid];sfx('tap');
  if(!S.recipes[r.id]){if(S.target!==r.id){S.target=r.id;markDirty()}setMode('merge');toast(`<b>${r.name}</b> hedefte: ${needNames(r.id)} daha sık çıkar`,ic('target'),2400)}
  else if(!S.unlocked[r.id]){UI.rbTab=r.cat;setMode('book')}
  else if(!S.menu[r.id])setMode('menu');
  else toast(`${r.name} menünde! Bir müşteri sipariş edince istek tamamlanır.`,`<img src="${productThumb(r.id)}" alt="">`,2400)}

// ---------- müdavimler ve VIP ----------
const regTier=n=>{const v=((S.visits||{})[n])|0;return v>=20?2:v>=6?1:0};
function addVisit(c){const n=c.look.name;if(!PERSONA[n]||n==='VIP')return;const t0=regTier(n);S.visits[n]=(S.visits[n]|0)+1;const t1=regTier(n);
  if(t1>t0){if(t1===1)bump('regular');setTimeout(()=>toast(t1===1?`<b>${n} artık müdavimin!</b><br>Daha sık bahşiş bırakacak`:`<b>${n} sadık müdavimin oldu!</b><br>Bahşişleri daha da arttı`,ic('heart'),3200),900)}}
function wantVIP(){return S.created&&S.tut==='done'&&S.lvl>=3&&!customers.some(c=>c.vip)&&Math.random()<CONFIG.vipChance}
function custTag(c){if(c.vip){c.tag=`${ic('star')}VIP gurme`;toast('<b>VIP gurme geldi!</b><br>Onu iyi ağırla; cömert bahşiş bırakır',ic('star'),3000);sfx('chime');return}
  if(c.group&&c.group.size>1){if(c===c.group.leader)c.tag=`${ic('paw')}${c.group.size} kişilik grup`;return}
  const t=regTier(c.look.name);if(t)c.tag=`${ic('heart')}${c.look.name}${t===2?' · sadık':''}`}

// ---------- Poşa ile Yosun boşta muhabbet eder ----------
async function idleChat(w){const b=BSTAFF[0];if(!b||b.busy||b.job||baristaQ.length||!b.idleAt||!atSpot(b.ch,b.idleAt,0.1)||customers.some(c=>PENDING.has(c.state))||Math.random()<0.5)return false;
  const ch=w.ch,P=W_WAIT[w.i],yaw=Math.atan2(1.2-P.x,0.4-P.z);await ch.faceTo(b.ch.pos.x,b.ch.pos.z);if(jobs.length)return true;
  b.ch.faceTo(ch.pos.x,ch.pos.z);staffBubble(ch,'heart',2.4);staffBubble(b.ch,'heart',2.2,0.6);
  await Promise.all([ch.doFor('Wave_One_Hand',1.2),(async()=>{await sleep(0.5);if(!b.busy&&!b.job)await b.ch.doFor('IDLE_TALK',1.4);if(!b.busy&&!b.job)b.ch.face(0)})()]);
  if(!jobs.length)await ch.doFor('IDLE_LOOK',1.6);if(!jobs.length)await ch.face(yaw);return true}
const SBUB=[];let sbSeq=0;
function staffBubble(ch,icon,dur,delay=0){const t=gameT+delay;SBUB.push({ch,icon,from:t,until:t+dur,id:++sbSeq})}

// ---------- kaçak müşteri: kasiyer fark ederse koşup yakalar ----------
function willRun(c){const t=regTier(c.look.name);return S.created&&S.tut==='done'&&S.lvl>=CONFIG.dash.lvl&&!c.vip&&!customers.some(x=>x!==c&&(x.state==='RUNNING'||x.state==='CAUGHT'))&&CSTAFF.length>0&&Math.random()<CONFIG.dash.chance*(t===2?0:t===1?0.4:1)}
function pickCashier(auto){let best=null,bd=1e9;for(const k of CSTAFF){if(k.chasing||cashMoving)continue;const R=REGS[k.i];if(auto&&R&&(R.busy||R.cust))continue;if(auto&&!k.ready)continue;
    const d=R?(R.busy?5:0)+(R.cust?2:0):0;if(d<bd){bd=d;best=k}}return best}
async function runAway(c){const ch=c.char;c.ranAway=true;c.state='RUNNING';c.bubble=null;ch.look=0;ch.acts.Chair_Sit_Idle_F.timeScale=1;await ch.standUp();
  if(c.order&&c.order.mesh)fadeOut(c.order.mesh);freeSeat(c);bump('dashes');
  sfx('nope');toast(`<b>${c.look.name} ödemeden kaçıyor!</b><br>Kasiyer görmezse “Yakala!”ya dokun`,ic('alert'),3200);
  (async()=>{await sleep(CONFIG.dash.notice);if(c.state==='RUNNING'&&!c.chaser&&Math.random()<CONFIG.dash.noticeChance){const k=pickCashier(true);if(k)chase(c,k)}})();
  ch.speed=0.95;
  let ok=await ch.walkTo(DOOR_IN.x,DOOR_IN.z,{interrupt:()=>c.caught});
  if(!c.caught&&ok)await ch.walkTo(OUTSIDE.x,OUTSIDE.z,{direct:true,interrupt:()=>c.caught});
  if(c.caught){await c.caughtDone;c.state='LEAVING';ch.speed=0.85;await ch.walkTo(DOOR_IN.x,DOOR_IN.z);await ch.walkTo(OUTSIDE.x,OUTSIDE.z,{direct:true})}
  else{c.state='ESCAPED';sfx('nope');toast(`${c.look.name} kaçtı! Bu sefer ödemeden gitti`,ic('paw'),2600)}
  scene.remove(ch.o);customers.splice(customers.indexOf(c),1)}
async function chase(c,k){if(!k||c.chaser||c.state!=='RUNNING')return false;c.chaser=k;k.chasing=true;k.ready=false;const R=REGS[k.i]||REGS[0];const ch=k.ch;
  while(R&&R.busy)await sleep(0.1);
  if(c.state!=='RUNNING'){await chaseBack(k);return false}
  staffBubble(ch,'alert',1.4);sfx('chime');const sp0=ch.speed;ch.canRun=true;ch.speed=1.7;await cashExit(ch,c.char.pos.x);
  let t=0;while(c.state==='RUNNING'&&t<25){const p=c.char.pos;if(Math.hypot(ch.pos.x-p.x,ch.pos.z-p.z)<0.62){await catchRunner(c,k);break}
    ch.walkTo(p.x,p.z,{direct:p.x<DOOR_IN.x-0.2});await sleep(0.2);t+=0.2}
  if(c.state==='ESCAPED'){ch.walkTo(ch.pos.x,ch.pos.z,{direct:true});staffBubble(ch,'sleepy',1.6);await ch.doFor('IDLE_TALK',0.8)}
  ch.canRun=false;ch.speed=sp0;await chaseBack(k);return true}
async function catchRunner(c,k){const ch=k.ch,cc=c.char;c.caughtDone=new Promise(r=>c._cd=r);c.caught=true;c.state='CAUGHT';
  ch.walkTo(ch.pos.x,ch.pos.z,{direct:true});await sleep(0.05);
  await Promise.all([ch.faceTo(cc.pos.x,cc.pos.z),cc.faceTo(ch.pos.x,ch.pos.z)]);c.bubble='sorry';
  await Promise.all([ch.doFor('IDLE_TALK',1.6),(async()=>{await sleep(0.5);await cc.doFor('Wave_One_Hand',1.1)})()]);
  sfx('register');pay(c,REGS[k.i]||REGS[0],cc.pos.clone().setY(1.25));c.bubble=null;bump('caught');
  const nm=(S.chars&&S.chars[k.key]&&S.chars[k.key].name)||'Kasiyer';toast(`<b>${nm} kaçağı yakaladı!</b><br>${c.look.name} hesabını ödedi`,ic('coin'),2800);
  c._cd()}
async function chaseBack(k){const R=REGS[k.i]||REGS[0];const st=R.stand;const ch=k.ch;
  // kasa arkasına: tezgahın yanından dolaşarak dön
  await cashEnter(ch,st);await ch.face(0);k.chasing=false;k.ready=REGS.length>k.i}
// kasa tezgahının arkasından çıkış/giriş: tezgahın yanındaki geçitten (içinden geçmeden)
const CASH_GATE={L:-0.6,R:1.3,back:-3.4,front:-2.12};
function gateX(x){return CASH_GATE.L}   // sağ tarafta kasiyer sandalyesi var: tezgah arkasından hep sol geçitten çıkılır
async function cashExit(ch,tx){if(ch.pos.z>CASH_GATE.front-0.05)return;const g=gateX(tx);await ch.walkTo(g,ch.pos.z,{direct:true});await ch.walkTo(g,CASH_GATE.front,{direct:true})}
async function cashEnter(ch,st){if(ch.pos.z<CASH_GATE.front-0.05){await ch.walkTo(st.x,st.z,{direct:true});return}const g=gateX(ch.pos.x);await ch.walkTo(g,CASH_GATE.front);await ch.walkTo(g,st.z,{direct:true});await ch.walkTo(st.x,st.z,{direct:true})}

// ---------- hediye masa (ilk müşteriden sonra) ----------
function giftTable(){if(placedTables()>=tableCap(S.lvl))return false;const rec={uid:++S.uid,id:'t_round',x:0,z:0,rot:1,chair:S.chairDefault||'c_cushion',col:2};
  for(const b of [[1.4,1.9],[2.6,2.0],[0.3,2.0],[1.5,-0.5],[3.2,0.6]])for(let r=0;r<=1.2;r+=0.2)for(let a=0;a<Math.max(1,Math.round(r*12));a++){const t=a/Math.max(1,Math.round(r*12))*Math.PI*2;
    rec.x=Math.round((b[0]+Math.cos(t)*r)*20)/20;rec.z=Math.round((b[1]+Math.sin(t)*r)*20)/20;
    if(!validatePlacement(rec,rec.uid)){S.furniture.push(rec);spawnFurn(rec);refreshWorld();sfx('place');markDirty();
      toast('<b>Hediye: yeni bir masa!</b><br>Daha çok müşteri ağırlayabilirsin',ic('table'),3200);return true}}
  return false}

function fxUI(){const hp=new THREE.Vector3();
  for(const b of SBUB){if(gameT<b.from)continue;b.ch.head.getWorldPosition(hp);hp.y+=0.5;place(el('sb'+b.id,'bubble sbub',ic(b.icon)),hp)}

function stockShort(items){if(S.tut!=='done')return null;const need={};for(const r of items)for(const k of needsOf(r))need[k]=(need[k]||0)+1;

// ---------- kucakta koli: "Carry_Heavy_Object_Walk" animasyonu + iki elin arasında duran koli ----------
const HOLDS=new Set();const _hl=new THREE.Vector3(),_hr=new THREE.Vector3(),_hs=new THREE.Vector3();
function holdBox(ch,g){ch.carry=g;ch.carryAnim='Carry_Heavy_Object_Walk_inplace';g.userData.ch=ch;g.userData.hold=true;g.userData.hl=ch.o.getObjectByName('mixamorigLeftHand');g.userData.hr=ch.o.getObjectByName('mixamorigRightHand');g.userData.sp=ch.o.getObjectByName('mixamorigSpine1');scene.add(g);HOLDS.add(g);holdTick()}

// kucaktaki koli eğilmenin dibinde elden yere kayarak iner (ışınlanmaz), sonra yerdeki koli yığınına dönüşür
function boxToFloor(ch,x,z){const g=ch.carry;if(!g)return;HOLDS.delete(g);ch.carry=null;ch.carryAnim=null;const from=g.position.clone(),to=new THREE.Vector3(x,0.1,z),r0=g.rotation.y;
  tween(0.28,u=>{const e=u*u;g.position.lerpVectors(from,to,e);g.rotation.y=r0+(0.1-r0)*u}).then(()=>scene.remove(g))}

function holdPlace(g){{const U=g.userData;if(!U.hl||!U.hr)return;U.hl.getWorldPosition(_hl);U.hr.getWorldPosition(_hr);U.sp.getWorldPosition(_hs);
  const yaw=U.ch.o.rotation.y;g.position.set((_hl.x+_hr.x)/2,(_hl.y+_hr.y)/2-0.03,(_hl.z+_hr.z)/2);

  const fx=Math.sin(yaw),fz=Math.cos(yaw);const d=(g.position.x-_hs.x)*fx+(g.position.z-_hs.z)*fz;if(d<0.22){g.position.x+=fx*(0.22-d);g.position.z+=fz*(0.22-d)}g.rotation.y=yaw;

  if(U.from){U.lt=Math.min(1,(U.lt||0)+lastDt/0.3);const e=1-(1-U.lt)*(1-U.lt);g.position.lerpVectors(U.from,g.position.clone(),e);if(U.lt>=1)U.from=null}}}
async function supArrive(p){const T=stockS();
  const r=SkeletonUtils.clone(TEMPLATE);const ch=new Char(r,{run:false,xs:1});applyLook(r,SUPC_CFG,512);ch.o.traverse(o=>{if(o.isMesh){o.castShadow=true;o.frustumCulled=false}});
  ch.tray=makeTray();ch.avoidOf=walkersNear;SUPC={ch,p};const st=SUP_ENTRY[0];ch.pos.set(st.x,0,st.z);ch.o.rotation.y=Math.PI;
  try{const bx=new THREE.Group();const b0=boxMesh(1.3);b0.position.y=-0.15;bx.add(b0);   // kollar arası ~0.45 m: koli iki eli dolduracak boydaholdBox(ch,bx);
    for(const q of SUP_ENTRY.slice(1))await ch.walkTo(q.x,q.z,{direct:true});await ch.faceTo(SUP_DROP.x,SUP_DROP.z);
    // eğilip koliyi yere bırakır: koli kucaktan yere iner

    let nDrop=0;await bend(ch,1.2,()=>{boxToFloor(ch,SUP_DROP.x,SUP_DROP.z);const lim=nowT()+30000;for(const q of T.pend.slice())if(q===p||q.eta<=lim){T.pend.splice(T.pend.indexOf(q),1);T.arr.push(q);nDrop++}supBoxes();sfxSafe('place')});saveNow();
    toast(nDrop>1?`<b>Toptancı geldi!</b><br>${nDrop} siparişin kolileri birlikte kapının önüne bırakıldı`:`<b>Toptancı geldi!</b><br>${(SUP(p.sup)||{}).name||"Toptancı"} kolileri kapının önüne bıraktı`,ic('box'),2600);
    await ch.doFor('Wave_One_Hand',1.2);
    for(const q of SUP_ENTRY.slice(0,2).reverse())await ch.walkTo(q.x,q.z,{direct:true});
  }catch(e){console.warn('supArrive',e);const i=T.pend.indexOf(p);if(i>=0){T.pend.splice(i,1);T.arr.push(p);supBoxes()}}

function stockTick(dt){if(!S.created)return;const T=stockS(),now=nowT();if(SUPC)SUPC.ch.update(dt);holdTick();

    if(now-p.eta>CONFIG.stock.skipAnimAfter*1000){T.pend.splice(T.pend.indexOf(p),1);T.arr.push(p);supBoxes();markDirty();continue}
    if(!SUPC){supArrive(p);break}}
  if(!SUPBOX||(SUPBOX.children.length>0)!==(T.arr.length>0&&!FETCH.picked))supBoxes();lowStockWarn();supAutoTick(dt);fetchTick(dt)}

// AFK: sen yokken satılabilecek müşteri sayısı stokla sınırlıdır (yoldaki koliler önce depoya girer)
function afkStockLimit(served){const T=stockS();for(const p of T.pend.slice())if(p.eta<=nowT()){T.pend.splice(T.pend.indexOf(p),1);T.arr.push(p)}
  if(T.arr.length){for(const p of T.arr)for(const k in p.items)T.b[k].push({n:p.items[k],q:p.q,c:p.unit[k]});T.arr=[];supBoxes()}
  let n=0,i=0;const av0=RECIPES.filter(r=>S.unlocked[r.id]&&S.menu[r.id]);if(!av0.length)return 0;
  while(n<served){let ok=false;for(let j=0;j<av0.length;j++){const r=av0[(i+j)%av0.length];if(stockOk(r)){finEv('cogs',stockUse(r).c);ok=true;i=(i+j+1);break}}if(!ok)break;n++}

const FETCH={on:false,picked:false,who:'',t:0};
function fetchTick(dt){const T=stockS();if(!T.arr.length||FETCH.on||SUPC){FETCH.t=0;return}FETCH.t+=dt;if(FETCH.t<1)return;
  if(typeof COURIER!=='undefined'&&COURIER&&!COURIER.busy&&!DLV.active&&!DLV.call){const ch=COURIER.ch;FETCH.on=true;FETCH.who=COURIER_CFG.name;COURIER.busy=true;
    (async()=>{try{await fetchRun(ch)}catch(e){console.warn('koli',e)}finally{await ch.walkTo(COURIER_IDLE.x,COURIER_IDLE.z);await ch.face(COURIER_YAW);COURIER.busy=false}})();return}
  if(WSTAFF.length&&!FETCH.queued){FETCH.queued=true;enqueue('koli',async w=>{FETCH.queued=false;if(!stockS().arr.length)return;FETCH.on=true;FETCH.who=(S.chars[w.key]||{}).name||'Garson';try{await fetchRun(w.ch)}catch(e){console.warn('koli',e)}})}}
async function fetchRun(ch){const T=stockS();let stack=null;try{
  await ch.walkTo(DOOR_IN.x,DOOR_IN.z);await ch.walkTo(OUTSIDE.x,OUTSIDE.z,{direct:true});await ch.walkTo(SUP_STAND.x,SUP_STAND.z,{direct:true});await ch.faceTo(SUP_DROP.x,SUP_DROP.z);
  // eğilip kolileri tepsiye alır

  await bend(ch,1.1,()=>{FETCH.picked=true;supBoxes();if(ch.tray)ch.tray.visible=false;stack.position.set(SUP_DROP.x,0.14,SUP_DROP.z);stack.userData.from=stack.position.clone();stack.userData.lt=0;holdBox(ch,stack);sfxSafe('place')});
  await ch.walkTo(OUTSIDE.x,OUTSIDE.z,{direct:true});await ch.walkTo(DOOR_IN.x,DOOR_IN.z,{direct:true});
  await ch.walkTo(BOX_COUNTER.stand.x,BOX_COUNTER.stand.z);await ch.faceTo(BOX_COUNTER.top.x,BOX_COUNTER.top.z);

  }finally{if(ch.carry&&HOLDS.has(ch.carry))dropHold(ch);FETCH.on=false;FETCH.picked=false;supBoxes()}}

// ================= AŞAMA 9: İŞLETME RAPORU (gelir · gider · kâr) =================
// Her altın hareketi addCoins üzerinden kategorisiyle kaydedilir (uydurma sayı yok). Olaylar (ağırlanan, kaybedilen,
// paket teslimi…) ayrıca sayılır. "Son 60 dk" = şu andan geriye kayan 60 dakikalık pencere (gerçek saat).
// Not: kayıtlar cihazda tutulur (prototip); üretimde ödemeler ve harcamalar sunucuda doğrulanmalıdır.
const FIN_IN={sale:'Masa satışları',tip:'Bahşişler',dlv:'Paket satışları',afk:'Sen yokken hasılat',bonus:'Görev / istek ödülleri',other:'Diğer gelir'};
const FIN_OUT={stock:'Malzeme (toptancı)',staff:'Ekip (işe alım)',decor:'Mobilya ve dekor',equip:'Ekipman',upg:'Geliştirmeler',recipe:'Tarif açma',style:'Kıyafet ve stil',other:'Diğer gider'};
const FIN_KEEP=48*3600e3;
function finS(){const F=S.fin||(S.fin={tx:[],ev:[],tot:{},evTot:{},since:nowT()});if(!F.tx)F.tx=[];if(!F.ev)F.ev=[];if(!F.tot)F.tot={};if(!F.evTot)F.evTot={};return F}
function finTrim(a){const lim=nowT()-FIN_KEEP;let k=0;while(k<a.length&&a[k][0]<lim)k++;if(k)a.splice(0,k);if(a.length>8000)a.splice(0,a.length-8000)}
// altın hareketi: n>0 gelir, n<0 gider
function finRec(n,cat){if(!n||!S||!S.created)return;const F=finS();const io=n>0?'i':'o';const c=(n>0?FIN_IN:FIN_OUT)[cat]?cat:'other';
  F.tx.push([nowT(),io+':'+c,Math.abs(n)]);F.tot[io+':'+c]=(F.tot[io+':'+c]||0)+Math.abs(n);finTrim(F.tx)}
function finEv(k,n=1){if(!S||!S.created)return;const F=finS();F.ev.push([nowT(),k,n]);F.evTot[k]=(F.evTot[k]||0)+n;finTrim(F.ev);markDirty()}
// bir zaman penceresindeki toplamlar (dakika; null = tüm zamanlar)
function finWindow(mins){const F=finS(),out={inc:{},exp:{},ev:{},rev:0,cost:0};
  if(mins==null){for(const k in F.tot){const [io,c]=k.split(':');if(io==='i'){out.inc[c]=F.tot[k];out.rev+=F.tot[k]}else{out.exp[c]=F.tot[k];out.cost+=F.tot[k]}}Object.assign(out.ev,F.evTot);return out}
  const t0=nowT()-mins*60000;for(const [t,k,v] of F.tx){if(t<t0)continue;const [io,c]=k.split(':');if(io==='i'){out.inc[c]=(out.inc[c]||0)+v;out.rev+=v}else{out.exp[c]=(out.exp[c]||0)+v;out.cost+=v}}
  for(const [t,k,v] of F.ev){if(t<t0)continue;out.ev[k]=(out.ev[k]||0)+v}return out}
// saat saat (yerel saatle hizalı) son n saat
function finHours(n=8){const F=finS(),now=new Date(nowT());const h0=new Date(now);h0.setMinutes(0,0,0);const out=[];
  for(let i=n-1;i>=0;i--){const a=h0.getTime()-i*3600e3,b=a+3600e3;let r=0,c=0;for(const [t,k,v] of F.tx){if(t<a||t>=b)continue;if(k[0]==='i')r+=v;else c+=v}out.push({a,r,c,label:String(new Date(a).getHours()).padStart(2,'0')+':00',cur:i===0})}return out}

const _bq=new THREE.Quaternion(),_bp=new THREE.Quaternion(),_ba=new THREE.Vector3();

function workArms(I){const r=SkeletonUtils.clone(TEMPLATE);const mx=new THREE.AnimationMixer(r);mx.clipAction(I).play();mx.setTime(0.3);r.updateMatrixWorld(true);
  const B=n=>r.getObjectByName('mixamorig'+n);const P=n=>B(n).getWorldPosition(new THREE.Vector3());const inv=new THREE.Matrix4().copy(r.matrixWorld).invert();const L=v=>v.applyMatrix4(inv);

      let best=ev();for(let st=0.6;st>0.01;st*=0.6)for(let it=0;it<6;it++){let imp=false;for(let k=0;k<6;k++)for(const sg of [1,-1]){prm[k]+=sg*st;const v=ev();if(v<best-1e-6){best=v;imp=true}else prm[k]-=sg*st}if(!imp)break}
