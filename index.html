<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2b1a10"><style>[hidden]{display:none!important}html,body{margin:0;height:100%}</style></head><body>
<title>TabbyChef</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Nunito:wght@700;800&display=swap">
<style>
/* Layout: full-screen WebGL café (primary screen). Top: level/XP card + goal chip (left), coins (right). Bottom: hint line + 4-tab nav.
   Market = bottom sheet over the café (café stays visible for previews); Recipes and Merge = full panels above the nav. Single warm theme by design. */
:root{--vw:1vw;--vh:1vh;--cream:#fbf3e4;--paper:#fff8ec;--ink:#4a2e1c;--gold:#f2b134;--olive:#8a9a3b;--pink:#f2a6a0;--wood:#c98a4e;--wood2:#b87a42;--mint:#bfe39a;--red:#d9534f;--sky:#bfe3f5;
  --sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px);   /* Claude uygulaması :root'u zaten bu kadar boşlukla açarsa JS bunları 0 yapar */
  --navh:66px;--font-display:"Baloo 2","Nunito",system-ui,sans-serif;--font-body:"Nunito",system-ui,sans-serif;color-scheme:light}
html{height:100%;box-sizing:border-box}body{height:100%}
body{margin:0;background:#2b1a10;color:var(--ink);font-family:var(--font-body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#game{position:relative;width:100%;height:100%;overflow:hidden;background:#2b1a10}   /* calc(100*var(--vh)) değil: sayfa çerçevenin güvenli alan boşluğunun içine sığmalı */
canvas{display:block;width:100%;height:100%;touch-action:none}
button{font:inherit;color:inherit}
svg.i{display:block;width:100%;height:100%}
.hud{position:absolute;left:0;right:0;top:0;z-index:4;display:flex;align-items:flex-start;gap:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-top:max(10px,var(--sat));pointer-events:none}
.hud-l{display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0}
.pill{background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:4px 12px;font-family:var(--font-display);font-weight:800;font-size:16px;box-shadow:0 3px 0 var(--ink)}
.pill.coins{margin-left:auto;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;font-size:18px;line-height:1.2;transition:transform .15s}
.pill.coins.bump{transform:scale(1.12)}
.pill.coins .ic{width:22px;height:22px}
.lvl{display:flex;align-items:center;gap:8px;background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:4px 10px 4px 4px;box-shadow:0 3px 0 var(--ink)}
.lvl-badge{position:relative;width:38px;height:38px;flex:none}
.lvl-badge span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:17px;line-height:1;padding-top:3px}
.lvl-info{display:flex;flex-direction:column;gap:3px;width:104px}
.lvl-info b{font-family:var(--font-display);font-weight:800;font-size:14px;line-height:1}
.xpbar{height:9px;border:2px solid var(--ink);border-radius:999px;background:#f3e2c6;overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:var(--olive);transition:width .45s ease}
.lvl-info small{font-size:11px;line-height:1;font-weight:800;opacity:.75;font-variant-numeric:tabular-nums}
.goal{display:flex;align-items:center;gap:6px;max-width:min(calc(62*var(--vw)),260px);background:rgba(255,248,236,.94);border:2.5px solid var(--ink);border-radius:12px;padding:3px 9px 3px 5px;font-size:12px;font-weight:800;line-height:1.2;box-shadow:0 2px 0 var(--ink)}
.goal .ic{width:18px;height:18px;flex:none}
.goal em{font-style:normal;opacity:.7;font-variant-numeric:tabular-nums;white-space:nowrap}
.bottom{position:absolute;left:0;right:0;bottom:calc(var(--navh) + var(--sab) + 6px);z-index:4;padding-inline:16px;pointer-events:none}
.hint{text-align:center;font-family:var(--font-display);font-weight:800;font-size:14px;color:var(--cream);text-shadow:0 2px 0 var(--ink),0 0 10px var(--ink)}
/* alt gezinme */
.nav{position:absolute;left:0;right:0;bottom:0;z-index:8;display:flex;justify-content:center;gap:6px;height:var(--navh);padding:6px max(10px,env(safe-area-inset-left,0px)) var(--sab);box-sizing:content-box;
  background:repeating-linear-gradient(90deg,var(--wood) 0 46px,var(--wood2) 46px 48px);border-top:3px solid var(--ink)}
.nav button{flex:1;max-width:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:0 3px 0 var(--ink);font-family:var(--font-display);font-weight:800;font-size:12px;line-height:1;padding:4px 2px;cursor:pointer;height:54px}
.nav button .ic{width:28px;height:28px}
.nav button[aria-pressed="true"]{background:var(--gold);transform:translateY(-2px)}
.nav button:active{box-shadow:0 1px 0 var(--ink);transform:translateY(2px)}
.nav button:focus-visible,.btn:focus-visible,.card:focus-visible,.tab:focus-visible{outline:3px solid #fff;outline-offset:2px}
/* dünya üzerindeki bağlamsal düğmeler */
#ui{position:absolute;inset:0;z-index:5;pointer-events:none;overflow:hidden}
#ui>*{position:absolute;left:0;top:0;will-change:transform}
#ui.off>*{visibility:hidden}
.act{pointer-events:auto;appearance:none;display:flex;align-items:center;gap:5px;border:3px solid var(--ink);border-radius:999px;background:var(--gold);color:var(--ink);font-family:var(--font-display);font-weight:800;font-size:14px;line-height:1;padding:5px 12px 5px 6px;box-shadow:0 3px 0 var(--ink);cursor:pointer;white-space:nowrap;animation:bob 1.1s ease-in-out infinite}
.act .ic{width:24px;height:24px}
.act.prep{background:#fff8ec}.act.pick{background:var(--mint)}
.act:active{box-shadow:0 1px 0 var(--ink);margin-top:2px}
@keyframes bob{50%{margin-top:-4px}}
.bubble{display:flex;align-items:center;gap:4px;background:#fff;border:3px solid var(--ink);border-radius:16px 16px 16px 4px;padding:3px 7px;font-size:13px;font-weight:800;line-height:1.1;box-shadow:0 2px 0 var(--ink)}
.bubble img,.bubble .ic{width:30px;height:30px;display:block}
.progress{display:flex;align-items:center;gap:6px;background:#fff8ec;border:3px solid var(--ink);border-radius:999px;padding:3px 8px 3px 4px;box-shadow:0 2px 0 var(--ink);width:104px}
.progress img{width:26px;height:26px;display:block}
.progress i{display:block;height:8px;border-radius:4px;background:var(--olive);max-width:62px}
.coin-pop{display:flex;align-items:center;gap:3px;font-family:var(--font-display);font-weight:800;font-size:20px;color:var(--gold);text-shadow:0 2px 0 var(--ink),0 0 6px var(--ink)}
.coin-pop .ic{width:22px;height:22px}
.coin-pop.tip{font-size:15px;color:#fff}
@media (prefers-reduced-motion:reduce){.act{animation:none}}
/* ortak panel dili */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:3px solid var(--ink);border-radius:999px;background:var(--gold);font-family:var(--font-display);font-weight:800;font-size:15px;line-height:1;padding:9px 16px;box-shadow:0 3px 0 var(--ink);cursor:pointer;white-space:nowrap}
.btn .ic{width:20px;height:20px}
.btn.light{background:var(--paper)}.btn.green{background:var(--mint)}.btn.red{background:#f6b8b3}
.btn:disabled{opacity:.5;cursor:default;filter:grayscale(.4)}
.btn:not(:disabled):active{box-shadow:0 1px 0 var(--ink);transform:translateY(2px)}
.iconbtn{appearance:none;width:40px;height:40px;flex:none;display:grid;place-items:center;border:3px solid var(--ink);border-radius:50%;background:var(--paper);box-shadow:0 3px 0 var(--ink);cursor:pointer;padding:6px}
.iconbtn:active{box-shadow:0 1px 0 var(--ink);transform:translateY(2px)}
.panel-head{display:flex;align-items:center;gap:10px;padding:10px 14px;background:repeating-linear-gradient(90deg,var(--wood) 0 46px,var(--wood2) 46px 48px);border-bottom:3px solid var(--ink)}
.panel-head h2{margin:0;flex:1;font-family:var(--font-display);font-weight:800;font-size:20px;line-height:1.1;color:var(--paper);text-shadow:0 2px 0 var(--ink)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 14px 6px;scrollbar-width:none;flex:none}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;flex:none;display:flex;align-items:center;gap:5px;border:2.5px solid var(--ink);border-radius:999px;background:var(--paper);font-family:var(--font-display);font-weight:800;font-size:13px;line-height:1;padding:6px 11px 6px 7px;cursor:pointer}
.tab .ic{width:20px;height:20px}
.tab[aria-selected="true"]{background:var(--gold);box-shadow:0 2px 0 var(--ink)}
.empty{padding:20px;text-align:center;font-weight:800;opacity:.7}
/* market (alt sayfa) */
.sheet{position:absolute;left:0;right:0;bottom:calc(var(--navh) + var(--sab) + 9px);z-index:7;height:min(60%,520px);display:flex;flex-direction:column;background:var(--cream);border-top:3px solid var(--ink);border-radius:22px 22px 0 0;overflow:hidden;transform:translateY(115%);transition:transform .28s ease;visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;padding:6px 14px 16px;align-content:start;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.card{appearance:none;position:relative;display:flex;flex-direction:column;align-items:stretch;gap:3px;text-align:left;background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:6px;box-shadow:0 3px 0 var(--ink);cursor:pointer;min-width:0}
.card[aria-current="true"]{background:#fde9b8}
.card .th{aspect-ratio:1;border-radius:10px;background:#f6e6cc;display:grid;place-items:center;overflow:hidden}
.card .th img{width:100%;height:100%;object-fit:contain;display:block}
.card b{font-size:12px;line-height:1.15;font-weight:800;min-height:2.3em}
.card .price{display:flex;align-items:center;gap:3px;font-family:var(--font-display);font-weight:800;font-size:14px;line-height:1}
.card .price .ic{width:16px;height:16px}
.card .tag{position:absolute;top:10px;left:10px;display:flex;align-items:center;gap:3px;background:var(--ink);color:var(--paper);border-radius:999px;padding:3px 7px 3px 4px;font-size:11px;font-weight:800;line-height:1}
.card .tag .ic{width:13px;height:13px}
.card.locked .th{filter:grayscale(.7) brightness(.85)}
.card .own{position:absolute;top:10px;right:10px;background:var(--mint);border:2px solid var(--ink);border-radius:999px;padding:2px 6px;font-size:10px;font-weight:800;line-height:1}
.detail{flex:none;display:flex;gap:12px;align-items:center;margin:4px 14px 6px;padding:8px;background:var(--paper);border:3px solid var(--ink);border-radius:16px}
.detail[hidden]{display:none}
.detail .th{width:84px;height:84px;flex:none;border-radius:12px;background:#f6e6cc;overflow:hidden}
.detail .th img{width:100%;height:100%;object-fit:contain}
.detail .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.detail .tx b{font-family:var(--font-display);font-weight:800;font-size:16px;line-height:1.1}
.detail .tx p{margin:0;font-size:12px;line-height:1.3;font-weight:700;opacity:.85}
.detail .row{display:flex;gap:6px;flex-wrap:wrap}
.detail .btn{font-size:14px;padding:7px 12px}
/* yerleştirme / düzenleme çubuğu */
.placebar{position:absolute;left:0;right:0;bottom:calc(var(--navh) + var(--sab) + 16px);z-index:7;display:flex;flex-direction:column;align-items:center;gap:8px;padding-inline:16px;pointer-events:none}
.placebar[hidden]{display:none}
.placebar .msg{pointer-events:none;max-width:340px;text-align:center;background:rgba(255,248,236,.96);border:3px solid var(--ink);border-radius:14px;padding:6px 12px;font-size:13px;font-weight:800;line-height:1.25;box-shadow:0 3px 0 var(--ink)}
.placebar .msg.bad{background:#fde0dc}
.placebar .row{pointer-events:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
/* tam ekran paneller */
.screen{position:absolute;left:0;right:0;top:0;bottom:calc(var(--navh) + var(--sab) + 9px);z-index:7;display:flex;flex-direction:column;background:var(--cream);
  background-image:radial-gradient(circle at 12px 12px,rgba(201,138,78,.10) 2px,transparent 2.5px);background-size:24px 24px}
.screen[hidden]{display:none}
.screen .panel-head{padding-top:max(10px,var(--sat))}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
/* tarif defteri */
.rlist{display:flex;flex-direction:column;gap:10px;padding:6px 14px 18px;max-width:560px;margin:0 auto}
.rc{display:flex;gap:10px;align-items:center;background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:8px;box-shadow:0 3px 0 var(--ink)}
.rc .th{width:72px;height:72px;flex:none;border-radius:12px;background:#f6e6cc;overflow:hidden;position:relative}
.rc .th img{width:100%;height:100%;object-fit:contain}
.rc.unk .th img{filter:brightness(0) opacity(.28)}
.rc .th .q{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:30px;color:var(--ink)}
.rc .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.rc .tx b{font-family:var(--font-display);font-weight:800;font-size:15px;line-height:1.1}
.rc .meta{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;font-weight:800;line-height:1}
.rc .meta span{display:inline-flex;align-items:center;gap:3px}
.rc .meta .ic{width:15px;height:15px}
.combo{display:flex;align-items:center;gap:3px;flex-wrap:wrap;font-size:11px;font-weight:800;opacity:.9}
.combo .mi{width:28px;height:28px;flex:none;background:#f6e6cc;border:2px solid var(--ink);border-radius:8px;padding:1px;box-sizing:border-box}
.status{align-self:flex-start;border:2px solid var(--ink);border-radius:999px;padding:2px 8px;font-size:11px;font-weight:800;line-height:1.2;background:var(--mint)}
.status.lv{background:#fde9b8}.status.un{background:#efe3d0}
/* birleştirme */
.mtop{display:flex;align-items:center;gap:10px;padding:10px 14px 4px;max-width:520px;width:100%;margin:0 auto;box-sizing:border-box}
.energy{flex:1;display:flex;align-items:center;gap:8px;background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:5px 10px 5px 6px;box-shadow:0 3px 0 var(--ink)}
.energy .ic{width:28px;height:28px;flex:none}
.energy .ebar{flex:1;display:flex;flex-direction:column;gap:3px}
.energy .ebar b{font-family:var(--font-display);font-weight:800;font-size:15px;line-height:1;font-variant-numeric:tabular-nums}
.energy .ebar small{font-size:11px;font-weight:800;opacity:.75;line-height:1;font-variant-numeric:tabular-nums}
.ebar .xpbar i{background:var(--gold)}
.board-wrap{padding:6px 14px;display:flex;justify-content:center}
.board{--cell:min(calc((calc(100*var(--vw)) - 92px)/6),68px);display:grid;grid-template-columns:repeat(6,var(--cell));grid-template-rows:repeat(6,var(--cell));gap:3px;padding:3px;
  border-style:solid;border-width:30px 26px 28px 26px;border-image:url(img/board_frame.webp) 126 110 114 110 fill / 30px 26px 28px 26px stretch;filter:drop-shadow(0 4px 0 rgba(74,46,28,.35));touch-action:none}
.cell{position:relative;background:url(img/cell_empty.png) center/100% 100% no-repeat;border-radius:12px;display:grid;place-items:center}
.cell.hl{background-image:url(img/cell_match.png)}
.cell.sel{background-image:url(img/cell_selected.png)}
#merge{background:var(--cream) url(img/board_bg.jpg) 0 0/220px 220px repeat}
.it img,.drag img,.mi img,.ic img{width:100%;height:100%;object-fit:contain;pointer-events:none;display:block;-webkit-user-drag:none;user-select:none}
.it.cool img{filter:grayscale(.8) opacity(.6)}
.it{position:absolute;inset:3px;display:grid;place-items:center;touch-action:none;cursor:grab}
.it svg{width:100%;height:100%;pointer-events:none}
.it .lv{position:absolute;right:-2px;bottom:-2px;min-width:16px;height:16px;border-radius:999px;background:var(--ink);color:var(--paper);font-size:10px;font-weight:800;line-height:16px;text-align:center;padding:0 3px;pointer-events:none}
.it .cnt{position:absolute;left:-2px;top:-3px;background:var(--paper);border:2px solid var(--ink);border-radius:999px;font-size:9px;font-weight:800;line-height:1;padding:2px 4px;pointer-events:none;font-variant-numeric:tabular-nums}
.it.cool svg{filter:grayscale(.8) opacity(.6)}
.it .cd{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--ink);color:var(--paper);border-radius:999px;font-size:11px;font-weight:800;line-height:1;padding:3px 6px;pointer-events:none;font-variant-numeric:tabular-nums}
.it.pop{animation:pop .32s ease}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.it.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.drag{position:absolute;z-index:20;width:64px;height:64px;pointer-events:none;transform:translate(-50%,-60%) scale(1.15);filter:drop-shadow(0 4px 0 rgba(74,46,28,.35))}
.drag svg{width:100%;height:100%}
.info{max-width:520px;width:100%;margin:4px auto 16px;box-sizing:border-box;padding:0 14px}
.info .box{display:flex;gap:10px;align-items:center;background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:8px;box-shadow:0 3px 0 var(--ink);min-height:62px}
.info .box .mi{width:52px;height:52px;flex:none}
.info .box .tx{flex:1;min-width:0;font-size:12px;font-weight:800;line-height:1.3}
.info .box .tx b{display:block;font-family:var(--font-display);font-size:15px;line-height:1.1;margin-bottom:2px}
.info .box .btn{font-size:13px;padding:6px 10px}
/* bildirimler ve seviye */
.toasts{position:absolute;left:50%;top:calc(max(10px,var(--sat)) + 104px);transform:translateX(-50%);z-index:12;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(calc(92*var(--vw)),360px)}
.toast{display:flex;align-items:center;gap:8px;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:6px 12px 6px 6px;font-size:13px;font-weight:800;line-height:1.25;box-shadow:0 3px 0 var(--ink);animation:tin .3s ease}
.toast .ic,.toast img{width:30px;height:30px;flex:none}
.toast.out{opacity:0;transform:translateY(-6px);transition:all .3s}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
.modal{position:absolute;inset:0;z-index:15;display:grid;place-items:center;background:rgba(43,26,16,.45);padding:20px}
.modal[hidden]{display:none}
.lvcard{position:relative;width:min(100%,340px);background:var(--cream);border:3px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink);padding:44px 16px 16px;text-align:center;animation:lvin .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes lvin{from{transform:scale(.6);opacity:0}}
.lvcard .star{position:absolute;left:50%;top:-44px;width:96px;height:96px;transform:translateX(-50%);animation:spin 6s linear infinite}
.lvcard .star span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:30px;padding-top:6px}
@keyframes spin{to{transform:translateX(-50%) rotate(360deg)}}
.lvcard h3{margin:4px 0 2px;font-family:var(--font-display);font-weight:800;font-size:24px;line-height:1.1}
.lvcard p{margin:0 0 10px;font-size:13px;font-weight:800;opacity:.8}
.lvgift{display:flex;justify-content:center;gap:10px;margin:2px 0 10px}.lvgift>span{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border:2.5px solid var(--ink);border-radius:999px;background:#fff3d6;font-family:var(--font-display);font-size:17px}.lvgift .ic,.lvgift svg{width:22px!important;height:22px!important;flex:none}
.lvup{width:min(100%,318px);padding:36px 12px 12px}.lvup .star{width:74px;height:74px;top:-34px}.lvup .star span{font-size:24px}.lvup h3{font-size:21px}.lvup p{margin-bottom:6px}
.lvup .unl{display:grid;grid-template-columns:1fr 1fr;gap:5px;max-height:calc(26*var(--vh));margin-bottom:10px}.lvup .unl div{font-size:10.5px;gap:5px;padding:3px 6px 3px 3px;border-width:2px;border-radius:10px}.lvup .unl img,.lvup .unl .ic{width:26px;height:26px;border-radius:6px}.lvup .unl div:only-child{grid-column:1/-1}.lvup .btn{padding-top:8px;padding-bottom:8px}
.unl{display:flex;flex-direction:column;gap:6px;max-height:calc(42*var(--vh));overflow-y:auto;margin-bottom:12px;text-align:left}
.unl div{display:flex;align-items:center;gap:8px;background:var(--paper);border:2.5px solid var(--ink);border-radius:12px;padding:4px 8px 4px 4px;font-size:12px;font-weight:800;line-height:1.2}

.confetti i{position:absolute;top:-10px;width:8px;height:12px;border-radius:2px;animation:fall 1.6s ease-in forwards}

#load small{font-family:var(--font-body);font-weight:700;font-size:13px;opacity:.8;max-width:34ch;line-height:1.4}

<script>
/* ================= YATAY OYUN: telefon dikey tutulsa da oyun yatay açılır =================
   Dikeyde sayfa (body) 90° döndürülür. Oyunun bütün kodu "sanal" yatay bir ekran görür: innerWidth/innerHeight,
   dokunma koordinatları (clientX/Y, pageX/Y), getBoundingClientRect ve elementFromPoint bu sanal ekrana çevrilir. */
(function(){
  const de=document.documentElement,R={on:false,w:0,h:0};window.__ROT=R;
  const realW=()=>de.clientWidth||screen.width,realH=()=>de.clientHeight||screen.height;
  const dIW=Object.getOwnPropertyDescriptor(window,'innerWidth')||Object.getOwnPropertyDescriptor(Window.prototype,'innerWidth');
  const dIH=Object.getOwnPropertyDescriptor(window,'innerHeight')||Object.getOwnPropertyDescriptor(Window.prototype,'innerHeight');
  const iw=()=>dIW&&dIW.get?dIW.get.call(window):realW(),ih=()=>dIH&&dIH.get?dIH.get.call(window):realH();
  try{Object.defineProperty(window,'innerWidth',{configurable:true,get(){return R.on?ih():iw()}});Object.defineProperty(window,'innerHeight',{configurable:true,get(){return R.on?iw():ih()}})}catch(e){}
  // olay koordinatları: gerçek (rx,ry) -> sanal (ry, W-rx)
  const wrap=(P,a,b)=>{const da=Object.getOwnPropertyDescriptor(P,a),db=Object.getOwnPropertyDescriptor(P,b);if(!da||!db||!da.get)return;
    Object.defineProperty(P,a,{configurable:true,get(){const v=da.get.call(this);return R.on?db.get.call(this):v}});
    Object.defineProperty(P,b,{configurable:true,get(){const v=db.get.call(this);return R.on?R.w-da.get.call(this):v}})};
  wrap(MouseEvent.prototype,'clientX','clientY');wrap(MouseEvent.prototype,'pageX','pageY');
  if(window.Touch){wrap(Touch.prototype,'clientX','clientY');wrap(Touch.prototype,'pageX','pageY')}
  const gbr=Element.prototype.getBoundingClientRect;
  Element.prototype.getBoundingClientRect=function(){const r=gbr.call(this);if(!R.on)return r;const W=R.w;
    const o={left:r.top,top:W-r.right,width:r.height,height:r.width};o.right=o.left+o.width;o.bottom=o.top+o.height;o.x=o.left;o.y=o.top;o.toJSON=()=>o;return o};
  const efp=Document.prototype.elementFromPoint;Document.prototype.elementFromPoint=function(x,y){return R.on?efp.call(this,R.w-y,x):efp.call(this,x,y)};
  const efps=Document.prototype.elementsFromPoint;if(efps)Document.prototype.elementsFromPoint=function(x,y){return R.on?efps.call(this,R.w-y,x):efps.call(this,x,y)};
  let st=null;
  function apply(){const w=iw(),h=ih(),on=h>w*1.05;R.on=on;R.w=w;R.h=h;de.classList.toggle('rot',on);de.classList.toggle('land',true);
    const VW=on?h:w,VH=on?w:h;de.style.setProperty('--vw',VW/100+'px');de.style.setProperty('--vh',VH/100+'px');
    if(!st){st=document.createElement('style');document.head.appendChild(st)}
    st.textContent=on?`html.rot,html.rot body{overflow:hidden}html.rot body{position:fixed;left:0;top:0;width:${h}px;height:${w}px;transform-origin:0 0;transform:translateX(${w}px) rotate(90deg)}
      html.rot{--sat:0px;--sab:0px}`:'';
    // oyun kendi boyutunu yeniden hesaplasın
    try{window.dispatchEvent(new Event('rotchange'))}catch(e){}}
  apply();addEventListener('resize',()=>{const was=R.on+':'+R.w;apply();if(was!==R.on+':'+R.w)setTimeout(()=>dispatchEvent(new Event('resize')),30)});
  if(window.visualViewport)visualViewport.addEventListener('resize',apply);
  try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})}catch(e){}
})();
</script>

    for(const o of boxes){if(x>o.minX-PAD&&x<o.maxX+PAD&&z>o.minZ-PAD&&z<o.maxZ+PAD){g[k*GX+i]=1;break}}}return g}

  const key=(i,k)=>k*GX+i;const open=[[0,si,sk]];const g=new Map([[key(si,sk),0]]);const came=new Map();const h=(i,k)=>Math.hypot(i-ti,k-tk);

    for(let dk=-1;dk<=1;dk++)for(let di=-1;di<=1;di++){if(!di&&!dk)continue;const ni=i+di,nk=k+dk;if(blocked(ni,nk))continue;if(di&&dk&&(blocked(i+di,k)||blocked(i,k+dk)))continue;
      const ng=g.get(key(i,k))+Math.hypot(di,dk);if(ng<(g.get(key(ni,nk))??Infinity)){g.set(key(ni,nk),ng);came.set(key(ni,nk),key(i,k));open.push([ng+h(ni,nk),ni,nk])}}}
  if(!found)return [];const path=[];let c=key(ti,tk);while(c!==undefined){path.push(c);c=came.get(c)}path.reverse();
  const pts=path.map(c=>{const [x,z]=posOf(c%GX,Math.floor(c/GX));return new THREE.Vector3(x,0,z)});

function floorTex(pat,c1,c2){const cv=document.createElement('canvas');cv.width=cv.height=256;const x=cv.getContext('2d');const C=c=>'#'+c.toString(16).padStart(6,'0');

  if(pat==='check'){x.fillRect(0,0,128,128);x.fillRect(128,128,128,128);x.strokeRect(0,0,256,256);x.strokeRect(0,0,128,128);x.strokeRect(128,128,128,128)}
  else if(pat==='tile'){for(let i=0;i<2;i++)for(let j=0;j<2;j++){x.fillStyle=(i+j)%2?C(c1):C(c2);x.fillRect(i*128+4,j*128+4,120,120)}x.fillStyle='#e8d9c0';x.globalAlpha=1;for(let k=0;k<=2;k++){x.fillRect(k*128-4,0,8,256);x.fillRect(0,k*128-4,256,8)}}
  else if(pat==='herring'){x.fillStyle=C(c1);x.fillRect(0,0,256,256);for(let r=-2;r<6;r++)for(let c=0;c<4;c++){const ox=c*64,oy=r*64+c*0;x.save();x.translate(ox+32,oy+32);x.rotate(Math.PI/4);x.fillStyle=(r+c)%2?C(c1):C(c2);x.fillRect(-40,-10,80,20);x.strokeRect(-40,-10,80,20);x.restore();
      x.save();x.translate(ox+32,oy+64);x.rotate(-Math.PI/4);x.fillStyle=(r+c)%2?C(c2):C(c1);x.fillRect(-40,-10,80,20);x.strokeRect(-40,-10,80,20);x.restore()}}
  const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(ROOM_W/1.2,ROOM_D/1.2);t.anisotropy=4;return t}

  await Promise.all([ca.doFor('IDLE_WORK',1.5*cm),(async()=>{await sleep(0.6*cm);sfx('register');await tween(0.25,u=>dr.position.z=z0+0.16*u)})()]);
  pay(c,R);await sleep(0.45);await tween(0.25,u=>dr.position.z=z0+0.16*(1-u));P.screen.material.color.setHex(0x9fe0a8);
  ca.doFor('Wave_One_Hand',1.2).then(()=>ca.face(CP.r));R.busy=false;stDrain(k)}
function chooseRecipe(c){const av=availableRecipes();if(!av.length)return null;const rq=S.req&&av.find(r=>r.id===S.req.rid);if(rq&&Math.random()<0.55)return rq;
  const w=av.map(r=>(c.persona.pref[r.cat]||1)*(c.vip?r.price:1));let s=w.reduce((a,b)=>a+b,0)*Math.random();for(let i=0;i<av.length;i++){s-=w[i];if(s<=0)return av[i]}return av[av.length-1]}
// grubun siparişi tek seferde alınır: garson masaya bir kez gelir, her üye için ayrı ürün yazılır
function takeOrder(c0){const g=c0.group||{members:[c0],size:1,leader:c0};if(!groupReady(g))return;const M=g.members.filter(m=>!m.gone);for(const m of M)m.orderQueued=true;const c=g.leader;
  enqueue('take',async w=>{const ch=w.ch;const s=c.seat;await waitSpotClear(w,s.serve);await ch.walkTo(s.serve.x,s.serve.z);await ch.face(s.serveYaw);
    for(const m of M)m.bubble='think';await ch.doFor('IDLE_TALK',1.8+0.6*(M.length-1));
    const noStk=[];for(const m of M){const item=(window.__force&&RECIPE[window.__force])||chooseRecipe(m);
      if(m.gone)continue;if(!item){noStk.push(m);continue}const u=stockUse(item);const o={id:'S'+(++orderSeq),customer:m,table:m.table,seat:m.seat,item,price:priceOf(item),qual:u.q,cost:u.c,state:'TAKEN',paid:false,mesh:null,slot:-1};orders.push(o);m.order=o;
      if(m.menu){scene.remove(m.menu);m.menu=null}m.bubble=null;m.state='ORDER_TAKEN';m._taken()}
    if(noStk.length)stockOut(g,noStk);sfx('order')})}
// birden çok sipariş (grup) tek seferde baristaya iletilir
function submitOrders(L){L=L.filter(o=>o.state==='TAKEN'&&!o.submitQueued);if(!L.length)return;if(L.length===1)return submitOrder(L[0]);for(const o of L)o.submitQueued=true;
  enqueue('submit',async w=>{const ch=w.ch;const k=await claimSpot('prep',w);const P=PREP_SPOTS[k];await ch.walkTo(P.x,P.z);await ch.face(COUNTER_FACE);await ch.doFor('IDLE_WORK',1.4);
    for(const o of L){if(o.cancel){o.state='CANCELLED';o.cleared=true;continue}o.state='WAITING_FOR_PREPARATION';baristaQ.push(o)}sfx('chime')})}
function submitOrder(o){if(o.state!=='TAKEN'||o.submitQueued)return;o.submitQueued=true;
  enqueue('submit',async w=>{const ch=w.ch;const k=await claimSpot('prep',w);const P=PREP_SPOTS[k];await ch.walkTo(P.x,P.z);await ch.face(COUNTER_FACE);await ch.doFor('IDLE_WORK',1.2);
    if(o.cancel){o.state='CANCELLED';o.cleared=true;return}o.state='WAITING_FOR_PREPARATION';baristaQ.push(o);sfx('chime')})}
// grup siparişleri: aynı grubun hazır tabakları tek tepside, tek seferde götürülür
function servSibs(o){const g=o.customer&&o.customer.group;if(!g||!g.members)return [];return g.members.map(m=>m.order).filter(x=>x&&x!==o&&!x.cancel&&!x.cleared&&!x.delivery)}
const NOT_READY=new Set(['TAKEN','WAITING_FOR_PREPARATION','PREPARING','IN_PREPARATION']);
// otomatik modda garson, grubun diğer tabakları da hazır olana dek (tezgah dolarsa ya da 150 sn geçerse beklemez) bekler
function groupAllReady(o){const sb=servSibs(o);if(!sb.some(x=>NOT_READY.has(x.state)))return true;
  return slotUsed.indexOf(null)<0}   // tezgahta yer kalmadıysa (kilitlenmesin) hazır olanlar götürülür
function batchWaitOk(o){return groupAllReady(o)||gameT-(o.readyT||0)>150}
const TRAY_SLOTS=[[0,0],[-0.075,0.05],[0.075,0.05],[0,-0.07]];
function pickupOrder(o){if(o.state!=='READY'||o.pickupQueued)return;o.pickupQueued=true;
  const flag=servSibs(o).filter(x=>x.state==='READY'&&!x.pickupQueued);for(const x of flag)x.pickupQueued=true;   // kardeşleri de bu iş götürecek
  const unflag=()=>{for(const x of flag)if(x.state==='READY')x.pickupQueued=false};
  enqueue('serve',async w=>{if(o.cancel||!o.mesh||o.state!=='READY'){unflag();return}const ch=w.ch;const k=await claimSpot('pick',w);const P=PICK_SPOTS[k];await ch.walkTo(P.x,P.z);await ch.face(COUNTER_FACE);await ch.doFor('Idle_12',0.35);if(o.cancel||!o.mesh){freeSpot('pick',w);unflag();return}
    const tray=ch.tray;tray.visible=false;ch.carry=tray;await sleep(0.45);   // önce tepsi tutma pozu otursun, sonra tepsi görünsün
    // o anda hazır olan grup tabakları (en çok 4) birlikte alınır
    const B=[o,...servSibs(o)].filter(x=>x.state==='READY'&&x.mesh&&!x.cancel).slice(0,4);   // beklerken iptal olan tabak alınmaz
    if(!B.length){tray.visible=false;ch.carry=null;freeSpot('pick',w);unflag();return}
    B.forEach((x,i)=>{slotUsed[x.slot]=null;x.slot=-1;x.pickupQueued=true;tray.add(x.mesh);const f=TRAY_SLOTS[B.length===1?0:i];x.mesh.position.set(f[0],tray.userData.top,f[1]);x.mesh.rotation.set(0,0,0);x.state='PICKED_UP'});
    tray.visible=true;sfx('clink');freeSpot('pick',w);unflag();
    // yakın koltuktan uzağa doğru sırayla bırakır
    const left=B.slice();while(left.length){let bi=0,bd=1e9;left.forEach((x,i)=>{const d=Math.hypot(x.seat.serve.x-ch.pos.x,x.seat.serve.z-ch.pos.z);if(d<bd){bd=d;bi=i}});const x=left.splice(bi,1)[0];
      if(x.cancel){if(x.mesh){scene.attach(x.mesh);fadeOut(x.mesh);x.mesh=null}x.state='CANCELLED';x.cleared=true;continue}   // müşteri gitmiş: tabak geri götürülür
      const s=x.seat;await waitSpotClear(w,s.serve);await ch.walkTo(s.serve.x,s.serve.z);await ch.face(s.serveYaw);await sleep(0.2);
      if(x.cancel||!x.mesh){if(x.mesh){scene.attach(x.mesh);fadeOut(x.mesh);x.mesh=null}x.state='CANCELLED';x.cleared=true;continue}
      const from=new THREE.Vector3();x.mesh.getWorldPosition(from);scene.attach(x.mesh);const to=new THREE.Vector3(s.spot.x,x.table.topY,s.spot.z);
      await tween(0.45,u=>{x.mesh.position.lerpVectors(from,to,u);x.mesh.position.y+=Math.sin(u*Math.PI)*0.08});x.mesh.position.copy(to);sfx('clink');
      if(x.mesh.userData.hot)x.steam=steamOn(()=>cupTop(x.mesh),1.2);
      x.state='SERVED';addXP(CONFIG.xp.serve);x.customer._served()}
    ch.carry=null;tray.visible=false;
    await ch.doFor('IDLE_TALK',0.9)})}
async function consume(o,dur){const m=o.mesh;
  await tween(dur,u=>{if(m.userData.fill){const f=m.userData.fill,k=Math.max(0.03,1-u);f.scale.y=k;f.position.y=f.userData.base+f.userData.h*k/2;m.rotation.z=Math.sin(u*Math.PI*6)*0.08*(1-u)}
    else if(m.userData.body){const k=Math.max(0.001,1-u);m.userData.body.scale.set(k,k,k)}})}

function pay(c,R,at){const g=c.group||{members:[c]};const os=g.members.map(m=>m.order).filter(o=>o&&!o.paid&&!o.cancel);if(!os.length)return;const o=os[0];
  for(const x of os){x.paid=true;x.state='COMPLETED'}const rw=R?R.regW:CASH.reg;const p=at||new THREE.Vector3(rw.x,CASH.h+0.55,rw.z);
  const price=os.reduce((a,x)=>a+(x.price||priceOf(x.item)),0);addCoins(price,'sale');for(const x of os)finEv('sold:'+x.item.id,1);floatCoin(price,p);rateGroup(c.group);afkEarn(price,os.length);finEv('srv',os.length);finEv('cogs',os.reduce((a,x)=>a+(x.cost||0),0));
  const tipCh=c.vip?1:c.persona.tip+tipBonus()+stTipBonus()+0.1*regTier(c.look.name);
  if(Math.random()<tipCh){let tip=1+Math.floor(price*0.2);if(c.vip)tip=tip*2+3;o.tip=tip;setTimeout(()=>{addCoins(tip,'tip');sfx('tip');floatCoin(tip,p.clone().add(new THREE.Vector3(0,0.25,0)),true);if(c.vip)toast(`<b>VIP gurme memnun kaldı!</b><br>+${tip} bahşiş bıraktı`,ic('star'),2600)},450)}
  addXP(os.reduce((a,x)=>a+CONFIG.xp.complete+Math.round(x.item.price*CONFIG.xp.perPrice),0));
  for(const m of g.members)if(!m.vip&&!m.ranAway)addVisit(m);for(const x of os)reqServed(x.item);bump('orders',os.length)}

const AU={ctx:null,master:null,music:null,sfx:null,rev:null,dly:null,noise:null,playing:false,bar:0,next:0,timer:0,cycle:0,mel:null};
const SET=(()=>{let s={music:true,sfx:true};try{const r=JSON.parse(localStorage.getItem('posa-yosun-ses')||'null');if(r)s={...s,...r}}catch(e){}return s})();

const mtof=m=>440*Math.pow(2,(m-69)/12);
function auInit(){if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return}

  const ir=ctx.createBuffer(2,ctx.sampleRate*2.2,ctx.sampleRate);for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3.2)}

// ---- yapı taşları ----
function env(g,t,a,peak,dec,sus,rel,end){g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.setTargetAtTime(peak*sus,t+a,dec);g.gain.setTargetAtTime(0.0001,end,rel)}
function osc(type,f,t,stop,dest){const o=AU.ctx.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);o.connect(dest);o.start(t);o.stop(stop);return o}
function gainTo(dest,v=1){const g=AU.ctx.createGain();g.gain.value=v;g.connect(dest);return g}
function noiseSrc(t,dur,dest){const s=AU.ctx.createBufferSource();s.buffer=AU.noise;s.loop=true;s.connect(dest);s.start(t,Math.random()*1.5);s.stop(t+dur);return s}
function filt(type,f,q,dest){const b=AU.ctx.createBiquadFilter();b.type=type;b.frequency.value=f;b.Q.value=q;b.connect(dest);return b}
// ---- müzik enstrümanları ----
function ep(m,t,d,v){const f=mtof(m),g=gainTo(AU.music,0);const s=gainTo(AU.rev,0.22);g.connect(s);
  env(g,t,0.012,v,0.35,0.45,0.35,t+d);const end=t+d+1.6;osc('sine',f,t,end,g);const g2=gainTo(g,0.22);osc('sine',f*2.003,t,end,g2);

  const lfo=AU.ctx.createOscillator();lfo.frequency.value=4.2;const lg=AU.ctx.createGain();lg.gain.value=v*0.12;lfo.connect(lg);lg.connect(g.gain);lfo.start(t);lfo.stop(end)}
function bass(m,t,d,v){const f=mtof(m),lp=filt('lowpass',520,0.7,AU.music),g=gainTo(lp,0);env(g,t,0.01,v,0.25,0.55,0.12,t+d);osc('triangle',f,t,t+d+0.6,g);osc('sine',f,t,t+d+0.6,gainTo(g,0.6))}
function kal(m,t,v){const f=mtof(m),g=gainTo(AU.music,0);const ds=gainTo(AU.dly,0.32),rs=gainTo(AU.rev,0.3);g.connect(ds);g.connect(rs);

  const h=gainTo(g,0);h.gain.setValueAtTime(0.25,t);h.gain.setTargetAtTime(0.0001,t,0.05);osc('sine',f*3.01,t,t+0.3,h)}
function kick(t,v){const g=gainTo(AU.music,0);g.gain.setValueAtTime(v,t);g.gain.setTargetAtTime(0.0001,t,0.09);const o=osc('sine',110,t,t+0.4,g);o.frequency.setTargetAtTime(46,t,0.035)}
function hat(t,v,len=0.035){const g=gainTo(AU.music,0);g.gain.setValueAtTime(v,t);g.gain.setTargetAtTime(0.0001,t,len);noiseSrc(t,0.25,filt('highpass',7200,0.6,g))}
function brush(t,v){const g=gainTo(AU.music,0);g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.02);g.gain.setTargetAtTime(0.0001,t+0.02,0.09);noiseSrc(t,0.5,filt('bandpass',2400,0.7,g))}
// ---- armoni ve form ----
const CH={Fmaj9:[41,[57,60,64,67]],Em7:[40,[55,59,62,64]],Dm9:[38,[53,57,60,64]],G13:[43,[53,59,64,69]],Cmaj9:[36,[52,55,59,62]],Am9:[45,[55,59,60,64]],G6:[43,[52,55,59,62]]};
const SEC={A:['Fmaj9','Em7','Dm9','G13','Cmaj9','Am9','Dm9','G13'],B:['Am9','Fmaj9','Cmaj9','G6','Am9','Fmaj9','Dm9','G13']};
const FORM=['A','A','B','A'];const BEAT=0.75,SWING=0.58;
const PENTA=[60,62,64,67,69,72,74,76,79,81,84];
const RHY=[[[0,2],[3,1],[4,2],[6,2]],[[0,3],[3,1],[5,3]],[[1,1],[2,2],[4,1],[6,2]],[[0,4],[5,2]],[[2,2],[4,4]],[[0,1],[1,1],[2,2],[5,3]],[]];
function rnd(seed){let s=seed>>>0;return ()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function makeMelody(cycle){const R=rnd(9137+cycle*7919);const out={};
  for(const sec of ['A','B']){const bars=[];let cur=PENTA[3+Math.floor(R()*3)];
    for(let b=0;b<8;b++){if((b===3||b===7)&&R()<0.5){bars.push([]);continue}
      const src=(sec==='A'&&b>=4&&b<6)?bars[b-4]:null;   // motif tekrarı (5-6. ölçüler 1-2'yi yansıtır)
      const rh=src?src.map(n=>[n[0],n[1]]):RHY[Math.floor(R()*RHY.length)];const tones=CH[SEC[sec][b]][1].map(x=>x+12);
      const notes=rh.map(([p,d],k)=>{let m;if(src){m=src[k][2]}else{const step=Math.round((R()-0.5)*4);const idx=Math.max(0,Math.min(PENTA.length-1,PENTA.indexOf(cur)+step));m=PENTA[idx]}
        if(p%2===0){let best=m,bd=99;for(const t of tones.concat(tones.map(x=>x+12)))if(Math.abs(t-m)<bd&&t>=62&&t<=86){bd=Math.abs(t-m);best=t}m=best}cur=PENTA.reduce((a,x)=>Math.abs(x-m)<Math.abs(a-m)?x:a,PENTA[0]);return [p,d,m]});
      bars.push(notes)}out[sec]=bars}return out}
const at8=(t0,p)=>t0+Math.floor(p/2)*BEAT+(p%2?SWING*BEAT:0);
function scheduleBar(i,t0){const fi=Math.floor(i/8)%4,sec=FORM[fi],b=i%8;if(i%32===0){AU.mel=makeMelody(AU.cycle++)}
  const [root,voice]=CH[SEC[sec][b]];const intro=AU.cycle===1&&i<4;const light=sec==='B'&&b<4;
  // akorlar
  voice.forEach((m,k)=>ep(m,t0+k*0.012,BEAT*1.9,0.05));if(Math.random()<0.6)voice.forEach((m,k)=>ep(m,at8(t0,5)+k*0.01,BEAT*1.1,0.035));
  // bas
  if(!intro){bass(root,t0,BEAT*1.4,0.26);bass(Math.random()<0.5?root+7:root+12,at8(t0,Math.random()<0.5?4:5),BEAT*0.9,0.2)}

  if(!intro){kick(t0,0.32);if(!light&&Math.random()<0.4)kick(at8(t0,5),0.18);brush(t0+BEAT,light?0.05:0.09);brush(t0+3*BEAT,light?0.05:0.09);
    for(let p=0;p<8;p++)hat(at8(t0,p),(p%2?0.022:0.035)*(light?0.6:1))}
  // ezgi
  if(!intro&&AU.mel){for(const [p,d,m] of AU.mel[sec][b])kal(m,at8(t0,p),0.09)}
  if(b===7&&fi===3){kal(72,at8(t0,6),0.05)}}
function musicTick(){if(!AU.playing||!AU.gen)return;const ctx=AU.ctx;while(AU.next<ctx.currentTime+0.4){scheduleBar(AU.bar,AU.next);AU.bar++;AU.next+=4*BEAT}}
// ---- fon müziği: oyuncunun gönderdiği parça (kesintisiz döngü); yüklenemezse üretilen müzik yedek olarak çalar ----
const TRACK={url:'music/meow_brew.mp3',buf:null,src:null,gain:null,state:'none',vol:0.4};
function loadTrack(){if(TRACK.state!=='none')return;TRACK.state='loading';
  fetch(TRACK.url).then(r=>{if(!r.ok)throw new Error(r.status);return r.arrayBuffer()}).then(ab=>new Promise((res,rej)=>AU.ctx.decodeAudioData(ab,res,rej))).then(buf=>{

    const d=buf.getChannelData(0);let a=0,b=d.length-1;while(a<d.length&&Math.abs(d[a])<1e-5)a++;while(b>a&&Math.abs(d[b])<1e-5)b--;
    TRACK.buf=buf;TRACK.loopStart=a/buf.sampleRate;TRACK.loopEnd=(b+1)/buf.sampleRate;TRACK.state='ready';if(AU.playing&&!TRACK.src&&!AU.gen)trackPlay()})
  .catch(e=>{TRACK.state='failed';if(AU.playing&&!AU.gen)genStart()})}
function trackPlay(){const ctx=AU.ctx;if(!TRACK.gain){TRACK.gain=ctx.createGain();TRACK.gain.gain.value=0;TRACK.gain.connect(AU.master)}
  const src=ctx.createBufferSource();src.buffer=TRACK.buf;src.loop=true;src.loopStart=TRACK.loopStart;src.loopEnd=TRACK.loopEnd;src.connect(TRACK.gain);src.start(ctx.currentTime+0.05,TRACK.loopStart);TRACK.src=src;

function genStart(){AU.gen=true;AU.bar=0;AU.cycle=0;AU.next=AU.ctx.currentTime+0.15;const g=AU.music.gain;g.cancelScheduledValues(AU.ctx.currentTime);g.setTargetAtTime(0.34,AU.ctx.currentTime,1.2);
  AU.timer=setInterval(musicTick,60);musicTick()}
function musicStop(){if(!AU.ctx||!AU.playing)return;AU.playing=false;AU.gen=false;clearInterval(AU.timer);
  if(TRACK.src){const t=AU.ctx.currentTime,src=TRACK.src;TRACK.gain.gain.cancelScheduledValues(t);TRACK.gain.gain.setValueAtTime(TRACK.gain.gain.value,t);TRACK.gain.gain.setTargetAtTime(0,t,0.25);src.stop(t+1.5);TRACK.src=null}const g=AU.music.gain;g.cancelScheduledValues(AU.ctx.currentTime);g.setTargetAtTime(0,AU.ctx.currentTime,0.25)}
// ---- efektler ----
function bell(f,t,v,dec=0.9,dest=AU.sfx){const g=gainTo(dest,0);g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.004);g.gain.setTargetAtTime(0.0001,t+0.004,dec*0.3);

function blip(f0,f1,t,d,v,type='sine'){const g=gainTo(AU.sfx,0);g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.008);g.gain.setTargetAtTime(0.0001,t+0.01,d*0.4);const o=osc(type,f0,t,t+d*3,g);o.frequency.exponentialRampToValueAtTime(f1,t+d)}
function nz(t,d,v,type,f,q=1,att=0.01){const g=gainTo(AU.sfx,0);g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+att);g.gain.setTargetAtTime(0.0001,t+Math.max(att,d-0.05),0.05);noiseSrc(t,d+0.3,filt(type,f,q,g));return g}
const SFX={
  tap(t){blip(620,900,t,0.05,0.09)},
  pop(t){blip(320,760,t,0.07,0.16);nz(t,0.03,0.05,'bandpass',3000,1)},
  coin(t){blip(1318,1320,t,0.08,0.12,'triangle');blip(1975,1976,t+0.07,0.22,0.12,'triangle');bell(3951,t+0.07,0.03,0.5)},
  tip(t){SFX.coin(t);[2637,3136,3951].forEach((f,i)=>bell(f,t+0.18+i*0.06,0.035,0.5))},
  ding(t){bell(1568,t,0.16,1.4)},
  door(t){bell(1318,t,0.09,1.1);bell(1760,t+0.12,0.08,1.1);bell(1568,t+0.24,0.06,1.0)},
  order(t){for(let i=0;i<3;i++)nz(t+i*0.09,0.06,0.05,'bandpass',3200+i*300,2);bell(1046,t+0.32,0.07,0.6)},
  chime(t){kalS(84,t,0.1);kalS(88,t+0.09,0.09)},
  clink(t){bell(2490,t,0.06,0.35);bell(3710,t+0.03,0.04,0.3)},
  place(t){blip(150,60,t,0.12,0.25);nz(t,0.05,0.12,'bandpass',800,1.2)},
  buy(t){SFX.coin(t);SFX.pop(t+0.12)},
  nope(t){blip(240,170,t,0.16,0.12,'triangle')},
  merge(t){SFX.pop(t);kalS(79,t+0.05,0.1);kalS(84,t+0.11,0.09)},
  swap(t){blip(500,420,t,0.05,0.06)},
  discover(t){[72,76,79,84,88].forEach((m,i)=>kalS(m,t+i*0.08,0.1));nz(t+0.2,0.6,0.03,'highpass',6000,0.5,0.2)},
  levelup(t){[60,64,67,72,76,79,84].forEach((m,i)=>kalS(m,t+i*0.07,0.11));[72,76,79].forEach(m=>bell(mtof(m),t+0.55,0.05,1.6))},
  goal(t){[76,79,84].forEach((m,i)=>kalS(m,t+i*0.1,0.1));bell(2093,t+0.32,0.06,1.0)},
  register(t){nz(t,0.12,0.06,'bandpass',900,1.5);blip(180,90,t+0.12,0.08,0.12);bell(2637,t+0.2,0.08,0.6);bell(3136,t+0.27,0.07,0.6);SFX.coin(t+0.35)},
  meow(t){const ctx=AU.ctx;const out=gainTo(AU.sfx,0);out.gain.setValueAtTime(0.0001,t);out.gain.linearRampToValueAtTime(0.2,t+0.04);out.gain.setValueAtTime(0.2,t+0.22);out.gain.exponentialRampToValueAtTime(0.0001,t+0.42);

function commitEditor(pay){const [nm]=validName(CE.cfg.name);if(!nm||unownedWorn().length)return false;const role=CE.key;const ci=costInfo();
  if(CE.mode==='hire'){const hi=hireInfo(CE.role);if(!hi.ok||hi.key!==CE.key)return false;addCoins(-hi.cost,'staff');
    S.chars[CE.key]={name:nm,look:JSON.parse(JSON.stringify(CE.cfg.look)),wear:JSON.parse(JSON.stringify(CE.cfg.wear)),freeEdits:1};S.staff[CE.role]++;
    spawnStaff(CE.key,true);markDirty();saveNow();sfx('levelup');
    toast(`<b>${nm} ekibe katıldı!</b><br>Yeni ${ROLE_NAME[CE.role].toLowerCase()} · −${hi.cost} altın`,ic('paw'),3200);UI.backTo='team';closeEditor(true);return true}
  if(ci.kind==='paid'){if(pay==='coins'){if(S.coins<CONFIG.edit.coins)return false;addCoins(-CONFIG.edit.coins,'style')}else if(pay==='gems'){if(S.gems<CONFIG.edit.gems)return false;S.gems-=CONFIG.edit.gems;hudGems()}else return false}
  const ch=S.chars[role];if(ci.kind==='freeEdit')ch.freeEdits--;
  ch.name=nm;ch.look=JSON.parse(JSON.stringify(CE.cfg.look));ch.wear=JSON.parse(JSON.stringify(CE.cfg.wear));

  if(CE.mode==='create'){const i=ROLES.findIndex(r=>r.id===role);if(i<2){tutRoleDone(role,()=>openEditor(ROLES[i+1].id,'create'));return true}
    S.created=true;for(const r of ROLES)S.chars[r.id].freeEdits=1;markDirty();saveNow();
    tutRoleDone(role,()=>tutTeamDone(()=>{closeEditor(true);toast(`<b>Ekibin hazır!</b><br>${ROLES.map(r=>S.chars[r.id].name).join(', ')} kafede seni bekliyor.`,ic('paw'),3200)}));return true}

   {t:'Para, XP ve seviye',art:`${ic('coin')}${ic('xp')}${ic('star')}${ic('gem')}`,body:`<p>Her ödeme ${tagb('coin','altın')} ve XP kazandırır. XP dolunca <b>seviye atlarsın</b>: yeni masa yerleri, tarifler, renkler ve eşyalar açılır, seviye başına ${tagb('gem','3 elmas','l')} da kazanırsın.</p>

   {t:'Kafeni büyüt',art:`${ic('market')}${ic('table')}${ic('chair')}${ic('paint')}${ic('plant')}`,body:`<p>${tagb('market','Market','l')} sekmesinde masa, sandalye, duvar boyası, zemin, dekor ve ekipman var. Kilitli olanlar hangi seviyede açılacağını gösterir.</p>

   {t:'Tarif Defteri',art:`${ic('book')}<img src="${productThumb('latte')}" alt=""><img src="${productThumb('pasta')}" alt="">`,body:`<ul class="gsteps"><li><span class="n">1</span><span><b>Keşfet:</b> tarifin malzemesini birleştirme tahtasında yap.</span></li>
     <li><span class="n">2</span><span><b>Ürünü aç:</b> ${tagb('book','Tarifler','l')}’de ${tagb('check','Ürünü aç','g')}’a dokun. Seviye ve altın ister; ilk ürünün ücretsiz.</span></li>

   {t:'Birleştirme tahtası',art:`<span class="ic">${itemArt('bag_food')}</span><span class="ic">${itemArt('un1')}</span><span class="ar">+</span><span class="ic">${itemArt('un1')}</span><span class="ar">=</span><span class="ic">${itemArt('un2')}</span>`,body:`<ul class="gsteps">

     <li><span class="ic" style="width:30px;height:30px">${itemArt('c_latte')}</span><span>Bazı farklı malzemeler de birleşir ve yeni tarif keşfettirir (ör. espresso shot + süt köpüğü = latte).</span></li>

   {t:'Puan, fiyat ve sabır',art:`${UI_IC.starF}${ic('coin')}${UI_IC.wait}`,body:`<ul class="gsteps"><li>${UI_IC.starF}<span><b>Kafe puanı</b> (sağ üstteki yıldız): son ziyaretlerin ortalaması. Puan yükseldikçe daha sık müşteri ve paket sipariş gelir; düşerse kafe sessizleşir. Yıldıza dokununca yorumları görürsün.</span></li>
     <li>${ic('coin')}<span><b>Fiyatlar:</b> Menü → Fiyatlar’da her ürünün fiyatını ±1 altınla ayarla. Ucuz fiyat müşteriyi mutlu eder ama kârı azaltır; pahalı fiyat kârı artırır, kalite yetmezse puanı düşürür.</span></li>
     <li>${ic('clock')}<span><b>Sabır:</b> masadaki halka müşterinin sabrını gösterir: önce siparişin alınmasını, sonra yemeğini bekler. Halka kırmızıya dönmeden yetiş; yetişemezsen müşteri kızıp gider ve puanın düşer. Hızlı servis puanı yükseltir.</span></li>

   {t:'Stok ve toptancılar',art:`${itemArt('kahve1')}${ic('box')}${itemArt('sut1')}`,body:`<ul class="gsteps"><li>${ic('box')}<span><b>Stok:</b> her ürün tarifindeki malzemelerden 1’er birim harcar (ör. kurabiye = 1 un + 1 şeker). Bir malzeme biterse onu kullanan ürün satılamaz; hiçbir ürün satılamıyorsa müşteri gelmez.</span></li>
     <li>${ic('market')}<span><b>Toptancılar:</b> Menü → Stok → <b>Toptancıdan sipariş ver</b>. 5 toptancı var: ucuz olanın kalitesi düşük, pahalı olanın kalitesi yüksek. Kalite müşteri puanını, alış fiyatı kârını belirler. 25’li pakette %5, 50’li pakette %10 indirim.</span></li>

     <li>${ic('box')}<span><b>Otomatik tedarik:</b> Menü › Stok › Otomatik tedarik. İstediğin malzemeleri seç, her biri için toptancıyı (kaliteyi) belirle; stok azalınca sipariş kendiliğinden verilir. Toptancıyı istediğin an değiştirebilirsin.</span></li></ul>`},
   {t:'Kafe stratejisi',art:`${UI_IC.chart}${ic('coin')}${UI_IC.starF}`,body:`<ul class="gsteps"><li>${ic('coin')}<span><b>Ekonomik kafe:</b> ucuz toptancı + düşük fiyat. Çok müşteri gelir, müşteriler beklemeye daha hoşgörülüdür; ürün başı kâr düşüktür. Büyük ekip ve çok masa ile parlar.</span></li>

     <li>${UI_IC.chart}<span><b>Dengeli kafe:</b> orta toptancı + uygun fiyat. İstikrarlı puan ve kâr. Hangisinin daha iyi olduğu ekibine, masalarına ve puanına göre değişir; İşletme raporundan takip et.</span></li></ul>`},
   {t:'Gün, dükkan ve sen yokken',art:`${ic('sun')}${ic('lock')}${ic('coin')}`,body:`<ul class="gsteps"><li>${ic('sun')}<span><b>Gün döngüsü:</b> sabah, öğle, ikindi ve akşam sırayla gelir (bir gün ~20 dakika). Akşamın sonunda son siparişler alınır; gece dükkan kendiliğinden kapanır ve günün hasılat tablosu çıkar. <b>Tamam</b> deyince gece hızla geçer, sabah dükkan yeniden açılır.</span></li>
     <li>${ic('lock')}<span><b>Dükkanı kapat:</b> üstte seviye kartının yanındaki AÇIK/KAPALI tabelasına dokun. Yeni müşteri ve telefon gelmez, içerideki müşteriler hesabını ödeyip çıkar. Mekânı rahatça düzenlemek için idealdir.</span></li>
     <li>${ic('coin')}<span><b>Sen yokken:</b> oyunu dükkan açıkken kapatırsan ekibin kafeyi işletmeye devam eder (en fazla 8 saat, normal hızın %70’i, stok yettiği kadar). Geri dönünce <b>Hasılatı topla</b>. Dükkan kapalıysa satış olmaz.</span></li></ul>`},
   {t:'İstekler, VIP ve müdavimler',art:`${ic('star')}${ic('heart')}${ic('clock')}`,body:`<ul class="gsteps"><li>${ic('clock')}<span><b>Özel istek:</b> bazen bir kedi menünde olmayan bir ürünü ister. Süre bitmeden ürünü keşfet, aç ve menüye ekle; satınca büyük ödül kazanırsın. İsteğe dokununca nereye gideceğini gösterir.</span></li>
     <li>${ic('star')}<span><b>VIP gurme:</b> taçlı misafir. Pahalı ürünleri sever ve her zaman cömert bahşiş bırakır.</span></li>
     <li>${ic('heart')}<span><b>Müdavimler:</b> aynı kedi 6 kez gelirse müdavimin olur, 20 kez gelirse sadık müdavim. Müdavimler daha sık bahşiş bırakır, nadiren kaçar; sadık müdavim hiç kaçmaz.</span></li>
     <li>${ic('paw')}<span><b>Kaçak müşteri:</b> bazıları ödemeden kapıya koşar! Kasiyerin fark ederse koşup yakalar; fark etmezse kaçağın üstündeki ${tagb('paw','Yakala!')} düğmesine dokun.</span></li></ul>`},
   {t:'Geliştirmeler',art:`${ic('up')}${ic('coin')}${ic('chef')}${ic('bolt')}`,body:`<p>${tagb('market','Market','l')} → ${tagb('up','Geliştir','l')} sekmesinde kalıcı yükseltmeler var: ürünleri daha pahalıya sat, baristaları hızlandır, bahşişleri artır, enerji deposunu büyüt.</p><p>Oyun kapalıyken de ekibin çalışır: geri döndüğünde biriken altını toplarsın (en fazla 2 saatlik).</p>`},
   {t:'Ekip ve kıyafetler',art:`${ic('paw')}${ic('shirt')}<span class="ic">${clothIcon('bow_red')}</span><span class="ic">${clothIcon('hat_beret')}</span>`,body:`<p>${tagb('paw','Ekip','l')} menüsünde kedilerini düzenle: kürk, desen, göz, kulak, yüz, vücut ve isim. Her kedinin <b>bir ücretsiz görünüm değişikliği</b> var; sonrası ${CONFIG.edit.coins} altın ya da ${CONFIG.edit.gems} elmas. Önizleme ve vazgeçmek her zaman ücretsiz, isim değiştirmek de.</p>
     <p>${tagb('plus','İşçi bul','g')} ile ekibini büyüt ya da birini daha iyisiyle değiştir: en fazla 3 garson, 2 barista, 2 kasiyer. Her çalışanın hız, dayanıklılık ve ustalık yıldızı, bir de günlük maaşı vardır; maaşlar gün sonunda hasılattan düşülür. Yorulan çalışan kısa bir mola verir, işleri diğerleri üstlenir.</p>
     <p>Market’teki ${tagb('shirt','Kıyafet','l')} sekmesinde önlük, üst, şort, papyon, atkı, şapka ve takımlar var. Önce kedinin üstünde dene, sonra satın al; aldığın kıyafet kalıcı olarak senin.</p>`},
   {t:'Küçük ipuçları',art:`${ic('heart')}${ic('music')}${ic('speaker')}`,body:`<ul class="gsteps"><li>${ic('clock')}<span>Menü, Market, Tarifler, Birleştir ya da Ekip açıkken kafede zaman durur; telaşlanma.</span></li>
     <li>${ic('table')}<span>Kafen 2 dört kişilik ve 2 iki kişilik masayla (12 kişi) açılır; müşteriler tek, 2, 3 ya da 4 kişilik gruplar halinde gelir; seviye atladıkça daha fazla masa koyabilirsin.</span></li><li>${ic('music')}<span>Sağ üstteki düğmelerle müziği ve sesleri açıp kapatabilirsin.</span></li>
     <li>${ic('auto')}<span>Sağ alttaki <b>Otomatik garson</b> düğmesiyle garsonun işleri kendisi yapar; tekrar dokununca kontrol yine sende.</span></li>
     <li>${ic('help')}<span>Bu rehberi istediğin zaman sağ üstteki <b>?</b> düğmesinden tekrar açabilirsin.</span></li><li>${ic('box')}<span>Oyunun bu cihazda otomatik kaydedilir.</span></li></ul>`}]}
const GD={i:0,prev:'cafe'};
function openGuide(i=0){if(typeof authBadge==='function')authBadge();GD.prev=UI.mode==='guide'?GD.prev:UI.mode;GD.i=i;setMode('guide');renderGuide()}
function closeGuide(){if(!S.guideSeen){S.guideSeen=true;markDirty()}setMode(GD.prev&&GD.prev!=='guide'&&GD.prev!=='ce'?GD.prev:'cafe')}
function renderGuide(){const P=guidePages(),p=P[GD.i];const last=GD.i===P.length-1;
  $('gdBody').innerHTML=`<div class="gpage"><h3>${p.t}</h3><div class="gart">${p.art}</div>${p.body}</div>
    <div class="gdots">${P.map((_,k)=>`<i class="${k===GD.i?'on':''}"></i>`).join('')}</div>
    <div class="gnav"><button class="btn light" type="button" id="gdPrev" ${GD.i?'':'disabled'}>${ic('left')}Geri</button><span style="font-weight:800;font-size:12px;opacity:.7">${GD.i+1} / ${P.length}</span>
    <button class="btn ${last?'green':''}" type="button" id="gdNext">${last?ic('check')+'Hadi başlayalım!':'İleri'+ic('right')}</button></div>`;
  $('gdPrev').onclick=()=>{if(GD.i>0){GD.i--;renderGuide();$('guide').querySelector('.scroll').scrollTop=0}};
  $('gdNext').onclick=()=>{if(last)closeGuide();else{GD.i++;renderGuide();$('guide').querySelector('.scroll').scrollTop=0}}}
// kaydırma ile sayfa çevirme
{let sx=null;const el=$('guide');el.addEventListener('pointerdown',e=>{sx=e.clientX});el.addEventListener('pointerup',e=>{if(sx==null)return;const dx=e.clientX-sx;sx=null;if(Math.abs(dx)>60){const n=guidePages().length;if(dx<0&&GD.i<n-1){GD.i++;renderGuide()}else if(dx>0&&GD.i>0){GD.i--;renderGuide()}}})}

function buildPhone(){const g=new THREE.Group();const {x,z,h}=CASH;g.position.set(x+0.5,h,z-0.08);g.rotation.y=-0.35;

  const dial=new THREE.Mesh(new THREE.CylinderGeometry(0.032,0.032,0.012,16),T(0xfbf6ec));dial.position.set(0,0.055,0.018);g.add(dial);
  const hs=new THREE.Group();hs.position.set(0,0.075,-0.02);g.add(hs);const bar=new THREE.Mesh(new THREE.CylinderGeometry(0.014,0.014,0.17,8),T(0xd9534f));bar.rotation.z=Math.PI/2;hs.add(bar);
  for(const s of [-1,1]){const e=new THREE.Mesh(new THREE.SphereGeometry(0.026,10,8),T(0xd9534f));e.scale.y=0.7;e.position.x=s*0.08;hs.add(e)}

// ---------- kurye ----------
function spawnCourier(walkIn){if(COURIER)return COURIER;const cfg=S.chars.courier||(S.chars.courier=JSON.parse(JSON.stringify(COURIER_CFG)));
  const r=SkeletonUtils.clone(TEMPLATE);const ch=new Char(r,{run:false,xs:1});applyLook(r,cfg,1024);ch.o.traverse(o=>{if(o.isMesh){o.castShadow=true;o.frustumCulled=false}});
  ch.tray=makeTray();ch.avoidOf=walkersNear;COURIER={key:'courier',ch,i:2,busy:false};
  if(walkIn){ch.pos.set(DOOR_IN.x,0,DOOR_IN.z);ch.o.rotation.y=Math.PI/2;(async()=>{COURIER.busy=true;await ch.walkTo(COURIER_IDLE.x,COURIER_IDLE.z);await ch.face(COURIER_YAW);await ch.doFor('Wave_One_Hand',1.4);COURIER.busy=false})()}
  else{ch.pos.set(COURIER_IDLE.x,0,COURIER_IDLE.z);ch.o.rotation.y=COURIER_YAW}
  courierIdle();return COURIER}
async function courierIdle(){let t=0;while(COURIER){await sleep(0.5);if(COURIER.busy)continue;t+=0.5;if(t>14){t=0;await COURIER.ch.doFor('Idle_12',1.6)}}}

function newCall(){const av=availableRecipes();if(!av.length)return;const n=1+Math.floor(Math.random()*Math.min(CONFIG.dlv.maxItems,av.length+1));const items=[];
  for(let i=0;i<n;i++)items.push(av[Math.floor(Math.random()*av.length)]);const who=LOOKS[Math.floor(Math.random()*LOOKS.length)].name;
  DLV.call={id:++DLV.seq,who,addr:`${DLV_STREETS[Math.floor(Math.random()*DLV_STREETS.length)]} No ${2+Math.floor(Math.random()*40)}`,items,left:CONFIG.dlv.ring};sfx('chime');DLV.ringT=0}

  const rows=c.items.map(r=>`<li><img src="${productThumb(r.id)}" alt=""><span>${r.name}</span><b>${ic('coin')}${priceOf(r)}</b></li>`).join('');

    <div class="row"><button class="btn light" id="dlvNo" type="button">${ic('close')}Reddet</button><button class="btn green" id="dlvYes" type="button">${ic('check')}Siparişi al</button></div></div>`;

  $('dlvYes').onclick=()=>{if(done)return;done=true;close();acceptCall(c)}}
const dRnd=([a,b])=>a+Math.random()*(b-a);
function acceptCall(c){if(!c||DLV.call!==c||DLV.active)return false;const miss=stockShort(c.items);if(miss){sfx('nope');toast(`<b>Malzeme yetmiyor</b><br>${miss} bitti · Menü › Stok’tan toptancıya sipariş ver`,ic('box'),2800);return false}DLV.call=null;const d={id:c.id,who:c.who,addr:c.addr,items:c.items,orders:[],total:callTotal(c),paid:false,state:'PREP',acceptT:gameT};DLV.active=d;
  for(const r of c.items){const u=stockUse(r);const o={id:'D'+(++orderSeq),customer:null,delivery:d,table:null,seat:null,item:r,price:priceOf(r),qual:u.q,cost:u.c,state:'WAITING_FOR_PREPARATION',paid:false,mesh:null,slot:-1,pickupQueued:true,submitQueued:true};orders.push(o);d.orders.push(o);baristaQ.push(o)}
  sfx('order');courierSay('Siparişi hazırlayın!');toast(`<b>Paket sipariş alındı</b><br>${c.items.length} ürün · ${c.who}`,ic('box'),2400);bump('dlvAccepted')}
// ---------- paketleme + teslimat ----------
async function courierRun(d){const ch=COURIER.ch;COURIER.busy=true;d.state='PACK';
  const k=await claimSpot('pick',COURIER);const P=PICK_SPOTS[k];await ch.walkTo(P.x,P.z);await ch.face(COUNTER_FACE);
  // ürünler kraft kutuya girer
  const slots=d.orders.map(o=>o.slot).filter(s=>s>=0);const at=PICKUP_SLOTS[slots[0]]||PICKUP_SLOTS[0];
  const bx=new THREE.Group();const T=c=>new THREE.MeshToonMaterial({color:c,gradientMap:grad});const body=new THREE.Mesh(new RoundedBoxGeometry(0.2,0.12,0.16,2,0.015),T(0xc9a06a));body.position.y=0.06;bx.add(body);
  const tape=new THREE.Mesh(new THREE.BoxGeometry(0.205,0.02,0.04),T(0xd9534f));tape.position.y=0.115;bx.add(tape);bx.position.copy(at);bx.scale.setScalar(0.01);scene.add(bx);
  await tween(0.25,u=>bx.scale.setScalar(0.01+0.99*u));
  for(const o of d.orders){if(o.slot>=0){slotUsed[o.slot]=null;o.slot=-1}if(o.mesh){const m=o.mesh,f=m.position.clone(),s0=m.scale.clone();await tween(0.3,u=>{m.position.lerpVectors(f,at,u);m.position.y+=Math.sin(u*Math.PI)*0.08;m.scale.copy(s0).multiplyScalar(1-0.9*u)});scene.remove(m);o.mesh=null}o.state='PACKED'}
  sfx('clink');await ch.doFor('Idle_12',0.35);const tray=ch.tray;tray.visible=false;ch.carry=tray;await sleep(0.4);tray.visible=true;tray.add(bx);bx.position.set(0,tray.userData.top,0);bx.rotation.set(0,0,0);
  freeSpot('pick',COURIER);d.state='TRIP';courierSay('Yola çıkıyorum!',1.8);
  await ch.walkTo(DOOR_IN.x,DOOR_IN.z);sfx('door');await ch.walkTo(OUTSIDE.x,OUTSIDE.z,{direct:true});
  // paket motorun arka kutusuna konur, kurye motora biner ve sokaktan uzaklaşır
  tray.remove(bx);ch.carry=null;tray.visible=false;
  d.tripT=dRnd(CONFIG.dlv.trip)+d.items.length*3+16;d.tripTotal=d.tripT;let riding=true;(async()=>{while(riding){await sleep(0.25);d.tripT=Math.max(0,d.tripT-0.25)}})();
  await rideOut(ch);while(d.tripT>8)await sleep(0.25);d.state='BACK';await rideBack(ch);riding=false;d.tripT=0;
  await ch.walkTo(OUTSIDE.x,OUTSIDE.z,{direct:true});await ch.walkTo(DOOR_IN.x,DOOR_IN.z,{direct:true});dlvPay(d,new THREE.Vector3(DOOR_IN.x+0.4,1.3,DOOR_IN.z));
  await ch.walkTo(COURIER_IDLE.x,COURIER_IDLE.z);await ch.face(COURIER_YAW);DLV.active=null;DLV.cd=dRnd(CONFIG.dlv.gap)/dlvRate();COURIER.busy=false}
function dlvPay(d,p){if(d.paid)return;d.paid=true;for(const o of d.orders){o.paid=true;o.state='COMPLETED'}addCoins(d.total,'dlv');for(const o of d.orders)finEv('sold:'+o.item.id,1);finEv('dlv',1);finEv('cogs',d.orders.reduce((a,o)=>a+(o.cost||0),0));floatCoin(d.total,p);sfx('register');
  const tip=Math.random()<0.35?2+Math.floor(d.total*0.1):0;if(tip)setTimeout(()=>{addCoins(tip,'tip');sfx('tip');floatCoin(tip,p.clone().add(new THREE.Vector3(0,0.25,0)),true)},450);
  addXP(d.orders.reduce((a,o)=>a+CONFIG.xp.complete+Math.round(o.item.price*CONFIG.xp.perPrice),0));for(const o of d.orders)reqServed(o.item);bump('deliveries');afkEarn(d.total,1);rateDelivery(d,true);
  toast(`<b>Paket teslim edildi!</b><br>${d.who} · +${d.total}${tip?` +${tip} bahşiş`:''}`,ic('coin'),2600)}
// ---------- her kare ----------
function dlvTick(dt){const D=dlvState();
  if(!D.on){if(S.created&&S.tut==='done'&&S.lvl>=CONFIG.dlv.lvl&&UI.mode==='cafe'&&!UI.modal&&!lvQueue.length)dlvUnlock();return}
  if(!COURIER)spawnCourier(false);if(PHONE&&!PHONE.g.visible)PHONE.g.visible=true;if(!D.intro)return;
  if(DLV.call){DLV.call.left-=dt;DLV.ringT+=dt;if(DLV.ringT>1.6){DLV.ringT=0;sfx('chime')}
    if(PHONE){PHONE.hs.position.y=0.075+Math.abs(Math.sin(gameT*22))*0.02;PHONE.g.rotation.z=Math.sin(gameT*40)*0.04}
    if(DLV.call.left<=0){const c=DLV.call;DLV.call=null;DLV.cd=dRnd(CONFIG.dlv.gap);toast(`Cevapsız arama: ${c.who}`,ic('bell'),2200);bump('dlvMissed');rateDelivery(c,false);if($('dlvPanel')){$('dlvPanel').remove();UI.modal=false}}}
  else if(PHONE){PHONE.hs.position.y=0.075;PHONE.g.rotation.z=0}
  if(DLV.call&&S.auto)autoPhone();
  const d=DLV.active;if(d&&d.state==='PREP'&&d.orders.every(o=>o.state==='READY')&&!COURIER.busy){d.readyT=gameT;courierRun(d)}
  if(!DLV.call&&!DLV.active&&shopOpen()&&!lastCallNow()){DLV.cd-=dt*dlvRate();if(DLV.cd<=0)newCall()}}
// otomatik mod: telefonu KASİYER açar (kasa boşken; arama bitmek üzereyse kasada ödeme yoksa yine açar)
let PHONE_BUSY=false;
function autoPhone(){const c=DLV.call;if(PHONE_BUSY||!c||DLV.active||$('dlvPanel'))return;if(CONFIG.dlv.ring-c.left<1.4)return;
  const k=CSTAFF.find(k=>{const R=REGS[k.i];return k.ready&&!k.chasing&&!k.idleBusy&&!(typeof cashMoving!=='undefined'&&cashMoving)&&R&&!R.busy&&(!R.cust||c.left<6)});if(!k)return;
  PHONE_BUSY=true;k.ready=false;k.idleBusy=true;const ch=k.ch;
  (async()=>{try{await ch.faceTo(PHONE.g.position.x,PHONE.g.position.z);if(DLV.call!==c)return;
      // ahizeyi kaldırır, konuşur, kapatır
      const hs=PHONE.hs;let lift=true;const up=tween(0.3,u=>{hs.position.y=0.075+0.12*u});await up;
      await ch.doFor('IDLE_TALK',1.6);await tween(0.25,u=>{hs.position.y=0.195-0.12*u});lift=false;

    (async()=>{try{await fetchRun(ch)}catch(e){console.warn('koli',e)}finally{await ch.walkTo(COURIER_IDLE.x,COURIER_IDLE.z);await ch.face(COURIER_YAW);COURIER.busy=false}})();return}

// ================= AŞAMA 9: İŞLETME RAPORU (gelir · gider · kâr) =================
// Her altın hareketi addCoins üzerinden kategorisiyle kaydedilir (uydurma sayı yok). Olaylar (ağırlanan, kaybedilen,
// paket teslimi…) ayrıca sayılır. "Son 60 dk" = şu andan geriye kayan 60 dakikalık pencere (gerçek saat).
// Not: kayıtlar cihazda tutulur (prototip); üretimde ödemeler ve harcamalar sunucuda doğrulanmalıdır.
const FIN_IN={sale:'Masa satışları',sell:'Tahtadan satış',tip:'Bahşişler',dlv:'Paket satışları',afk:'Sen yokken hasılat',bonus:'Görev / istek ödülleri',other:'Diğer gelir'};
const FIN_OUT={stock:'Malzeme (toptancı)',staff:'Ekip (işe alım)',decor:'Mobilya ve dekor',equip:'Ekipman',upg:'Geliştirmeler',recipe:'Tarif açma',style:'Kıyafet ve stil',other:'Diğer gider'};
const FIN_KEEP=48*3600e3;
function finS(){const F=S.fin||(S.fin={tx:[],ev:[],tot:{},evTot:{},since:nowT()});if(!F.tx)F.tx=[];if(!F.ev)F.ev=[];if(!F.tot)F.tot={};if(!F.evTot)F.evTot={};return F}
function finTrim(a){const lim=nowT()-FIN_KEEP;let k=0;while(k<a.length&&a[k][0]<lim)k++;if(k)a.splice(0,k);if(a.length>8000)a.splice(0,a.length-8000)}
// altın hareketi: n>0 gelir, n<0 gider
function finRec(n,cat){if(!n||!S||!S.created)return;const F=finS();const io=n>0?'i':'o';const c=(n>0?FIN_IN:FIN_OUT)[cat]?cat:'other';
  F.tx.push([nowT(),io+':'+c,Math.abs(n)]);F.tot[io+':'+c]=(F.tot[io+':'+c]||0)+Math.abs(n);finTrim(F.tx)}
function finEv(k,n=1){if(!S||!S.created)return;const F=finS();F.ev.push([nowT(),k,n]);F.evTot[k]=(F.evTot[k]||0)+n;finTrim(F.ev);markDirty()}
// bir zaman penceresindeki toplamlar (dakika; null = tüm zamanlar)
function finWindow(mins){const F=finS(),out={inc:{},exp:{},ev:{},rev:0,cost:0};
  if(mins==null){for(const k in F.tot){const [io,c]=k.split(':');if(io==='i'){out.inc[c]=F.tot[k];out.rev+=F.tot[k]}else{out.exp[c]=F.tot[k];out.cost+=F.tot[k]}}Object.assign(out.ev,F.evTot);return out}
  const t0=nowT()-mins*60000;for(const [t,k,v] of F.tx){if(t<t0)continue;const [io,c]=k.split(':');if(io==='i'){out.inc[c]=(out.inc[c]||0)+v;out.rev+=v}else{out.exp[c]=(out.exp[c]||0)+v;out.cost+=v}}
  for(const [t,k,v] of F.ev){if(t<t0)continue;out.ev[k]=(out.ev[k]||0)+v}return out}
// saat saat (yerel saatle hizalı) son n saat
function finHours(n=8){const F=finS(),now=new Date(nowT());const h0=new Date(now);h0.setMinutes(0,0,0);const out=[];
  for(let i=n-1;i>=0;i--){const a=h0.getTime()-i*3600e3,b=a+3600e3;let r=0,c=0;for(const [t,k,v] of F.tx){if(t<a||t>=b)continue;if(k[0]==='i')r+=v;else c+=v}out.push({a,r,c,label:String(new Date(a).getHours()).padStart(2,'0')+':00',cur:i===0})}return out}

// Üst ve alt giysiler kürkün üstüne boyanmaz; gövdenin biraz dışında duran ayrı bir "kabuk" olarak üretilir.
// Kabuk, gövdenin kendi üçgenlerinden kesilir (aynı deri ağırlıkları → her harekette gövdeye kusursuz yapışık kalır),
// kenarları (yaka, kol ağzı, etek/paça) düzgün bir eğri boyunca kırpılır, kenarda kalınlık (kıvrık dikiş payı) ve
// gövdeye inen bir duvar olur. Önlük de giysinin üstünde ayrı bir katman olarak kalır.
const GM={ready:false};
function garmentPrep(){if(GM.ready)return;custPrepare();const g=CM.geo,n=g.attributes.position.count,SI=g.attributes.skinIndex,SW=g.attributes.skinWeight;

  const W=f=>{const o=new Float32Array(n);for(let i=0;i<n;i++){let t=0;for(let k=0;k<4;k++){const w=SW.getComponent(i,k);if(w>0&&f[SI.getComponent(i,k)])t+=w}o[i]=t}return o};
  GM.top=W(isTop);GM.arm=W(isArm);GM.fore=W(isFore);GM.hip=W(isHip);GM.leg=W(isLeg);GM.tail=new Float32Array(n);for(let i=0;i<n;i++)for(let k=0;k<4;k++)if(isTail[SI.getComponent(i,k)])GM.tail[i]=1;GM.neck=W(isNeck);
  // önlük köşeleri: köşenin doku noktasındaki piksel sınıfı (önlük = 4), komşu piksellerin çoğunluğu
  const M=posMap(1024),UV=g.attributes.uv.array;GM.apron=new Float32Array(n);
  for(let i=0;i<n;i++){const x=Math.floor(UV[i*2]*1024),y=Math.floor(UV[i*2+1]*1024);let a=0,c=0;
    for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const xx=x+dx,yy=y+dy;if(xx<0||yy<0||xx>=1024||yy>=1024)continue;const k=yy*1024+xx;if(!M.cls[k])continue;c++;if(M.cls[k]===4)a++}
    GM.apron[i]=c?a/c:0}

// Oturum açıksa kayıt hesaba bağlanır: telefon değişse de kafe kaybolmaz. Cihazdaki kayıt her zaman yedek olarak durur.
// Kural: hangi kayıt daha yeniyse (saveT) o geçerli. Bulut daha yeniyse yüklenir (oyun bir kez yeniden açılır);
// cihaz daha yeniyse buluta gönderilir. Başka hesabın kafesi bu cihazdaysa üstüne yazılmaz, yedeklenir.
const CLOUD={busy:false,dirty:false,timer:0,last:0,ok:null,synced:null,syncing:false};

async function cloudPush(force){clearTimeout(CLOUD.timer);CLOUD.timer=0;if(!cloudOn()||!S.created||CLOUD.busy||CLOUD.syncing)return;if(!CLOUD.dirty&&!force)return;
  if(CLOUD.synced!==SB.user.id)return;   // önce eşitleme bitmeli (yoksa başka hesabın/eski kayıt yazılabilir)
  if(S.owner&&S.owner!==SB.user.id)return;   // başka hesabın kafesi: bu hesaba yazılmaz
  CLOUD.busy=true;CLOUD.dirty=false;
  try{S.owner=SB.user.id;const sb=await sbClient();const {error}=await sb.from('saves').upsert(cloudRow());if(error)throw error;CLOUD.last=Date.now();CLOUD.ok=true}
  catch(e){console.warn('bulut kayıt',e);CLOUD.ok=false;CLOUD.dirty=true;CLOUD.timer=setTimeout(()=>cloudPush(),60000)}
  finally{CLOUD.busy=false}}
function cloudBackup(){try{const raw=localStorage.getItem(SAVE_KEY);if(raw)localStorage.setItem(CLOUD_BAK,JSON.stringify({t:Date.now(),data:raw}))}catch(e){}}
function cloudApply(data,msg){cloudBackup();RESETTING=true;clearTimeout(saveTimer);try{localStorage.setItem(SAVE_KEY,JSON.stringify(data))}catch(e){RESETTING=false;return false}

  try{let reset=false;try{reset=localStorage.getItem(CLOUD_RESET)==='1';if(reset)localStorage.removeItem(CLOUD_RESET)}catch(e){}
    if(reset){S.owner=uid;CLOUD.synced=uid;CLOUD.syncing=false;return cloudPush(true)}   // oyuncu kafesini sıfırladı: bulut da sıfırlanır
    const sb=await sbClient();const {data:row,error}=await sb.from('saves').select('data,save_t').eq('user_id',uid).maybeSingle();if(error)throw error;
    const other=!!(S.owner&&S.owner!==uid),fresh=localFresh();
    if(!row){if(other&&!fresh){cloudBackup();RESETTING=true;try{localStorage.removeItem(SAVE_KEY)}catch(e){}toast('Bu hesap için yeni bir kafe açılıyor…',ic('paw'),2500);setTimeout(()=>location.reload(),900);return}
      S.owner=uid;CLOUD.synced=uid;CLOUD.syncing=false;return cloudPush(true)}
    const ct=+row.save_t||0,lt=+S.saveT||0;
    // sahipsiz (misafirken oynanmış) cihaz kafesi ile hesaptaki kafe ikisi de doluysa: oyuncuya sorulur
    if(!other&&!fresh&&!S.owner&&row.data&&row.data.created){const pick=await cloudAsk(row.data);if(pick==='cloud'){CLOUD.synced=uid;cloudApply(row.data);return}
      CLOUD.synced=uid;S.owner=uid;CLOUD.syncing=false;return cloudPush(true)}
    if(other||fresh||ct>lt+3000){if(row.data&&typeof row.data==='object'){CLOUD.synced=uid;cloudApply(row.data);return}}
    CLOUD.synced=uid;S.owner=uid;if(lt>ct+3000){CLOUD.syncing=false;return cloudPush(true)}}

// Her gün (Türkiye saatiyle) 4 görev; ilerleme o günün başındaki değerlerden sayılır. Her görev altın, hepsi bitince elmas.
const todayKey=()=>{const d=new Date(Date.now()+3*36e5);return d.toISOString().slice(0,10)};
const DQ_KIND={serve:{t:n=>`${n} müşteriye servis yap`,i:'i_cloche'},coins:{t:n=>`${n} altın kazan`,i:'i_coin'},merge:{t:n=>`${n} kez birleştir`,i:'i_sparkle'},bag:{t:n=>`Torbalara ${n} kez dokun`,i:'i_gift'},order:{t:n=>`${n} sipariş tamamla`,i:'i_cup'}};
function dqCount(k){const D=S.daily;if(!D)return 0;const c=D.c||{};if(k==='serve')return Math.max(0,((S.rep&&S.rep.served)|0)-(D.b.serve|0));if(k==='order')return Math.max(0,((S.stats&&S.stats.orders)|0)-(D.b.order|0));return c[k]|0}
function dqEnsure(){const k=todayKey();if(S.daily&&S.daily.day===k)return S.daily;const L=Math.max(1,S.lvl|0);
  const seed=[...k].reduce((a,ch)=>(a*31+ch.charCodeAt(0))>>>0,7);const pick=['serve','coins','merge','bag','order'].sort((a,b)=>((seed>>a.length)&3)-((seed>>b.length)&3)).slice(0,4);
  const goal={serve:6+L*2,coins:80+L*40,merge:8+L,bag:10+L,order:5+L*2};
  S.daily={day:k,b:{serve:(S.rep&&S.rep.served)|0,order:(S.stats&&S.stats.orders)|0},c:{},q:pick.map(id=>({id,n:goal[id],r:30+L*12,got:false})),bonus:false};markDirty();return S.daily}
function dqAdd(k,n=1){if(EVMODE||!S.created)return;const D=dqEnsure();D.c[k]=(D.c[k]|0)+n}
{const _ac=addCoins;addCoins=function(n,cat){const r=_ac.apply(this,arguments);if(n>0&&cat!=='daily'&&cat!=='mail'&&cat!=='bonus'&&cat!=='event')try{dqAdd('coins',n)}catch(e){}return r}}
{const _dm=doMerge;doMerge=function(src,dst){const b=S.board[dst],a=S.board[src];const r=_dm.apply(this,arguments);try{if(b&&a&&S.board[dst]!==b&&S.board[src]==null)dqAdd('merge')}catch(e){}return r}}
{const _tb=tapBag;tapBag=function(i){const e0=S.energy&&S.energy.v;const r=_tb.apply(this,arguments);try{if(S.energy&&S.energy.v<e0)dqAdd('bag')}catch(e){}return r}}
const dqReady=()=>{if(EVMODE||!S.created||S.tut!=='done')return 0;const D=dqEnsure();return D.q.filter(q=>!q.got&&dqCount(q.id)>=q.n).length+(!D.bonus&&D.q.every(q=>q.got)?1:0)};
function openDaily(){const W=skWin('skDaily','Günlük Görevler','cat_bowl');const draw=()=>{const D=dqEnsure();
    W.body.innerHTML=D.q.map((q,i)=>{const c=Math.min(q.n,dqCount(q.id)),ok=c>=q.n,K=DQ_KIND[q.id];return `<div class="skq${q.got?' done':''}">${uiIc(K.i)}<div class="qt"><b>${K.t(q.n)}</b><div class="qbar"><i style="width:${c/q.n*100}%"></i></div><small>${c}/${q.n} · ödül ${uiIc('i_coin')}${q.r}</small></div>
      ${q.got?uiIc('d_check'):`<button class="skbtn ${ok?'green':'cream'}" type="button" data-dq="${i}" ${ok?'':'disabled'}>${ok?'Al':'Devam'}</button>`}</div>`}).join('');
    const all=D.q.every(q=>q.got);W.foot.innerHTML=`<p>Gün bitince görevler yenilenir · hepsini bitirince ${uiIc('i_gem')} 3 elmas</p><button class="skbtn ${all&&!D.bonus?'green':'cream'} big" type="button" id="dqBonus" ${all&&!D.bonus?'':'disabled'}>${uiIc('i_gift')}${D.bonus?'Bugünün hediyesi alındı':'Günün hediyesi · 3 elmas'}</button>`;
    W.body.querySelectorAll('[data-dq]').forEach(b=>b.onclick=()=>{const q=D.q[+b.dataset.dq];if(q.got||dqCount(q.id)<q.n)return;q.got=true;addCoins(q.r,'daily');sfx('coin');markDirty();saveNow();draw()});
    const bb=$('dqBonus');if(bb)bb.onclick=()=>{if(D.bonus||!D.q.every(q=>q.got))return;D.bonus=true;S.gems+=3;try{hudGems()}catch(e){}sfx('levelup');markDirty();saveNow();toast('<b>Günün hediyesi</b><br>3 elmas kazandın',uiIc('i_gem'),2200);draw()}};
  draw()}

async function mailLoad(force){if(MAIL.busy||(!force&&Date.now()-MAIL.t<5*60e3))return;MAIL.busy=true;

  const draw=()=>{W.body.innerHTML=MAIL.list.length?MAIL.list.map(m=>{const rw=(m.reward_coins|0)+(m.reward_gems|0)>0,got=ms.got[m.id];const d=new Date(m.created_at);

    // başlık ve metin kullanıcı verisi gibi düz metin olarak

    W.body.querySelectorAll('[data-mg]').forEach(b=>b.onclick=()=>{const m=MAIL.list.find(x=>String(x.id)===b.dataset.mg);if(!m||ms.got[m.id])return;ms.got[m.id]=1;ms.read[m.id]=1;
      if(m.reward_coins)addCoins(Math.min(100000,m.reward_coins|0),'mail');if(m.reward_gems){S.gems+=Math.min(1000,m.reward_gems|0);try{hudGems()}catch(e){}}sfx('coin');markDirty();saveNow();draw();const el=W.body.querySelector(`[data-mid="${m.id}"]`);if(el)el.classList.add('open')});
    W.foot.innerHTML=`<button class="skbtn cream big" type="button" id="mailRef">${uiIc('i_refresh')}Yenile</button>`;$('mailRef').onclick=async()=>{await mailLoad(true);draw()}};

function applyState(){try{expandMigrate()}catch(e){}if(S.room)setRoom({x0:S.room.x0??RM.x0,x1:S.room.x1??RM.x1,z0:S.room.z0??RM.z0,z1:S.room.z1??RM.z1});   // genişletilmiş kafe: eşyalardan önce oda kurulur
  try{layoutBoot()}catch(e){console.warn('yerleşim',e)}
  applyWall(S.wall);applyFloor(S.floor);for(const k in S.equip)if(S.equip[k]!==1)setEquip(k,S.equip[k]);
  let moved=0,stored=0;
  for(const rec of S.furniture)if(!rec.stored){const k=CAT[rec.id].kind;if(k==='walldecor'&&(rec.slot==null||rec.slot<0))continue;
    if(k!=='walldecor'&&validatePlacement(rec,rec.uid)){const o={x:rec.x,z:rec.z,rot:rec.rot};let ok=false;
      outer:for(let r=0.35;r<6;r+=0.35)for(let a=0;a<16;a++){const t=a/16*Math.PI*2;for(const rot of [rec.rot||0,(rec.rot||0)+1]){rec.x=Math.round((o.x+Math.cos(t)*r)*20)/20;rec.z=Math.round((o.z+Math.sin(t)*r)*20)/20;rec.rot=rot%4;if(!validatePlacement(rec,rec.uid)){ok=true;break outer}}}
      if(ok)moved++;else{Object.assign(rec,o);rec.stored=true;stored++;continue}}
    spawnFurn(rec)}
  refreshWorld();if(moved||stored){markDirty();setTimeout(()=>toast(`Kasa için yer açıldı: ${moved?moved+' eşya taşındı':''}${moved&&stored?', ':''}${stored?stored+' eşya depoya kaldırıldı':''}`,ic('box'),4200),1500)}
  if(S._moved7){delete S._moved7;markDirty();setTimeout(()=>toast('<b>Kafen yenilendi!</b><br>Artık 2 dört kişilik ve 2 iki kişilik masan var (12 kişi). Eski masaların Market → Depom’da.',ic('table'),5200),2500)}
  hudXP();hudCoins();hudGoal();hudGems()}
