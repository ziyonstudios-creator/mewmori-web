[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

  h+='<div class="card"><h2>Katılımcıya özel form bağlantıları</h2><div class="row" style="margin-bottom:8px"><input class="txt" id="ara" placeholder="E-posta ara" style="flex:1;min-width:180px"><button class="btn" type="button" id="kopTum">Tümünü CSV olarak indir (e-posta, platform, bağlantı)</button></div><div id="liste"><p class="no">Yükleniyor…</p></div></div>';
  $('s-davet').innerHTML=h;
  $('s-davet').querySelectorAll('[data-kay]').forEach(function(b){b.onclick=function(){var k=b.dataset.kay,v=$('a_'+k).value.trim();b.disabled=true;SB.rpc('bf_yonetim_ayar',{p_key:k,p_val:v}).then(function(x){b.disabled=false;if(x.error||!x.data.ok)hataG('Kaydedilemedi: '+(x.error?x.error.message:x.data.err==='link'?'bağlantı https:// ile başlamalı':x.data.err));else{hataG('');D.ayarlar[k]=v;b.textContent='Kaydedildi ✓';setTimeout(function(){b.textContent='Kaydet'},1500)}})}});
  $('s-davet').querySelectorAll('[data-kop]').forEach(function(b){b.onclick=function(){kopyala($(b.dataset.kop).value,b)}});
  var L=function(){var q=($('ara').value||'').toLowerCase(),l=LINK.filter(function(x){return !q||x.email.indexOf(q)>=0});
    $('liste').innerHTML='<p class="no" style="margin:0 0 6px">'+LINK.length+' katılımcı · '+LINK.filter(function(x){return x.tamam}).length+' formu doldurdu</p><div style="overflow-x:auto"><table><thead><tr><th>#</th><th>E-posta</th><th>Platform</th><th>Dil</th><th>Form</th><th>Kişisel bağlantı</th></tr></thead><tbody>'+
      l.slice(0,400).map(function(x){var u=FORM+'?k='+x.token;return '<tr><td>'+x.id+'</td><td>'+esc(x.email)+'</td><td>'+esc(x.platform)+'</td><td>'+esc(x.dil)+'</td><td>'+(x.tamam?'<span class="ok">Doldurdu</span>':'<span class="no">Bekliyor</span>')+'</td><td><button class="btn" type="button" data-u="'+esc(u)+'">Kopyala</button></td></tr>'}).join('')+'</tbody></table></div>'+(l.length>400?'<p class="no">İlk 400 gösteriliyor; aramayı daralt.</p>':'');
    $('liste').querySelectorAll('[data-u]').forEach(function(b){b.onclick=function(){kopyala(b.dataset.u,b)}})};
  $('ara').oninput=function(){if(LINK)L()};
  $('kopTum').onclick=function(){if(!LINK)return;indir('tabbychef-beta-baglantilari.csv',[['id','email','platform','dil','form_dolduruldu','kisisel_baglanti']].concat(LINK.map(function(x){return [x.id,x.email,x.platform,x.dil,x.tamam?'evet':'hayir',FORM+'?k='+x.token]})))};
  if(LINK)L();else SB.rpc('bf_yonetim_baglantilar').then(function(x){if(x.error||!x.data.ok){hataG('Bağlantılar alınamadı: '+(x.error?x.error.message:x.data.err));return}LINK=x.data.liste;L()})}
function kurucuCiz(){var a=D.ayarlar||{};$('s-kurucu').innerHTML='<div class="card"><h2>Kurucu Şef hak sahipliği</h2><div class="kpi"><div><small>Hak sahibi beta katılımcısı</small><b>'+D.kurucu+'</b><em>Geri bildirim cevaplarından bağımsız</em></div></div>'+
  '<p>Planlanan ödüller: Kurucu Şef Önlüğü, Kurucu Şef Şapkası, Altın Pati Heykeli, kalıcı Kurucu Şef Rozeti, altın ve elmas hediyesi.</p><p class="no">Hak kaydı beta kaydına bağlıdır; oyun ilerlemesi sıfırlansa da silinmez. Olumsuz cevap vermek hakkı etkilemez. Dağıtım otomatik başlatılmaz.</p>'+
  [['kurucu_altin','Altın miktarı (henüz belirlenmedi)'],['kurucu_elmas','Elmas miktarı (henüz belirlenmedi)']].map(function(x){return '<div class="ayar"><label for="a_'+x[0]+'">'+x[1]+'</label><input class="txt" id="a_'+x[0]+'" inputmode="numeric" value="'+esc(a[x[0]]||'')+'" placeholder="boş = belirlenmedi"><button class="btn" type="button" data-kay="'+x[0]+'">Kaydet</button><span></span></div>'}).join('')+'</div>';
  $('s-kurucu').querySelectorAll('[data-kay]').forEach(function(b){b.onclick=function(){var k=b.dataset.kay,v=$('a_'+k).value.trim();SB.rpc('bf_yonetim_ayar',{p_key:k,p_val:v}).then(function(x){if(x.error||!x.data.ok)hataG('Kaydedilemedi: '+(x.error?x.error.message:x.data.err==='sayi'?'yalnız sayı':x.data.err));else{hataG('');D.ayarlar[k]=v;b.textContent='Kaydedildi ✓';setTimeout(function(){b.textContent='Kaydet'},1500)}})}})}
function kopyala(s,b){var ok=function(){var t=b.textContent;b.textContent='Kopyalandı ✓';setTimeout(function(){b.textContent=t},1400)};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(s).then(ok,function(){yedek()});else yedek();
  function yedek(){var t=document.createElement('textarea');t.value=s;document.body.appendChild(t);t.select();try{document.execCommand('copy');ok()}catch(e){prompt('Kopyala:',s)}t.remove()}}
function csvH(v){v=v==null?'':String(v);return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function indir(ad,rows){var s='﻿'+rows.map(function(r){return r.map(csvH).join(',')}).join('\r\n');var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv;charset=utf-8'}));a.download=ad;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)}
$('csv').onclick=function(){if(!D)return;var R=D.cevaplar.filter(function(r){return F.test||!r.test});var h=['id','katilimci_id','tarih','dil','oyun_surumu','form_surumu','platform','test'];Q.forEach(function(q){h.push(q[0]+'_id',q[0]+'_cevap')});h.push('yorum','etiketler','durum');
  indir('tabbychef-beta-geri-bildirim-'+new Date().toISOString().slice(0,10)+'.csv',[h].concat(R.map(function(r){var x=[r.id,r.beta_id,r.created_at,r.dil,r.oyun_surumu,r.form_surumu,r.platform,r.test?'evet':'hayir'];Q.forEach(function(q){x.push(r[q[0]],ad(q[0],r[q[0]]))});x.push(r.yorum,(r.etiketler||[]).join('|'),r.durum);return x})))};
document.querySelectorAll('.tabs [data-t]').forEach(function(b){b.onclick=function(){SEK=b.dataset.t;document.querySelectorAll('.tabs [data-t]').forEach(function(x){x.setAttribute('aria-pressed',String(x===b))});['ozet','yorum','davet','kurucu'].forEach(function(s){$('s-'+s).hidden=s!==SEK});$('filtre').hidden=SEK==='davet'||SEK==='kurucu';ciz()}});
document.querySelectorAll('[data-f]').forEach(function(b){b.onclick=function(){F[b.dataset.f]=!F[b.dataset.f];b.setAttribute('aria-pressed',String(F[b.dataset.f]));ciz()}});
['fBas','fBit','fDil','fVer'].forEach(function(i){$(i).onchange=ciz});
$('yenile').onclick=yukle;
function yukle(){hataG('');return SB.rpc('bf_yonetim_veri').then(function(x){if(x.error){hataG('Veri alınamadı: '+x.error.message);return}if(!x.data.ok){yetkisiz();return}D=x.data;
    var v={};D.cevaplar.forEach(function(r){v[r.oyun_surumu||'—']=1});var s=$('fVer'),c=s.value;s.innerHTML='<option value="">Hepsi</option>'+Object.keys(v).sort().map(function(k){return '<option'+(k===c?' selected':'')+'>'+esc(k)+'</option>'}).join('');
    $('panel').hidden=false;ciz()})}
function yetkisiz(){$('panel').hidden=true;$('giris').hidden=true;hataG('Bu hesabın yönetici yetkisi yok. Yetkili bir hesapla giriş yap.')}
function oturum(s){if(!s){$('giris').hidden=false;$('panel').hidden=true;$('cikis').hidden=true;$('kim').textContent='';return}
  $('giris').hidden=true;$('cikis').hidden=false;$('kim').textContent=s.user.email||'';
  SB.rpc('bf_yonetici').then(function(x){if(x.error){hataG('Yetki kontrol edilemedi: '+x.error.message);return}if(x.data!==true){yetkisiz();return}yukle()})}
$('cikis').onclick=function(){SB.auth.signOut().then(function(){D=null;LINK=null;hataG('');oturum(null)})};
$('gb').onclick=function(){var e=$('ge').value.trim(),p=$('gs').value;$('gm').innerHTML='';SB.auth.signInWithPassword({email:e,password:p}).then(function(r){if(r.error)$('gm').innerHTML='<div class="msg err">Giriş yapılamadı: '+esc(r.error.message)+'</div>'})};
$('gs').onkeydown=function(e){if(e.key==='Enter')$('gb').click()};
function oauth(p){SB.auth.signInWithOAuth({provider:p,options:{redirectTo:location.origin+location.pathname}}).then(function(r){if(r.error)$('gm').innerHTML='<div class="msg err">'+esc(r.error.message)+'</div>'})}
$('gg').onclick=function(){oauth('google')};$('ga').onclick=function(){oauth('apple')};
SB.auth.onAuthStateChange(function(ev,s){if(ev==='SIGNED_IN'||ev==='SIGNED_OUT'||ev==='INITIAL_SESSION')oturum(s)});
})();
</script>
